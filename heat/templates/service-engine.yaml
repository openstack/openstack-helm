{{/*
The governing service shares manifests.statefulset_engine rather than
carrying its own key: a StatefulSet whose serviceName names a service that
does not exist has no per-ordinal DNS, so the two are never useful apart.
*/}}
{{- if .Values.manifests.statefulset_engine }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: heat-engine
spec:
  # Named by the heat-engine StatefulSet's serviceName. It publishes the
  # per-ordinal DNS names (heat-engine-0.heat-engine...) for the stable pod
  # hostnames the StatefulSet provides. heat-engine listens on nothing, so
  # the service is headless and declares no ports, which Kubernetes allows
  # only for a headless service.
  clusterIP: None
  selector:
{{ tuple $envAll "heat" "engine" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
