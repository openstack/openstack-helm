{{- /*
MariaDB custom resources declaring the database this chart owns. They are
reconciled by the mariadb chart's db controller, which creates the database,
the account and its grants, and writes the connection details into the secret
named below.

Enable this instead of the db-init job. Horizon is not an oslo.config service,
so the Connection renders a Django settings snippet instead of a connection
string. The pods project the secret into
/etc/openstack-dashboard/local_settings.d and the start script links the
snippet into the Horizon local_settings.d, where it defines DATABASES. The
password is then not rendered into the horizon-etc secret.
*/}}
{{- if .Values.manifests.mariadb_db }}
{{- $envAll := . }}
{{- if .Values.manifests.job_db_init }}
{{- fail "manifests.mariadb_db and manifests.job_db_init are mutually exclusive, set manifests.job_db_init to false" }}
{{- end }}
{{- /*
The API group is chosen in values, so the same resources can be reconciled
either by the mariadb chart's own db controller or by the upstream
mariadb-operator. Two things differ between the two targets:
Connection.retryInterval does not exist upstream and is omitted, and the
password placeholder is .PasswordEncoded here but .Password upstream, which
renders no percent-encoded variant. A password containing a character that is
reserved in a URI therefore needs the osh group.
*/}}
{{- $apiGroup := .Values.mariadb_db.api_group }}
{{- $osh := eq $apiGroup "mariadb.osh.openstack.org" }}
{{- if not (or $osh (eq $apiGroup "k8s.mariadb.com")) }}
{{- fail (printf "mariadb_db.api_group must be mariadb.osh.openstack.org or k8s.mariadb.com, not %s" $apiGroup) }}
{{- end }}
{{- $apiVersion := printf "%s/v1alpha1" $apiGroup }}
{{- $mariadbHost := index .Values.endpoints.oslo_db.hosts "default" }}
{{- /* The MariaDB resource to attach to. Its name need not match the service
clients connect through, which is what $mariadbHost is. */}}
{{- $mariadbRef := .Values.mariadb_db.mariadb_ref | default $mariadbHost }}
{{- $auth := .Values.endpoints.oslo_db.auth.horizon }}
{{- $passwordSecret := .Values.mariadb_db.password_secret }}

{{- /*
One account for the horizon database. Its password is read from a secret. By
default the chart renders that secret from endpoints.oslo_db.auth.horizon,
which puts the password in the Helm values. Set
mariadb_db.password_secret.create to false to reference a secret that already
exists, such as one synced from an external secret store.
*/}}
{{- if $passwordSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $passwordSecret.name }}
  labels:
{{ tuple $envAll "horizon" "db-password" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
type: Opaque
data:
  {{ $passwordSecret.key }}: {{ $auth.password | b64enc }}
{{- end }}
---
apiVersion: {{ $apiVersion }}
kind: User
metadata:
  name: {{ $auth.username | replace "_" "-" | lower }}
  labels:
{{ tuple $envAll "horizon" "db-user" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
    waitForIt: true
  {{- /* Only set spec.name when the MariaDB name is not a valid object
  name, such as one with an underscore. It defaults to metadata.name. */}}
  {{- if ne ($auth.username | replace "_" "-" | lower) $auth.username }}
  name: {{ $auth.username | quote }}
  {{- end }}
  host: "%"
  passwordSecretKeyRef:
    name: {{ $passwordSecret.name }}
    key: {{ $passwordSecret.key }}
  {{- /* 0 means unlimited. Anything else throttles the service. */}}
  maxUserConnections: 0
{{- if .Values.tls.oslo_db }}
  require:
    x509: true
{{- end }}
  cleanupPolicy: {{ .Values.mariadb_db.cleanup_policy }}
  retryInterval: 10s

{{- /* The horizon database. */}}
{{- $dbName := .Values.endpoints.oslo_db.path | trimPrefix "/" }}
---
apiVersion: {{ $apiVersion }}
kind: Database
metadata:
  name: {{ $dbName | replace "_" "-" | lower }}
  labels:
{{ tuple $envAll "horizon" "db-database" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
    waitForIt: true
  {{- /* Only set spec.name when the MariaDB name is not a valid object
  name, such as one with an underscore. It defaults to metadata.name. */}}
  {{- if ne ($dbName | replace "_" "-" | lower) $dbName }}
  name: {{ $dbName | quote }}
  {{- end }}
  characterSet: utf8
  collate: utf8_general_ci
  cleanupPolicy: {{ .Values.mariadb_db.cleanup_policy }}
  retryInterval: 10s
---
apiVersion: {{ $apiVersion }}
kind: Grant
metadata:
  name: horizon
  labels:
{{ tuple $envAll "horizon" "db-grant" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
    waitForIt: true
  privileges:
    - ALL
  database: {{ $dbName | quote }}
  table: "*"
  username: {{ $auth.username | quote }}
  host: "%"
  grantOption: false
  cleanupPolicy: {{ .Values.mariadb_db.cleanup_policy }}
  retryInterval: 10s
---
apiVersion: {{ $apiVersion }}
kind: Connection
metadata:
  name: horizon-db-conn
  labels:
{{ tuple $envAll "horizon" "db-connection" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
  serviceName: {{ $mariadbHost | quote }}
  host: {{ tuple "oslo_db" "internal" $envAll | include "helm-toolkit.endpoints.endpoint_host_lookup" | quote }}
  port: {{ tuple "oslo_db" "internal" "mysql" $envAll | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
  username: {{ $auth.username | quote }}
  passwordSecretKeyRef:
    name: {{ $passwordSecret.name }}
    key: {{ $passwordSecret.key }}
  database: {{ $dbName | quote }}
  secretName: horizon-db-conn
  secretTemplate:
    {{- /* A Django settings snippet rather than an oslo.config one. The key must
    end in .py for the start script to link it into local_settings.d. The
    placeholders are rendered by the controller, not by Helm, so they are
    escaped here. The osh group percent-encodes the password, which also makes
    it safe inside a Python string literal, so the snippet decodes it, and
    leaves the import unused upstream. The upstream group has no encoded variant, so a password containing a quote or
    a backslash needs the osh group. */}}
    key: _10_database.py
    format: |
      from urllib.parse import unquote

      DATABASES = {
          'default': {
              'ENGINE': 'django.db.backends.mysql',
              'NAME': '{{ `{{ .Database }}` }}',
              'USER': '{{ `{{ .Username }}` }}',
              'PASSWORD': {{ if $osh }}unquote('{{ `{{ .PasswordEncoded }}` }}'){{ else }}'{{ `{{ .Password }}` }}'{{ end }},
              'HOST': '{{ `{{ .Host }}` }}',
              'PORT': '{{ `{{ .Port }}` }}',
              'default-character-set': 'utf8',
              {{- if .Values.tls.oslo_db }}
              'OPTIONS': {
                  'ssl': {
                      'ca': '/etc/mysql/certs/ca.crt',
                      'cert': '/etc/mysql/certs/tls.crt',
                      'key': '/etc/mysql/certs/tls.key'
                  }
              },
              {{- end }}
          }
      }
  healthCheck:
    interval: 30s
    retryInterval: 3s
{{- if $osh }}
  {{- /* Not a field upstream has; it paces the osh controller's retries. */}}
  retryInterval: 10s
{{- end }}
{{- end }}
