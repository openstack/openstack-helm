{{/*
The governing service shares manifests.statefulset_conductor rather than
carrying its own key: a StatefulSet whose serviceName names a service that
does not exist has no per-ordinal DNS, so the two are never useful apart.
*/}}
{{- if .Values.manifests.statefulset_conductor }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: ironic-conductor
spec:
  # Named by the conductor StatefulSet's serviceName. It publishes the
  # per-ordinal DNS names (ironic-conductor-0.ironic-conductor...). The
  # conductor consumes from RabbitMQ, and its PXE and HTTP containers serve
  # the provisioning network directly (on the host network by default), so
  # nothing reaches it through this service: it is headless and declares no
  # ports, which Kubernetes allows only for a headless service.
  clusterIP: None
  selector:
{{ tuple $envAll "ironic" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
