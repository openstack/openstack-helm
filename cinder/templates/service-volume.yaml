{{/*
The governing service shares manifests.statefulset_volume rather than
carrying its own key: a StatefulSet whose serviceName names a service that
does not exist has no per-ordinal DNS, so the two are never useful apart.
*/}}
{{- if .Values.manifests.statefulset_volume }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: cinder-volume
spec:
  # Named by the cinder-volume StatefulSet's serviceName. It publishes the
  # per-ordinal DNS names (cinder-volume-0.cinder-volume...) for the stable
  # pod hostnames the StatefulSet provides. cinder-volume listens on
  # nothing, so the service is headless and declares no ports, which
  # Kubernetes allows only for a headless service.
  clusterIP: None
  selector:
{{ tuple $envAll "cinder" "volume" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
