{{- if .Values.manifests.cron_job_run_tests }}

{{- $envAll := . }}

{{- $serviceAccountName := "tempest-cron-run-tests" }}
{{ tuple $envAll "cron_run_tests" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cron-run-tests
  labels:
{{ tuple $envAll "tempest" "cron-run-tests" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
spec:
  schedule: {{ .Values.jobs.cron_run_tests.cron | quote }}
  successfulJobsHistoryLimit: {{ .Values.jobs.cron_run_tests.history.success }}
  failedJobsHistoryLimit: {{ .Values.jobs.cron_run_tests.history.failed }}
  {{- if .Values.jobs.cron_run_tests.starting_deadline }}
  startingDeadlineSeconds: {{ .Values.jobs.cron_run_tests.starting_deadline }}
  {{- end }}
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
{{ tuple $envAll "tempest" "cron-run-tests" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
    spec:
      backoffLimit: {{ .Values.jobs.cron_run_tests.backoffLimit }}
      template:
        metadata:
          labels:
{{ tuple $envAll "tempest" "cron-run-tests" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 12 }}
        spec:
          serviceAccountName: {{ $serviceAccountName }}
          restartPolicy: {{ .Values.jobs.cron_run_tests.restartPolicy }}
          nodeSelector:
            {{ .Values.labels.job.node_selector_key }}: {{ .Values.labels.job.node_selector_value }}
          initContainers:
{{ tuple $envAll "cron_run_tests" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 12 }}
            - name: tempest-cron-run-tests-init
{{ tuple $envAll "tempest_run_tests" | include "helm-toolkit.snippets.image" | indent 14 }}
{{ tuple $envAll $envAll.Values.pod.resources.jobs.cron_run_tests | include "helm-toolkit.snippets.kubernetes_resources" | indent 14 }}
              securityContext:
                runAsUser: 0
              command:
                - chown
                - -R
                - "root:"
                - /var/lib/tempest/data
              volumeMounts:
                - name: pod-tmp
                  mountPath: /tmp
                - name: tempest-reports
                  mountPath: /var/lib/tempest/data
          containers:
            - name: tempest-cron-run-tests
{{ tuple $envAll "tempest_run_tests" | include "helm-toolkit.snippets.image" | indent 14 }}
{{ tuple $envAll $envAll.Values.pod.resources.jobs.cron_run_tests | include "helm-toolkit.snippets.kubernetes_resources" | indent 14 }}
              command:
                - /tmp/run-tests.sh
              env:
{{- if or .Values.manifests.certificates .Values.tls.identity }}
                - name: REQUESTS_CA_BUNDLE
                  value: "/etc/tempest/certs/ca.crt"
{{- end }}
{{- with $env := dict "ksUserSecret" .Values.secrets.identity.admin "envAll" $envAll }}
{{- include "helm-toolkit.snippets.keystone_openrc_env_vars" $env | indent 16 }}
{{- end }}
              volumeMounts:
                - name: pod-tmp
                  mountPath: /tmp
                - name: tempest-bin
                  mountPath: /tmp/run-tests.sh
                  subPath: run-tests.sh
                  readOnly: true
                - name: etctempest
                  mountPath: /etc/tempest
                - name: tempest-etc
                  mountPath: /etc/tempest/tempest.conf
                  subPath: tempest.conf
                  readOnly: true
                - name: tempest-etc
                  mountPath: /etc/tempest/logging.conf
                  subPath: logging.conf
                  readOnly: true
{{ if not (empty .Values.conf.blacklist) }}
                - name: tempest-etc
                  mountPath: /etc/tempest/test-blacklist
                  subPath: test-blacklist
                  readOnly: true
{{- end }}
{{ if not (empty .Values.conf.whitelist) }}
                - name: tempest-etc
                  mountPath: /etc/tempest/test-whitelist
                  subPath: test-whitelist
                  readOnly: true
{{- end }}
                - name: tempest-reports
                  mountPath: /var/lib/tempest/data
{{- dict "enabled" (or .Values.manifests.certificates .Values.tls.identity) "name" .Values.secrets.tls.identity.api.internal "path" "/etc/tempest/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 16 }}
          volumes:
            - name: pod-tmp
              emptyDir: {}
            - name: etctempest
              emptyDir: {}
            - name: tempest-etc
              secret:
                secretName: tempest-etc
                defaultMode: 0444
            - name: tempest-bin
              configMap:
                name: tempest-bin
                defaultMode: 0555
            - name: tempest-reports
              persistentVolumeClaim:
                claimName: {{ .Values.jobs.cron_run_tests.pvc.name }}
{{- dict "enabled" (or .Values.manifests.certificates .Values.tls.identity) "name" .Values.secrets.tls.identity.api.internal | include "helm-toolkit.snippets.tls_volume" | indent 12 }}
{{- end }}
