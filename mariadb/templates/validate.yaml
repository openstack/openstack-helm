{{- /*
AppArmor profiles can no longer be set per container under
pod.mandatory_access_control, fail rather than silently dropping them.
*/}}
{{- $mac := .Values.pod.mandatory_access_control | default dict }}
{{- if and $mac.type (eq $mac.type "apparmor") }}
{{- range $podName := list
  "create-sql-user"
  "mariadb-backup"
  "mariadb-server"
  "mariadb-test"
}}
{{- if index $mac $podName }}
{{- fail "AppArmor profiles can no longer be set per container under pod.mandatory_access_control, set appArmorProfile under pod.security_context instead." }}
{{- end }}
{{- end }}
{{- end }}
