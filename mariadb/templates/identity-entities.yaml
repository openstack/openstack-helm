{{- /*
Keystone custom resources declaring the identity objects this chart owns: the
service user it authenticates as and the domain, project and roles it needs.
This chart publishes no catalog entry. They are reconciled by the keystone
chart's identity controller, which replaces the ks-user job and keeps the
administrative credentials in the chart that owns keystone.

Enable this instead of that job. See
values_overrides/mariadb/identity-entities.yaml.

Every name and credential is read from the values the chart already declares,
so nothing is duplicated: endpoints.identity.auth.<userClass> carries the
username, domains, project and roles, and secrets.identity.<userClass> names
the secret holding the password.

Rendered only when conf.backup.remote_backup.enabled: the user is the account
the backup job stores to the object store with, and its password secret exists
only then.

The identity controller watches only the namespace keystone is deployed in, so
this release must be deployed there too.
*/}}
{{- if and .Values.manifests.identity_entities .Values.conf.backup.remote_backup.enabled }}
{{- $envAll := . }}
{{- if .Values.manifests.job_ks_user }}
{{- fail "manifests.identity_entities is mutually exclusive with the ks_user job, set manifests.job_ks_user to false" }}
{{- end }}

{{- /*
The ks-user job creates the user through the keystone the admin credentials
point to; the controller can only create it in the keystone it manages.
*/}}
{{- if .Values.endpoints.identity.auth.mariadb.auth_url }}
{{- fail "manifests.identity_entities creates the backup user in the keystone the identity controller manages, but endpoints.identity.auth.mariadb.auth_url points to another one" }}
{{- end }}

{{- $apiVersion := "keystone.osh.openstack.org/v1alpha1" }}
{{- $keystoneRef := index .Values.endpoints.identity.hosts "default" }}

{{- /* The same service user the ks-user job declares. */}}
{{- $serviceUsers := (tuple "mariadb") -}}

{{- /*
Collect the domains, projects and roles the users need. Several users share
them, and a chart may not render two resources with the same name, so they are
deduplicated into maps first. Across charts they are not deduplicated at all:
each chart declares its own resource for the objects it needs, because a single
owner would be a cross-chart dependency Helm cannot express, and reconciliation
is find-or-create.
*/}}
{{- $domains := dict }}
{{- $projects := dict }}
{{- $roles := dict "member" true }}
{{- range $userClass := $serviceUsers }}
{{- $auth := index $envAll.Values.endpoints.identity.auth $userClass }}
{{- if ne (lower $auth.user_domain_name) "default" }}
{{- $_ := set $domains $auth.user_domain_name true }}
{{- end }}
{{- if ne (lower $auth.project_domain_name) "default" }}
{{- $_ := set $domains $auth.project_domain_name true }}
{{- end }}
{{- /*
The administrative project is created by keystone-manage bootstrap and belongs
to the keystone chart. A user scoped to it needs no Project resource, and one
would let the controller rewrite that project's description.
*/}}
{{- $adminAuth := $envAll.Values.endpoints.identity.auth.admin }}
{{- if not (and (eq $auth.project_name $adminAuth.project_name) (eq (lower $auth.project_domain_name) (lower $adminAuth.project_domain_name))) }}
{{- $_ := set $projects $auth.project_name $auth.project_domain_name }}
{{- end }}
{{- $roleList := $auth.role }}
{{- if not (kindIs "slice" $roleList) }}
{{- $roleList = splitList "," $auth.role }}
{{- end }}
{{- range $role := $roleList }}
{{- $_ := set $roles (trim $role) true }}
{{- end }}
{{- end }}

{{- range $domain, $_ := $domains }}
---
apiVersion: {{ $apiVersion }}
kind: Domain
metadata:
  name: {{ printf "mariadb-%s" $domain | lower | replace "_" "-" | quote }}
  labels:
{{ tuple $envAll "mariadb" "identity-domain" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  keystoneRef:
    name: {{ $keystoneRef | quote }}
  name: {{ $domain | quote }}
  description: {{ printf "Domain for %s" $domain | quote }}
{{- end }}

{{- range $project, $projectDomain := $projects }}
---
apiVersion: {{ $apiVersion }}
kind: Project
metadata:
  name: {{ printf "mariadb-%s" $project | lower | replace "_" "-" | quote }}
  labels:
{{ tuple $envAll "mariadb" "identity-project" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  keystoneRef:
    name: {{ $keystoneRef | quote }}
  name: {{ $project | quote }}
  domain: {{ $projectDomain | quote }}
  description: {{ printf "Service Project for %s" $projectDomain | quote }}
{{- end }}

{{- range $role, $_ := $roles }}
---
apiVersion: {{ $apiVersion }}
kind: Role
metadata:
  name: {{ printf "mariadb-%s" $role | lower | replace "_" "-" | quote }}
  labels:
{{ tuple $envAll "mariadb" "identity-role" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  keystoneRef:
    name: {{ $keystoneRef | quote }}
  name: {{ $role | quote }}
{{- end }}

{{- range $userClass := $serviceUsers }}
{{- $auth := index $envAll.Values.endpoints.identity.auth $userClass }}
{{- $userName := printf "mariadb-%s" $userClass | lower | replace "_" "-" }}
---
apiVersion: {{ $apiVersion }}
kind: User
metadata:
  name: {{ $userName | quote }}
  labels:
{{ tuple $envAll "mariadb" "identity-user" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  keystoneRef:
    name: {{ $keystoneRef | quote }}
  name: {{ $auth.username | quote }}
  domain: {{ $auth.user_domain_name | quote }}
  description: {{ printf "Service User for %s/%s/mariadb" $auth.region_name $auth.user_domain_name | quote }}
  {{- /* The project a token is scoped to, as the ks-user job's --project. */}}
  defaultProject:
    name: {{ $auth.project_name | quote }}
    domain: {{ $auth.project_domain_name | quote }}
  {{- /*
  The openrc secret the chart already renders for this user, so adopting this
  path adds no secret and the two halves cannot disagree.
  */}}
  passwordSecret:
    name: {{ index $envAll.Values.secrets.identity $userClass | quote }}
    key: OS_PASSWORD
{{- $roleList := $auth.role }}
{{- if not (kindIs "slice" $roleList) }}
{{- $roleList = splitList "," $auth.role }}
{{- end }}
{{- /* The service roles, plus the member role the ks-user job always adds. */}}
{{- range $role := append $roleList "member" | uniq }}
{{- $role = trim $role }}
---
apiVersion: {{ $apiVersion }}
kind: RoleAssignment
metadata:
  name: {{ printf "%s-%s" $userName $role | lower | replace "_" "-" | quote }}
  labels:
{{ tuple $envAll "mariadb" "identity-role-assignment" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  keystoneRef:
    name: {{ $keystoneRef | quote }}
  role:
    name: {{ $role | quote }}
  user:
    name: {{ $auth.username | quote }}
    domain: {{ $auth.user_domain_name | quote }}
  project:
    name: {{ $auth.project_name | quote }}
    domain: {{ $auth.project_domain_name | quote }}
{{- end }}
{{- end }}
{{- end }}
