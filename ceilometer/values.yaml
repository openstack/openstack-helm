# Default values for ceilometer.
# This is a YAML-formatted file.
# Declare name/value pairs to be passed into your templates.
# name: value

---
release_group: null

labels:
  compute:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled
  central:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  ipmi:
    node_selector_key: openstack-node
    node_selector_value: enabled
  notification:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

images:
  tags:
    rabbit_init: docker.io/rabbitmq:4.3.5-management
    ks_user: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ceilometer_central: quay.io/airshipit/ceilometer:2026.1-ubuntu_noble
    ceilometer_compute: quay.io/airshipit/ceilometer:2026.1-ubuntu_noble
    ceilometer_ipmi: quay.io/airshipit/ceilometer:2026.1-ubuntu_noble
    ceilometer_notification: quay.io/airshipit/ceilometer:2026.1-ubuntu_noble
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    image_repo_sync: docker.io/docker:17.07.0
  pull_policy: "IfNotPresent"
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

ipmi_device: /dev/ipmi0

conf:
  ceilometer:
    DEFAULT:
      transport_url: null
    service_credentials:
      auth_type: password
      interface: internal
    notification:
      messaging_urls:
        type: multistring
        values:
          - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/ceilometer
          - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/cinder
          - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/glance
          - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/nova
          - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/keystone
          - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/neutron
          - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/heat
    oslo_messaging_rabbit:
      # -- Durable and quorum queues, which RabbitMQ 4.x requires: it denies
      ## transient non-exclusive queues, and oslo.messaging declares its RPC,
      ## notification, reply and fanout queues that way otherwise. Valid on 3.x.
      amqp_durable_queues: true
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: true
      use_queue_manager: true
      rabbit_qos_prefetch_count: 1
      rabbit_stream_fanout: true
    oslo_messaging_notifications:
      driver: messagingv2
      topics:
        - notifications
        - profiler
    oslo_concurrency:
      lock_path: /var/lock
    cache:
      enabled: true
      backend: dogpile.cache.memcached
      expiration_time: 86400
  event_definitions:
    - event_type: 'compute.instance.*'
      traits: &instance_traits
        tenant_id:
          fields: payload.tenant_id
        user_id:
          fields: payload.user_id
        instance_id:
          fields: payload.instance_id
        display_name:
          fields: payload.display_name
        resource_id:
          fields: payload.instance_id
        cell_name:
          fields: payload.cell_name
        host:
          fields: publisher_id.`split(., 1, 1)`
        service:
          fields: publisher_id.`split(., 0, -1)`
        memory_mb:
          type: int
          fields: payload.memory_mb
        disk_gb:
          type: int
          fields: payload.disk_gb
        root_gb:
          type: int
          fields: payload.root_gb
        ephemeral_gb:
          type: int
          fields: payload.ephemeral_gb
        vcpus:
          type: int
          fields: payload.vcpus
        instance_type_id:
          fields: payload.instance_type_id
        instance_flavor_id:
          fields: payload.instance_flavor_id
        instance_type:
          fields: payload.instance_type
        state:
          fields: payload.state
        os_architecture:
          fields: payload.image_meta.'org.openstack__1__architecture'
        os_version:
          fields: payload.image_meta.'org.openstack__1__os_version'
        os_distro:
          fields: payload.image_meta.'org.openstack__1__os_distro'
        launched_at:
          type: datetime
          fields: payload.launched_at
        deleted_at:
          type: datetime
          fields: payload.deleted_at
    - event_type: compute.instance.create.end
      traits:
        <<: *instance_traits
        availability_zone:
          fields: payload.availability_zone
    - event_type: compute.instance.update
      traits:
        <<: *instance_traits
        old_state:
          fields: payload.old_state
    - event_type: compute.instance.exists
      traits:
        <<: *instance_traits
        audit_period_beginning:
          type: datetime
          fields: payload.audit_period_beginning
        audit_period_ending:
          type: datetime
          fields: payload.audit_period_ending
    - event_type: ['volume.exists', 'volume.retype', 'volume.create.*', 'volume.delete.*', 'volume.resize.*', 'volume.attach.*', 'volume.detach.*', 'volume.update.*', 'snapshot.exists', 'snapshot.create.*', 'snapshot.delete.*', 'snapshot.update.*', 'volume.transfer.accept.end', 'snapshot.transfer.accept.end']
      traits: &cinder_traits
        user_id:
          fields: payload.user_id
        project_id:
          fields: payload.tenant_id
        availability_zone:
          fields: payload.availability_zone
        display_name:
          fields: payload.display_name
        replication_status:
          fields: payload.replication_status
        status:
          fields: payload.status
        created_at:
          type: datetime
          fields: payload.created_at
        image_id:
          fields: payload.glance_metadata[?key=image_id].value
        instance_id:
          fields: payload.volume_attachment[0].server_id
    - event_type: ['volume.transfer.*', 'volume.exists', 'volume.retype', 'volume.create.*', 'volume.delete.*', 'volume.resize.*', 'volume.attach.*', 'volume.detach.*', 'volume.update.*', 'snapshot.transfer.accept.end']
      traits:
        <<: *cinder_traits
        resource_id:
          fields: payload.volume_id
        host:
          fields: payload.host
        size:
          type: int
          fields: payload.size
        type:
          fields: payload.volume_type
        replication_status:
          fields: payload.replication_status
    - event_type: ['snapshot.transfer.accept.end']
      traits:
        <<: *cinder_traits
        resource_id:
          fields: payload.snapshot_id
        project_id:
          fields: payload.tenant_id
    - event_type: ['share.create.*', 'share.delete.*', 'share.extend.*', 'share.shrink.*']
      traits: &share_traits
        share_id:
          fields: payload.share_id
        user_id:
          fields: payload.user_id
        project_id:
          fields: payload.tenant_id
        snapshot_id:
          fields: payload.snapshot_id
        availability_zone:
          fields: payload.availability_zone
        status:
          fields: payload.status
        created_at:
          type: datetime
          fields: payload.created_at
        share_group_id:
          fields: payload.share_group_id
        size:
          type: int
          fields: payload.size
        name:
          fields: payload.name
        proto:
          fields: payload.proto
        is_public:
          fields: payload.is_public
        description:
          fields: payload.description
        host:
          fields: payload.host
    - event_type: ['snapshot.exists', 'snapshot.create.*', 'snapshot.delete.*', 'snapshot.update.*']
      traits:
        <<: *cinder_traits
        resource_id:
          fields: payload.snapshot_id
        volume_id:
          fields: payload.volume_id
    - event_type: ['image_volume_cache.*']
      traits:
        image_id:
          fields: payload.image_id
        host:
          fields: payload.host
    - event_type: ['image.create', 'image.update', 'image.upload', 'image.delete']
      traits: &glance_crud
        project_id:
          fields: payload.owner
        resource_id:
          fields: payload.id
        name:
          fields: payload.name
        status:
          fields: payload.status
        created_at:
          type: datetime
          fields: payload.created_at
        user_id:
          fields: payload.owner
        deleted_at:
          type: datetime
          fields: payload.deleted_at
        size:
          type: int
          fields: payload.size
    - event_type: image.send
      traits: &glance_send
        receiver_project:
          fields: payload.receiver_tenant_id
        receiver_user:
          fields: payload.receiver_user_id
        user_id:
          fields: payload.owner_id
        image_id:
          fields: payload.image_id
        destination_ip:
          fields: payload.destination_ip
        bytes_sent:
          type: int
          fields: payload.bytes_sent
    - event_type: orchestration.stack.*
      traits: &orchestration_crud
        project_id:
          fields: payload.tenant_id
        user_id:
          fields: ['ctxt.trustor_user_id', 'ctxt.user_id']
        resource_id:
          fields: payload.stack_identity
        name:
          fields: payload.name
    - event_type: ['identity.user.*', 'identity.project.*', 'identity.group.*', 'identity.role.*', 'identity.OS-TRUST:trust.*',
                   'identity.region.*', 'identity.service.*', 'identity.endpoint.*', 'identity.policy.*']
      traits: &identity_crud
        resource_id:
          fields: payload.resource_info
        initiator_id:
          fields: payload.initiator.id
        project_id:
          fields: payload.initiator.project_id
        domain_id:
          fields: payload.initiator.domain_id
    - event_type: identity.role_assignment.*
      traits: &identity_role_assignment
        role:
          fields: payload.role
        group:
          fields: payload.group
        domain:
          fields: payload.domain
        user:
          fields: payload.user
        project:
          fields: payload.project
    - event_type: identity.authenticate
      traits: &identity_authenticate
        typeURI:
          fields: payload.typeURI
        id:
          fields: payload.id
        action:
          fields: payload.action
        eventType:
          fields: payload.eventType
        eventTime:
          type: datetime
          fields: payload.eventTime
        outcome:
          fields: payload.outcome
        initiator_typeURI:
          fields: payload.initiator.typeURI
        initiator_id:
          fields: payload.initiator.id
        initiator_name:
          fields: payload.initiator.name
        initiator_host_agent:
          fields: payload.initiator.host.agent
        initiator_host_addr:
          fields: payload.initiator.host.address
        target_typeURI:
          fields: payload.target.typeURI
        target_id:
          fields: payload.target.id
        observer_typeURI:
          fields: payload.observer.typeURI
        observer_id:
          fields: payload.observer.id
    - event_type: objectstore.http.request
      traits: &objectstore_request
        typeURI:
          fields: payload.typeURI
        id:
          fields: payload.id
        action:
          fields: payload.action
        eventType:
          fields: payload.eventType
        eventTime:
          type: datetime
          fields: payload.eventTime
        outcome:
          fields: payload.outcome
        initiator_typeURI:
          fields: payload.initiator.typeURI
        initiator_id:
          fields: payload.initiator.id
        initiator_project_id:
          fields: payload.initiator.project_id
        target_typeURI:
          fields: payload.target.typeURI
        target_id:
          fields: payload.target.id
        target_action:
          fields: payload.target.action
        target_metadata_path:
          fields: payload.target.metadata.path
        target_metadata_version:
          fields: payload.target.metadata.version
        target_metadata_container:
          fields: payload.target.metadata.container
        target_metadata_object:
          fields: payload.target.metadata.object
        observer_id:
          fields: payload.observer.id
    - event_type: ['network.*', 'subnet.*', 'port.*', 'router.*', 'floatingip.*', 'firewall.*', 'firewall_policy.*', 'firewall_rule.*', 'vpnservice.*', 'ipsecpolicy.*', 'ikepolicy.*', 'ipsec_site_connection.*']
      traits: &network_traits
        user_id:
          fields: ctxt.user_id
        project_id:
          fields: ctxt.tenant_id
    - event_type: network.*
      traits:
        <<: *network_traits
        name:
          fields: payload.network.name
        resource_id:
          fields: ['payload.network.id', 'payload.id']
    - event_type: subnet.*
      traits:
        <<: *network_traits
        name:
          fields: payload.subnet.name
        resource_id:
          fields: ['payload.subnet.id', 'payload.id']
    - event_type: port.*
      traits:
        <<: *network_traits
        name:
          fields: payload.port.name
        resource_id:
          fields: ['payload.port.id', 'payload.id']
    - event_type: router.*
      traits:
        <<: *network_traits
        name:
          fields: payload.router.name
        resource_id:
          fields: ['payload.router.id', 'payload.id']
    - event_type: floatingip.*
      traits:
        <<: *network_traits
        resource_id:
          fields: ['payload.floatingip.id', 'payload.id']
    - event_type: firewall.*
      traits:
        <<: *network_traits
        name:
          fields: payload.firewall.name
        resource_id:
          fields: ['payload.firewall.id', 'payload.id']
    - event_type: firewall_policy.*
      traits:
        <<: *network_traits
        name:
          fields: payload.firewall_policy.name
        resource_id:
          fields: ['payload.firewall_policy.id', 'payload.id']
    - event_type: firewall_rule.*
      traits:
        <<: *network_traits
        name:
          fields: payload.firewall_rule.name
        resource_id:
          fields: ['payload.firewall_rule.id', 'payload.id']
    - event_type: vpnservice.*
      traits:
        <<: *network_traits
        name:
          fields: payload.vpnservice.name
        resource_id:
          fields: ['payload.vpnservice.id', 'payload.id']
    - event_type: ipsecpolicy.*
      traits:
        <<: *network_traits
        name:
          fields: payload.ipsecpolicy.name
        resource_id:
          fields: ['payload.ipsecpolicy.id', 'payload.id']
    - event_type: ikepolicy.*
      traits:
        <<: *network_traits
        name:
          fields: payload.ikepolicy.name
        resource_id:
          fields: ['payload.ikepolicy.id', 'payload.id']
    - event_type: ipsec_site_connection.*
      traits:
        <<: *network_traits
        resource_id:
          fields: ['payload.ipsec_site_connection.id', 'payload.id']
    - event_type: '*http.*'
      traits: &http_audit
        project_id:
          fields: payload.initiator.project_id
        user_id:
          fields: payload.initiator.id
        typeURI:
          fields: payload.typeURI
        eventType:
          fields: payload.eventType
        action:
          fields: payload.action
        outcome:
          fields: payload.outcome
        id:
          fields: payload.id
        eventTime:
          type: datetime
          fields: payload.eventTime
        requestPath:
          fields: payload.requestPath
        observer_id:
          fields: payload.observer.id
        target_id:
          fields: payload.target.id
        target_typeURI:
          fields: payload.target.typeURI
        target_name:
          fields: payload.target.name
        initiator_typeURI:
          fields: payload.initiator.typeURI
        initiator_id:
          fields: payload.initiator.id
        initiator_name:
          fields: payload.initiator.name
        initiator_host_address:
          fields: payload.initiator.host.address
    - event_type: '*http.response'
      traits:
        <<: *http_audit
        reason_code:
          fields: payload.reason.reasonCode
    - event_type: ['dns.domain.create', 'dns.domain.update', 'dns.domain.delete']
      traits: &dns_domain_traits
        status:
          fields: payload.status
        retry:
          fields: payload.retry
        description:
          fields: payload.description
        expire:
          fields: payload.expire
        email:
          fields: payload.email
        ttl:
          fields: payload.ttl
        action:
          fields: payload.action
        name:
          fields: payload.name
        resource_id:
          fields: payload.id
        created_at:
          type: datetime
          fields: payload.created_at
        updated_at:
          type: datetime
          fields: payload.updated_at
        version:
          fields: payload.version
        parent_domain_id:
          fields: parent_domain_id
        serial:
          fields: payload.serial
    - event_type: dns.domain.exists
      traits:
        <<: *dns_domain_traits
        audit_period_beginning:
          type: datetime
          fields: payload.audit_period_beginning
        audit_period_ending:
          type: datetime
          fields: payload.audit_period_ending
    - event_type: ['dns.zone.create', 'dns.zone.update', 'dns.zone.delete']
      traits: &dns_zone_traits
        resource_id:
          fields: payload.id
        project_id:
          fields: payload.tenant_id
        name:
          fields: payload.name
        description:
          fields: payload.description
        action:
          fields: payload.action
        created_at:
          type: datetime
          fields: payload.created_at
        email:
          fields: payload.email
        expire:
          fields: payload.expire
        pool_id:
          fields: payload.pool_id
        refresh:
          fields: payload.refresh
        retry:
          fields: payload.retry
        serial:
          fields: payload.serial
        status:
          fields: payload.status
        ttl:
          fields: payload.ttl
        type:
          fields: payload.type
        updated_at:
          type: datetime
          fields: payload.updated_at
        version:
          fields: payload.version
    - event_type: dns.zone.exists
      traits:
        <<: *dns_zone_traits
        audit_period_beginning:
          type: datetime
          fields: payload.audit_period_beginning
        audit_period_ending:
          type: datetime
          fields: payload.audit_period_ending
    - event_type: trove.*
      traits: &trove_base_traits
        instance_type:
          fields: payload.instance_type
        user_id:
          fields: payload.user_id
        resource_id:
          fields: payload.instance_id
        instance_type_id:
          fields: payload.instance_type_id
        launched_at:
          type: datetime
          fields: payload.launched_at
        instance_name:
          fields: payload.instance_name
        state:
          fields: payload.state
        nova_instance_id:
          fields: payload.nova_instance_id
        service_id:
          fields: payload.service_id
        created_at:
          type: datetime
          fields: payload.created_at
        region:
          fields: payload.region
    - event_type: ['trove.instance.create', 'trove.instance.modify_volume', 'trove.instance.modify_flavor', 'trove.instance.delete']
      traits: &trove_common_traits
        name:
          fields: payload.name
        availability_zone:
          fields: payload.availability_zone
        instance_size:
          type: int
          fields: payload.instance_size
        volume_size:
          type: int
          fields: payload.volume_size
        nova_volume_id:
          fields: payload.nova_volume_id
    - event_type: trove.instance.create
      traits:
        <<: [*trove_base_traits, *trove_common_traits]
    - event_type: trove.instance.modify_volume
      traits:
        <<: [*trove_base_traits, *trove_common_traits]
        old_volume_size:
          type: int
          fields: payload.old_volume_size
        modify_at:
          type: datetime
          fields: payload.modify_at
    - event_type: trove.instance.modify_flavor
      traits:
        <<: [*trove_base_traits, *trove_common_traits]
        old_instance_size:
          type: int
          fields: payload.old_instance_size
        modify_at:
          type: datetime
          fields: payload.modify_at
    - event_type: trove.instance.delete
      traits:
        <<: [*trove_base_traits, *trove_common_traits]
        deleted_at:
          type: datetime
          fields: payload.deleted_at
    - event_type: trove.instance.exists
      traits:
        <<: *trove_base_traits
        display_name:
          fields: payload.display_name
        audit_period_beginning:
          type: datetime
          fields: payload.audit_period_beginning
        audit_period_ending:
          type: datetime
          fields: payload.audit_period_ending
    - event_type: profiler.*
      traits:
        project:
          fields: payload.project
        service:
          fields: payload.service
        name:
          fields: payload.name
        base_id:
          fields: payload.base_id
        trace_id:
          fields: payload.trace_id
        parent_id:
          fields: payload.parent_id
        timestamp:
          type: datetime
          fields: payload.timestamp
        host:
          fields: payload.info.host
        path:
          fields: payload.info.request.path
        query:
          fields: payload.info.request.query
        method:
          fields: payload.info.request.method
        scheme:
          fields: payload.info.request.scheme
        db.statement:
          fields: payload.info.db.statement
        db.params:
          fields: payload.info.db.params
    - event_type: 'magnum.cluster.*'
      traits: &magnum_cluster_crud
        id:
          fields: payload.id
        typeURI:
          fields: payload.typeURI
        eventType:
          fields: payload.eventType
        eventTime:
          type: datetime
          fields: payload.eventTime
        action:
          fields: payload.action
        outcome:
          fields: payload.outcome
        initiator_id:
          fields: payload.initiator.id
        initiator_typeURI:
          fields: payload.initiator.typeURI
        initiator_name:
          fields: payload.initiator.name
        initiator_host_agent:
          fields: payload.initiator.host.agent
        initiator_host_address:
          fields: payload.initiator.host.address
        target_id:
          fields: payload.target.id
        target_typeURI:
          fields: payload.target.typeURI
        observer_id:
          fields: payload.observer.id
        observer_typeURI:
          fields: payload.observer.typeURI
    - event_type: 'octavia.loadbalancer.*'
      traits:
        resource_id:
          fields: payload.loadbalancer_id
        project_id:
          fields: payload.project_id
        name:
          fields: payload.name
        description:
          fields: payload.description
        admin_state_up:
          fields: payload.admin_state_up
        availability_zone:
          fields: payload.availability_zone
        vip_address:
          fields: payload.vip_address
        vip_network_id:
          fields: payload.vip_network_id
        vip_port_id:
          fields: payload.vip_port_id
        vip_qos_policy_id:
          fields: payload.vip_qos_policy_id
        vip_subnet_id:
          fields: payload.vip_subnet_id
    - event_type: 'alarm.*'
      traits:
        id:
          fields: payload.alarm_id
        user_id:
          fields: payload.user_id
        project_id:
          fields: payload.project_id
        on_behalf_of:
          fields: payload.on_behalf_of
        severity:
          fields: payload.severity
        detail:
          fields: payload.detail
        type:
          fields: payload.type

  event_pipeline:
    sinks:
      - name: event_sink
        publishers:
          - notifier://
          - gnocchi://
    sources:
      - events:
          - '*'
        name: event_source
        sinks:
          - event_sink
  gnocchi_resources:
    archive_policy_default: ceilometer-low
    archive_policies:
      - name: ceilometer-low
        aggregation_methods:
          - mean
        back_window: 0
        definition:
          - granularity: 5 minutes
            timespan: 30 days
    resources:
      - resource_type: identity
        metrics:
          identity.authenticate.success: null
          identity.authenticate.pending: null
          identity.authenticate.failure: null
          identity.user.created: null
          identity.user.deleted: null
          identity.user.updated: null
          identity.group.created: null
          identity.group.deleted: null
          identity.group.updated: null
          identity.role.created: null
          identity.role.deleted: null
          identity.role.updated: null
          identity.project.created: null
          identity.project.deleted: null
          identity.project.updated: null
          identity.trust.created: null
          identity.trust.deleted: null
          identity.role_assignment.created: null
          identity.role_assignment.deleted: null
      - resource_type: ceph_account
        metrics:
          radosgw.objects: null
          radosgw.objects.size: null
          radosgw.objects.containers: null
          radosgw.api.request: null
          radosgw.containers.objects: null
          radosgw.containers.objects.size: null
      - resource_type: instance
        metrics:
          memory: null
          memory.available: null
          memory.usage: null
          memory.resident: null
          memory.swap.in: null
          memory.swap.out: null
          vcpus: null
          power.state: null
          cpu:
            archive_policy_name: ceilometer-low-rate
          disk.root.size: null
          disk.ephemeral.size: null
          disk.latency: null
          disk.iops: null
          disk.capacity: null
          disk.allocation: null
          disk.usage: null
          compute.instance.booting.time: null
          perf.cpu.cycles: null
          perf.instructions: null
          perf.cache.references: null
          perf.cache.misses: null
        attributes:
          host: resource_metadata.(instance_host|host)
          image_ref: resource_metadata.image_ref
          launched_at: resource_metadata.launched_at
          created_at: resource_metadata.created_at
          deleted_at: resource_metadata.deleted_at
          display_name: resource_metadata.display_name
          flavor_id: resource_metadata.(instance_flavor_id|(flavor.id)|flavor_id)
          flavor_name: resource_metadata.(instance_type|(flavor.name)|flavor_name)
          server_group: resource_metadata.user_metadata.server_group
        # delete.end, not delete.start: the samples the delete.end notification
        # still produces (memory, vcpus, disk.*) are newer than an ended_at set
        # at delete.start, and gnocchi >= 4.7 clears ended_at again when a
        # resource receives newer measures.
        # delete.end, not delete.start: the samples the delete.end notification
        # still produces (memory, vcpus, disk.*) are newer than an ended_at set
        # at delete.start, and gnocchi >= 4.7 clears ended_at again when a
        # resource receives newer measures.
        event_delete: compute.instance.delete.end
        event_create: compute.instance.create.end
        event_attributes:
          id: instance_id
          display_name: display_name
          host: host
          availability_zone: availability_zone
          flavor_id: instance_flavor_id
          flavor_name: instance_type
          user_id: user_id
          project_id: project_id
        event_associated_resources:
          instance_network_interface: '{"=": {"instance_id": "%s"}}'
          instance_disk: '{"=": {"instance_id": "%s"}}'
      - resource_type: instance_network_interface
        metrics:
          network.outgoing.packets:
            archive_policy_name: ceilometer-low-rate
          network.incoming.packets:
            archive_policy_name: ceilometer-low-rate
          network.outgoing.packets.drop:
            archive_policy_name: ceilometer-low-rate
          network.incoming.packets.drop:
            archive_policy_name: ceilometer-low-rate
          network.outgoing.packets.error:
            archive_policy_name: ceilometer-low-rate
          network.incoming.packets.error:
            archive_policy_name: ceilometer-low-rate
          network.outgoing.bytes:
            archive_policy_name: ceilometer-low-rate
          network.incoming.bytes:
            archive_policy_name: ceilometer-low-rate
        attributes:
          name: resource_metadata.vnic_name
          instance_id: resource_metadata.instance_id
      - resource_type: instance_disk
        metrics:
          disk.device.read.requests:
            archive_policy_name: ceilometer-low-rate
          disk.device.write.requests:
            archive_policy_name: ceilometer-low-rate
          disk.device.read.bytes:
            archive_policy_name: ceilometer-low-rate
          disk.device.write.bytes:
            archive_policy_name: ceilometer-low-rate
          disk.device.read.latency: null
          disk.device.write.latency: null
          disk.device.capacity: null
          disk.device.allocation: null
          disk.device.usage: null
        attributes:
          name: resource_metadata.disk_name
          instance_id: resource_metadata.instance_id
      - resource_type: image
        metrics:
          image.size: null
          image.download: null
          image.serve: null
        attributes:
          name: resource_metadata.name
          container_format: resource_metadata.container_format
          disk_format: resource_metadata.disk_format
        event_delete: image.delete
        event_attributes:
          id: resource_id
      - resource_type: ipmi
        metrics:
          hardware.ipmi.node.power: null
          hardware.ipmi.node.temperature: null
          hardware.ipmi.node.inlet_temperature: null
          hardware.ipmi.node.outlet_temperature: null
          hardware.ipmi.node.fan: null
          hardware.ipmi.node.current: null
          hardware.ipmi.node.voltage: null
          hardware.ipmi.node.airflow: null
          hardware.ipmi.node.cups: null
          hardware.ipmi.node.cpu_util: null
          hardware.ipmi.node.mem_util: null
          hardware.ipmi.node.io_util: null
      - resource_type: ipmi_sensor
        metrics:
          - hardware.ipmi.power
          - hardware.ipmi.temperature
          - hardware.ipmi.current
          - hardware.ipmi.voltage
          - hardware.ipmi.fan
        attributes:
          node: resource_metadata.node
      - resource_type: network
        metrics:
          bandwidth: null
          ip.floating: null
        event_delete: floatingip.delete.end
        event_attributes:
          id: resource_id
      - resource_type: stack
        metrics:
          stack.create: null
          stack.update: null
          stack.delete: null
          stack.resume: null
          stack.suspend: null
      - resource_type: swift_account
        metrics:
          storage.objects.incoming.bytes: null
          storage.objects.outgoing.bytes: null
          storage.objects.size: null
          storage.objects: null
          storage.objects.containers: null
          storage.containers.objects: null
          storage.containers.objects.size: null
        attributes:
          storage_policy: resource_metadata.storage_policy
      - resource_type: volume
        metrics:
          volume: null
          volume.size: null
          snapshot.size: null
          volume.snapshot.size: null
          volume.backup.size: null
          backup.size: null
          volume.manage_existing.start: null
          volume.manage_existing.end: null
          volume.manage_existing_snapshot.start: null
          volume.manage_existing_snapshot.end: null
        attributes:
          display_name: resource_metadata.(display_name|name)
          volume_type: resource_metadata.volume_type
          volume_type_id: resource_metadata.volume_type_id
          image_id: resource_metadata.image_id
          instance_id: resource_metadata.instance_id
        event_delete:
          - volume.delete.end
          - snapshot.delete.end
        event_update:
          - volume.transfer.accept.end
          - snapshot.transfer.accept.end
        event_attributes:
          id: resource_id
          project_id: project_id
      # 2026.2: volume.service.health pollster (one sample per cinder service).
      - resource_type: volume_service
        metrics:
          volume.service.health: null
        attributes:
          host: resource_metadata.host
          binary: resource_metadata.binary
          zone: resource_metadata.zone
          status: resource_metadata.status
      - resource_type: volume_provider
        metrics:
          volume.provider.capacity.total: null
          volume.provider.capacity.free: null
          volume.provider.capacity.allocated: null
          volume.provider.capacity.provisioned: null
          volume.provider.capacity.virtual_free: null
      - resource_type: volume_provider_pool
        metrics:
          volume.provider.pool.capacity.total: null
          volume.provider.pool.capacity.free: null
          volume.provider.pool.capacity.allocated: null
          volume.provider.pool.capacity.provisioned: null
          volume.provider.pool.capacity.virtual_free: null
        attributes:
          provider: resource_metadata.provider
      - resource_type: nova_compute
        metrics:
          compute.node.cpu.frequency: null
          compute.node.cpu.idle.percent: null
          compute.node.cpu.idle.time: null
          compute.node.cpu.iowait.percent: null
          compute.node.cpu.iowait.time: null
          compute.node.cpu.kernel.percent: null
          compute.node.cpu.kernel.time: null
          compute.node.cpu.percent: null
          compute.node.cpu.user.percent: null
          compute.node.cpu.user.time: null
        attributes:
          host_name: resource_metadata.host
      - resource_type: manila_share
        metrics:
          manila.share.size: null
          manila.share.status: null
        attributes:
          name: resource_metadata.name
          host: resource_metadata.host
          status: resource_metadata.status
          availability_zone: resource_metadata.availability_zone
          protocol: resource_metadata.protocol
      - resource_type: loadbalancer
        metrics:
          loadbalancer.operating: null
          loadbalancer.provisioning: null
        attributes:
          name: resource_metadata.name
          availability_zone: resource_metadata.availability_zone
          vip_address: resource_metadata.vip_address
          provider: resource_metadata.provider
        event_delete: octavia.loadbalancer.delete.end
        event_attributes:
          id: resource_id
      - resource_type: dns_zone
        metrics:
          dns.zone.status: null
          dns.zone.recordsets: null
          dns.zone.ttl: null
          dns.zone.serial: null
        attributes:
          zone_name: resource_metadata.name
          email: resource_metadata.email
          zone_type: resource_metadata.type
          pool_id: resource_metadata.pool_id
        event_delete: dns.zone.delete
        event_attributes:
          id: resource_id
      - attributes:
          host_name: resource_metadata.resource_url
        metrics:
          - hardware.cpu.load.1min
          - hardware.cpu.load.5min
          - hardware.cpu.load.15min
          - hardware.cpu.util
          - hardware.memory.total
          - hardware.memory.used
          - hardware.memory.swap.total
          - hardware.memory.swap.avail
          - hardware.memory.buffer
          - hardware.memory.cached
          - hardware.network.ip.outgoing.datagrams
          - hardware.network.ip.incoming.datagrams
          - hardware.system_stats.cpu.idle
          - hardware.system_stats.io.outgoing.blocks
          - hardware.system_stats.io.incoming.blocks
        resource_type: host
      - attributes:
          device_name: resource_metadata.device
          host_name: resource_metadata.resource_url
        metrics:
          - hardware.disk.size.total
          - hardware.disk.size.used
        resource_type: host_disk
      - attributes:
          device_name: resource_metadata.name
          host_name: resource_metadata.resource_url
        metrics:
          - hardware.network.incoming.bytes
          - hardware.network.outgoing.bytes
          - hardware.network.outgoing.errors
        resource_type: host_network_interface
  meters:
    metric:
      # Image
      - name: "image.size"
        event_type:
          - "image.upload"
          - "image.delete"
          - "image.update"
        type: "gauge"
        unit: B
        volume: $.payload.size
        resource_id: $.payload.id
        project_id: $.payload.owner

      - name: "image.download"
        event_type: "image.send"
        type: "delta"
        unit: "B"
        volume: $.payload.bytes_sent
        resource_id: $.payload.image_id
        user_id: $.payload.receiver_user_id
        project_id: $.payload.receiver_tenant_id

      - name: "image.serve"
        event_type: "image.send"
        type: "delta"
        unit: "B"
        volume: $.payload.bytes_sent
        resource_id: $.payload.image_id
        project_id: $.payload.owner_id

      - name: 'volume.provider.capacity.total'
        event_type: 'capacity.backend.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.total
        resource_id: $.payload.name_to_id

      - name: 'volume.provider.capacity.free'
        event_type: 'capacity.backend.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.free
        resource_id: $.payload.name_to_id

      - name: 'volume.provider.capacity.allocated'
        event_type: 'capacity.backend.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.allocated
        resource_id: $.payload.name_to_id

      - name: 'volume.provider.capacity.provisioned'
        event_type: 'capacity.backend.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.provisioned
        resource_id: $.payload.name_to_id

      - name: 'volume.provider.capacity.virtual_free'
        event_type: 'capacity.backend.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.virtual_free
        resource_id: $.payload.name_to_id

      - name: 'volume.provider.pool.capacity.total'
        event_type: 'capacity.pool.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.total
        resource_id: $.payload.name_to_id
        metadata: &provider_pool_meta
          provider: $.payload.name_to_id.`split(#, 0, 1)`

      - name: 'volume.provider.pool.capacity.free'
        event_type: 'capacity.pool.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.free
        resource_id: $.payload.name_to_id
        metadata:
          <<: *provider_pool_meta

      - name: 'volume.provider.pool.capacity.allocated'
        event_type: 'capacity.pool.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.allocated
        resource_id: $.payload.name_to_id
        metadata:
          <<: *provider_pool_meta

      - name: 'volume.provider.pool.capacity.provisioned'
        event_type: 'capacity.pool.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.provisioned
        resource_id: $.payload.name_to_id
        metadata:
          <<: *provider_pool_meta

      - name: 'volume.provider.pool.capacity.virtual_free'
        event_type: 'capacity.pool.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.virtual_free
        resource_id: $.payload.name_to_id
        metadata:
          <<: *provider_pool_meta

      - name: 'volume.size'
        event_type:
          - 'volume.exists'
          - 'volume.retype'
          - 'volume.create.*'
          - 'volume.delete.*'
          - 'volume.resize.*'
          - 'volume.attach.*'
          - 'volume.detach.*'
          - 'volume.update.*'
          - 'volume.manage.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.size
        user_id: $.payload.user_id
        project_id: $.payload.tenant_id
        resource_id: $.payload.volume_id
        metadata:
          display_name: $.payload.display_name
          volume_type: $.payload.volume_type
          volume_type_id: $.payload.volume_type
          image_id: $.payload.glance_metadata[?key=image_id].value
          instance_id: $.payload.volume_attachment[0].server_id

      - name: 'snapshot.size'
        event_type:
          - 'snapshot.exists'
          - 'snapshot.create.*'
          - 'snapshot.delete.*'
          - 'snapshot.manage.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.volume_size
        user_id: $.payload.user_id
        project_id: $.payload.tenant_id
        resource_id: $.payload.snapshot_id
        metadata:
          display_name: $.payload.display_name

      - name: 'backup.size'
        event_type:
          - 'backup.exists'
          - 'backup.create.*'
          - 'backup.delete.*'
          - 'backup.restore.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.size
        user_id: $.payload.user_id
        project_id: $.payload.tenant_id
        resource_id: $.payload.backup_id
        metadata:
          display_name: $.payload.display_name

      # Magnum
      - name: $.payload.metrics.[*].name
        event_type: 'magnum.bay.metrics.*'
        type: 'gauge'
        unit: $.payload.metrics.[*].unit
        volume: $.payload.metrics.[*].value
        user_id: $.payload.user_id
        project_id: $.payload.project_id
        resource_id: $.payload.resource_id
        lookup: ['name', 'unit', 'volume']

      # Swift
      - name: $.payload.measurements.[*].metric.[*].name
        event_type: 'objectstore.http.request'
        type: 'delta'
        unit: $.payload.measurements.[*].metric.[*].unit
        volume: $.payload.measurements.[*].result
        resource_id: $.payload.target.id
        user_id: $.payload.initiator.id
        project_id: $.payload.initiator.project_id
        lookup: ['name', 'unit', 'volume']

      - name: 'memory'
        event_type: &instance_events compute.instance.(?!create.start|update).*
        type: 'gauge'
        unit: 'MiB'
        volume: $.payload.memory_mb
        user_id: $.payload.user_id
        project_id: $.payload.tenant_id
        resource_id: $.payload.instance_id
        user_metadata: $.payload.metadata
        metadata: &instance_meta
          host: $.payload.host
          flavor_id: $.payload.instance_flavor_id
          flavor_name: $.payload.instance_type
          display_name: $.payload.display_name
          image_ref: $.payload.image_meta.base_image_ref
          image_meta: $.payload.image_meta
          launched_at: $.payload.launched_at
          created_at: $.payload.created_at
          deleted_at: $.payload.deleted_at

      - name: 'vcpus'
        event_type: *instance_events
        type: 'gauge'
        unit: 'vcpu'
        volume: $.payload.vcpus
        user_id: $.payload.user_id
        project_id: $.payload.tenant_id
        resource_id: $.payload.instance_id
        user_metadata: $.payload.metadata
        metadata:
          <<: *instance_meta

      - name: 'compute.instance.booting.time'
        event_type: 'compute.instance.create.end'
        type: 'gauge'
        unit: 'sec'
        volume:
          fields: [$.payload.created_at, $.payload.launched_at]
          plugin: 'timedelta'
        project_id: $.payload.tenant_id
        resource_id: $.payload.instance_id
        user_metadata: $.payload.metadata
        metadata:
          <<: *instance_meta

      - name: 'disk.root.size'
        event_type: *instance_events
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.root_gb
        user_id: $.payload.user_id
        project_id: $.payload.tenant_id
        resource_id: $.payload.instance_id
        user_metadata: $.payload.metadata
        metadata:
          <<: *instance_meta

      - name: 'disk.ephemeral.size'
        event_type: *instance_events
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.ephemeral_gb
        user_id: $.payload.user_id
        project_id: $.payload.tenant_id
        resource_id: $.payload.instance_id
        user_metadata: $.payload.metadata
        metadata:
          <<: *instance_meta

      - name: 'bandwidth'
        event_type: 'l3.meter'
        type: 'delta'
        unit: 'B'
        volume: $.payload.bytes
        project_id: $.payload.tenant_id
        resource_id: $.payload.label_id

      - name: 'compute.node.cpu.frequency'
        event_type: 'compute.metrics.update'
        type: 'gauge'
        unit: 'MHz'
        volume: $.payload.metrics[?(@.name='cpu.frequency')].value
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.frequency')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.frequency')].source

      - name: 'compute.node.cpu.user.time'
        event_type: 'compute.metrics.update'
        type: 'cumulative'
        unit: 'ns'
        volume: $.payload.metrics[?(@.name='cpu.user.time')].value
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.user.time')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.user.time')].source

      - name: 'compute.node.cpu.kernel.time'
        event_type: 'compute.metrics.update'
        type: 'cumulative'
        unit: 'ns'
        volume: $.payload.metrics[?(@.name='cpu.kernel.time')].value
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.kernel.time')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.kernel.time')].source

      - name: 'compute.node.cpu.idle.time'
        event_type: 'compute.metrics.update'
        type: 'cumulative'
        unit: 'ns'
        volume: $.payload.metrics[?(@.name='cpu.idle.time')].value
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.idle.time')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.idle.time')].source

      - name: 'compute.node.cpu.iowait.time'
        event_type: 'compute.metrics.update'
        type: 'cumulative'
        unit: 'ns'
        volume: $.payload.metrics[?(@.name='cpu.iowait.time')].value
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.iowait.time')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.iowait.time')].source

      - name: 'compute.node.cpu.kernel.percent'
        event_type: 'compute.metrics.update'
        type: 'gauge'
        unit: 'percent'
        volume: $.payload.metrics[?(@.name='cpu.kernel.percent')].value * 100
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.kernel.percent')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.kernel.percent')].source

      - name: 'compute.node.cpu.idle.percent'
        event_type: 'compute.metrics.update'
        type: 'gauge'
        unit: 'percent'
        volume: $.payload.metrics[?(@.name='cpu.idle.percent')].value * 100
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.idle.percent')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.idle.percent')].source

      - name: 'compute.node.cpu.user.percent'
        event_type: 'compute.metrics.update'
        type: 'gauge'
        unit: 'percent'
        volume: $.payload.metrics[?(@.name='cpu.user.percent')].value * 100
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.user.percent')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.user.percent')].source

      - name: 'compute.node.cpu.iowait.percent'
        event_type: 'compute.metrics.update'
        type: 'gauge'
        unit: 'percent'
        volume: $.payload.metrics[?(@.name='cpu.iowait.percent')].value * 100
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.iowait.percent')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.iowait.percent')].source

      - name: 'compute.node.cpu.percent'
        event_type: 'compute.metrics.update'
        type: 'gauge'
        unit: 'percent'
        volume: $.payload.metrics[?(@.name='cpu.percent')].value * 100
        resource_id: $.payload.host + "_" + $.payload.nodename
        timestamp: $.payload.metrics[?(@.name='cpu.percent')].timestamp
        metadata:
          event_type: $.event_type
          host: $.publisher_id
          source: $.payload.metrics[?(@.name='cpu.percent')].source

      # Identity
      # NOTE(gordc): hack because jsonpath-rw-ext can't concat starting with string.
      - name: $.payload.outcome.`sub(/.*/, )` + 'identity.authenticate.' + $.payload.outcome
        type: 'delta'
        unit: 'user'
        volume: 1
        event_type:
          - 'identity.authenticate'
        resource_id: $.payload.initiator.id
        user_id: $.payload.initiator.id

      # DNS
      - name: 'dns.domain.exists'
        event_type: 'dns.domain.exists'
        type: 'cumulative'
        unit: 's'
        volume:
          fields: [$.payload.audit_period_beginning, $.payload.audit_period_ending]
          plugin: 'timedelta'
        project_id: $.payload.tenant_id
        resource_id: $.payload.id
        user_id: $.ctxt.user
        metadata:
          status: $.payload.status
          pool_id: $.payload.pool_id
          host: $.publisher_id

      # Trove
      - name: 'trove.instance.exists'
        event_type: 'trove.instance.exists'
        type: 'cumulative'
        unit: 's'
        volume:
          fields: [$.payload.audit_period_beginning, $.payload.audit_period_ending]
          plugin: 'timedelta'
        project_id: $.payload.tenant_id
        resource_id: $.payload.instance_id
        user_id: $.payload.user_id
        metadata:
          nova_instance_id: $.payload.nova_instance_id
          state: $.payload.state
          service_id: $.payload.service_id
          instance_type: $.payload.instance_type
          instance_type_id: $.payload.instance_type_id

      # Manila
      - name: 'manila.share.size'
        event_type:
          - 'share.create.*'
          - 'share.delete.*'
          - 'share.extend.*'
          - 'share.shrink.*'
        type: 'gauge'
        unit: 'GiB'
        volume: $.payload.size
        user_id: $.payload.user_id
        project_id: $.payload.project_id
        resource_id: $.payload.share_id
        metadata:
          name: $.payload.name
          host: $.payload.host
          status: $.payload.status
          availability_zone: $.payload.availability_zone
          protocol: $.payload.proto
  polling:
    sources:
      - name: all_pollsters
        interval: 600
        meters:
          - "*"
  pipeline:
    sinks:
      - name: meter_sink
        publishers:
          - notifier://
          - gnocchi://
    sources:
      - meters:
          - "*"
        name: meter_source
        sinks:
          - meter_sink

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - ceilometer-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
  static:
    central:
      jobs:
        - ceilometer-db-sync
        - ceilometer-rabbit-init
        - ceilometer-ks-user
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: metric
    ipmi:
      jobs:
        - ceilometer-db-sync
        - ceilometer-rabbit-init
        - ceilometer-ks-user
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: metric
    compute:
      jobs:
        - ceilometer-db-sync
        - ceilometer-rabbit-init
        - ceilometer-ks-user
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: metric
    db_sync:
      services:
        - endpoint: internal
          service: metric
    ks_user:
      services:
        - endpoint: internal
          service: identity
    rabbit_init:
      services:
      - service: oslo_messaging
        endpoint: internal
    notification:
      jobs:
        - ceilometer-db-sync
        - ceilometer-rabbit-init
        - ceilometer-ks-user
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: metric
    image_repo_sync:
      services:
        - endpoint: internal
          service: local_image_registry

# Names of secrets used by bootstrap and environmental checks
secrets:
  identity:
    admin: ceilometer-keystone-admin
    ceilometer: ceilometer-keystone-user
  oslo_messaging:
    admin: ceilometer-rabbitmq-admin
    ceilometer: ceilometer-rabbitmq-user
  oci_image_registry:
    ceilometer: ceilometer-oci-image-registry

bootstrap:
  enabled: false
  ks_user: ceilometer
  script: |
    openstack token issue

# typically overridden by environmental
identity:
  openrc:
    exclude_vars: []
    extra_vars: []

# values, but should include all endpoints
# required by this chart
endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  oci_image_registry:
    name: oci-image-registry
    namespace: oci-image-registry
    auth:
      enabled: false
      ceilometer:
        username: ceilometer
        password: password
    hosts:
      default: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        default: null
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      ceilometer:
        role:
          - admin
          - ResellerAdmin
        region_name: RegionOne
        username: ceilometer
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: 'http'
    port:
      api:
        default: 80
        internal: 5000
  metric:
    name: gnocchi
    hosts:
      default: gnocchi-api
      public: gnocchi
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: 'http'
    port:
      api:
        default: 8041
        public: 80
  alarming:
    name: aodh
    hosts:
      default: aodh-api
      public: aodh
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: 'http'
    port:
      api:
        default: 8042
        public: 80
  oslo_cache:
    auth:
      # NOTE(portdirect): this is used to define the value for keystone
      # authtoken cache encryption key, if not set it will be populated
      # automatically with a random value, but to take advantage of
      # this feature all services should be set to use the same key,
      # and memcache service.
      memcache_secret_key: null
    hosts:
      default: memcached
    host_fqdn_override:
      default: null
    port:
      memcache:
        default: 11211
  oslo_messaging:
    auth:
      admin:
        username: rabbitmq
        password: password
      ceilometer:
        username: ceilometer
        password: password
    statefulset:
      replicas: 2
      name: rabbitmq-rabbitmq
    hosts:
      default: rabbitmq
    host_fqdn_override:
      default: null
    path: /ceilometer
    scheme: rabbit
    port:
      amqp:
        default: 5672
      http:
        default: 15672

pod:
  affinity:
    anti:
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
      weight:
        default: 10
  tolerations:
    ceilometer:
      enabled: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  mounts:
    ceilometer_compute:
      init_container: null
      ceilometer_compute:
        volumeMounts:
        volumes:
    ceilometer_central:
      init_container: null
      ceilometer_central:
        volumeMounts:
        volumes:
    ceilometer_ipmi:
      init_container: null
      ceilometer_ipmi:
        volumeMounts:
        volumes:
    ceilometer_notification:
      init_container: null
      ceilometer_notification:
        volumeMounts:
        volumes:
    ceilometer_db_sync:
      ceilometer_db_sync:
        volumeMounts:
        volumes:
  # -- This allows users to add Kubernetes Projected Volumes to be mounted at /etc/ceilometer/ceilometer.conf.d/
  ## This is a list of projected volume source objects for each deployment/statefulset/daemonset/cronjob
  ## https://kubernetes.io/docs/concepts/storage/projected-volumes/
  etcSources:
    ceilometer_compute: []
    ceilometer_central: []
    ceilometer_ipmi: []
    ceilometer_notification: []
    ceilometer_db_sync: []
  replicas:
    central: 1
    notification: 1
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 3
      daemonsets:
        pod_replacement_strategy: RollingUpdate
        compute:
          enabled: true
          min_ready_seconds: 0
          max_unavailable: 1
        ipmi:
          enabled: true
          min_ready_seconds: 0
          max_unavailable: 1
  resources:
    enabled: true
    compute:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    notification:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    central:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    ipmi:
      requests:
        memory: "124Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    jobs:
      db_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      rabbit_init:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      ks_user:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      image_repo_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"

manifests:
  configmap_bin: true
  configmap_etc: true
  deployment_central: true
  daemonset_compute: true
  daemonset_ipmi: false
  deployment_notification: true
  job_bootstrap: true
  job_db_sync: true
  job_image_repo_sync: true
  job_ks_user: true
  job_rabbit_init: true
  secret_keystone: true
  secret_rabbitmq: true
  secret_registry: true

