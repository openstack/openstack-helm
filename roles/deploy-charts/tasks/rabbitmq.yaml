---
- name: Create Rabbit values file
  copy:
    dest: /tmp/rabbit.yaml
    content: |
      pod:
        replicas:
          server: {{ osh_rabbitmq_replicas }}
      volume:
        # "pvc" claims a PersistentVolume from the Rook StorageClass, "local"
        # puts the mnesia directory on a host path. Without Ceph there is no
        # StorageClass at all, so it follows osh_ceph_storage unless a
        # playbook pins osh_rabbitmq_storage.
        enabled: {{ (_rabbitmq_storage == 'pvc') | ternary('true', 'false') }}
        class_name: {{ osh_ceph_storage_class }}
        use_local_path:
          enabled: {{ (_rabbitmq_storage == 'pvc') | ternary('false', 'true') }}
  vars:
    _rabbitmq_storage: "{{ osh_rabbitmq_storage | default(osh_ceph_storage | bool | ternary('pvc', 'local')) }}"

- name: Deploy rabbitmq
  include_tasks: _install.yaml
  vars:
    osh_chart: rabbitmq
    osh_values_overrides_rabbitmq:
      - /tmp/rabbit.yaml
