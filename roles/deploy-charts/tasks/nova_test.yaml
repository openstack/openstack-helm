# Exercise a deployed compute kit end to end with Heat: public network,
# subnet pool and keypair, then a VM which is checked for outbound
# connectivity and for reaching the metadata and keystone endpoints. When
# cinder is deployed it also attaches a volume and confirms the guest sees
# the new block device.
---
- name: Exercise the compute kit
  include_tasks: _script.yaml
  vars:
    osh_script: nova_test.sh
    osh_script_assets:
      - heat
    osh_script_env:
      HEAT_DIR: "{{ osh_scripts_dir }}/heat"
      # The dpdk override changes how the VM's port is attached, so the
      # Heat template needs to know which of the two it is rendering for.
      DPDK_ENABLED: "{{ 'enabled' if 'dpdk.yaml' in (osh_values_overrides | default([])) else 'disabled' }}"
...
