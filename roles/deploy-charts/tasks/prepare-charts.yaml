- name: Build all OSH charts
  become: false
  make:
    chdir: "{{ osh_git_repo }}"
    target: all
    params:
      SKIP_CHANGELOG: 1

# Tell every chart how many RabbitMQ servers there actually are. See
# osh_rabbitmq_replicas in this role's defaults for why this is needed and why
# it is applied ahead of the per-chart overrides rather than with --set.
- name: Create the common values file
  copy:
    dest: "{{ osh_common_values_file }}"
    content: |
      ---
      endpoints:
        oslo_messaging:
          statefulset:
            replicas: {{ osh_rabbitmq_replicas }}
      ...
