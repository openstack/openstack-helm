# Make every CronJob in the cluster run once, now, and assert it succeeds.
#
# The charts ship two dozen CronJobs -- fernet and credential rotation, db
# purges, backups, row archival -- and none of them schedule anything inside
# the lifetime of a job, so without this their pod specs are never exercised
# at all and a bad mount or image only surfaces in a real deployment.
#
# Cluster-wide and self-contained: no arguments, no environment, nothing but
# kubectl.
---
- name: Force a run of every CronJob
  include_tasks: _script.yaml
  vars:
    osh_script: force-cronjob-run.sh
...
