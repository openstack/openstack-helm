# Walk the Nagios Services, Host Groups and Hosts pages, screenshotting each.
#
# The test carries its own credentials and endpoint as defaults and creates
# the artifacts directory it screenshots into, so there is nothing to pass
# in here. Override any of it through osh_script_env if a job needs to.
---
- name: Run the Nagios Selenium test
  include_tasks: _script.yaml
  vars:
    osh_script: selenium_tests/nagios_selenium.py
    osh_script_assets:
      - selenium_tests
    # A Selenium failure is a dashboard problem, not a deployment problem:
    # log it and let the job carry on, as this test always has.
    osh_script_ignore_errors: true
...
