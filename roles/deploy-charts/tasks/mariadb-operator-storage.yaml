# Prepare the host directory that backs the MariaDB PersistentVolume.
#
# kubelet creates a hostPath directory as root:root 0755, and the operator runs
# mariadbd as a non-root user, so the server aborts with 'Can't create/write to
# file ... (Errcode: 13 "Permission denied")'. fsGroup does not help: Kubernetes
# does not apply ownership management to hostPath volumes.
#
# The mode is deliberately permissive rather than a specific owner: the uid
# mariadbd runs as belongs to the operator and the image, and this is a
# disposable volume in a single-use CI node.
#
# Runs on every node, because nothing pins the pod to one.
---
- name: Create the host directory backing the MariaDB volume
  file:
    path: "{{ osh_mariadb_operator_storage_path }}"
    state: directory
    mode: "0777"
  become: true
