---
- name: Create Glance values file
  copy:
    dest: /tmp/glance.yaml
    content: |
      # With Ceph the image store and the staging area are
      # PersistentVolumeClaims on the Rook StorageClass; without it there is no
      # StorageClass at all, so images land on a host path. See
      # osh_ceph_storage. A playbook that wants a specific backend regardless
      # (the ones that deploy no Ceph all pin "local") sets osh_glance_backend.
      # Both claims are gated on storage being "pvc", so the class names below
      # are inert for every other backend.
      storage: {{ osh_glance_backend | default(osh_ceph_storage | bool | ternary('pvc', 'local')) }}
      volume:
        class_name: {{ osh_ceph_storage_class }}
      volume_staging:
        class_name: {{ osh_ceph_storage_class }}

- name: Deploy glance
  include_tasks: _install.yaml
  vars:
    osh_chart: glance
    osh_values_overrides_glance:
      - /tmp/glance.yaml
    osh_helm_timeout: 800

- name: "Print Openstack service list"
  shell:
    openstack service list
  environment:
    OS_CLOUD: openstack_helm

- name: "Print Openstack image list"
  shell:
    openstack image list -f value -c ID 2>/dev/null
  environment:
    OS_CLOUD: openstack_helm
  register: _glance_images

- name: "Print detailed info for images"
  shell:
    openstack image show {{ item }}
  environment:
    OS_CLOUD: openstack_helm
  loop: "{{ _glance_images.stdout_lines }}"
