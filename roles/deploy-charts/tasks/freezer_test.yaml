# Smoke test for the Freezer chart: installs the freezer client from the
# matching stable branch into a virtualenv and lists jobs through the API.
---
- name: Run the Freezer smoke test
  include_tasks: _script.yaml
  vars:
    osh_script: freezer_smoke_test.sh
    osh_script_env:
      OPENSTACK_RELEASE: "{{ osh_openstack_release | default('2026.1') }}"
...
