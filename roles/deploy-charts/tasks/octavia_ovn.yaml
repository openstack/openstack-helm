# Deploy Octavia for the OVN provider driver alone. values_overrides/octavia/
# ovn.yaml enables the driver. The worker and the health manager serve only
# amphorae and plug ports of the lb-mgmt-net network, which the OVN job does
# not create (see octavia_resources.yaml), so they are disabled.
---
- name: Create Octavia values file
  copy:
    dest: /tmp/octavia.yaml
    content: |
      conf:
        octavia:
          task_flow:
            jobboard_enabled: false
      manifests:
        daemonset_health_manager: false
        daemonset_worker: false

- name: Deploy octavia
  include_tasks: _install.yaml
  vars:
    osh_chart: octavia
    osh_values_overrides_octavia:
      - /tmp/octavia.yaml
