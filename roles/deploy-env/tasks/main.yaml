---
- name: Include prerequisites tasks
  include_tasks:
    file: prerequisites.yaml

- name: Overlay network
  include_tasks:
    file: overlay.yaml
  when: overlay_network_setup

- name: Configure /etc/hosts
  template:
    src: files/hosts
    dest: /etc/hosts

- name: Loop devices
  include_tasks:
    file: loopback_devices.yaml
  when: loopback_setup and inventory_hostname in (groups['k8s_cluster'] | default([]))

- name: Loop device mount
  include_tasks:
    file: loopback_devices_mount.yaml
  when: loopback_setup and inventory_hostname in (groups['k8s_cluster'] | default([]))

- name: Deploy Containerd
  include_tasks:
    file: containerd.yaml

- name: Include K8s common tasks
  include_tasks:
    file: k8s_common.yaml
  when: inventory_hostname in (groups['k8s_cluster'] | default([]))

# Later tasks shell out to these, and a `shell:` block that cannot find its
# binary reports "No such file or directory" from whatever was wrapping it,
# nowhere near the install that did not happen. Check them once, here, where
# the message can name the tool and the node.
- name: Check K8s node tools are installed
  shell: command -v {{ item }}
  changed_when: false
  loop:
    - crictl
    - kubeadm
    - kubelet
    - kubectl
  when: inventory_hostname in (groups['k8s_cluster'] | default([]))

- name: Include K8s control-plane tasks
  include_tasks:
    file: k8s_control_plane.yaml
  when: inventory_hostname in (groups['k8s_control_plane'] | default([]))

- name: Prepare kubeadm config
  template:
    src: files/etc_default_kubelet.j2
    dest: /etc/default/kubelet
  when: inventory_hostname in (groups['k8s_cluster'] | default([]))

# The join command is registered on the control-plane node. Extracting it from
# another host's facts reports only that an attribute is missing, and does so
# on every worker except the control-plane node that is actually at fault.
- name: Check the control-plane node published a join command
  assert:
    that:
      - _control_plane in hostvars
      - hostvars[_control_plane].join_command is defined
      - hostvars[_control_plane].join_command.stdout_lines | default([]) | length > 0
    fail_msg: >-
      The control-plane node ({{ _control_plane }}) did not register
      join_command, so `kubeadm token create` never ran there. The failure is
      on {{ _control_plane }} earlier in this play, not in this task.
  vars:
    _control_plane: "{{ (groups['k8s_control_plane'] | default([]))[0] | default('') }}"
  when: inventory_hostname in (groups['k8s_nodes'] | default([]))

# kubeadm does retry discovery internally, but only by re-reading cluster-info
# over the connection it already has, so it cannot recover from a node whose
# view of the cluster is wrong.
#
# Retrying the whole command gives the node a fresh process, which reaches the
# API server over a new connection rather than the one it was stuck on. Reset
# before each attempt so that one which got past discovery and then failed does
# not leave state behind, and skip the task entirely once kubelet.conf exists
# so it stays idempotent.
#
# When an attempt fails, print the token IDs that the cluster-info this node
# reads is signed for. kubeadm's discovery client sets InsecureSkipTLSVerify,
# so an API server belonging to another cluster answers without complaint, and
# its cluster-info is signed for that cluster's tokens instead of ours. Token
# IDs that are not ours are therefore evidence that the node was reading
# somebody else's API server.
- name: Join workload nodes to cluster
  shell: |
    set -o pipefail
    if [ -f /etc/kubernetes/kubelet.conf ]; then
      exit 0
    fi
    kubeadm reset -f > /dev/null 2>&1 || true
    rc=0
    {{ _join_command }} || rc=$?
    if [ "${rc}" -eq 0 ]; then
      exit 0
    fi
    echo "kubeadm join failed, cluster-info read from {{ _api_endpoint }} is signed for:"
    curl -sk --max-time 10 \
      "https://{{ _api_endpoint }}/api/v1/namespaces/kube-public/configmaps/cluster-info" \
      | grep -o 'jws-kubeconfig-[a-z0-9]*' \
      || echo "  (no cluster-info could be read)"
    exit "${rc}"
  args:
    executable: /bin/bash
  vars:
    _join_command: "{{ (groups['k8s_control_plane'] | map('extract', hostvars, ['join_command', 'stdout_lines', 0]))[0] }}"
    # `kubeadm token create --print-join-command` prints
    # `kubeadm join <endpoint> --token ...`, so the endpoint is the third word.
    _api_endpoint: "{{ _join_command.split()[2] }}"
  register: _kubeadm_join
  until: _kubeadm_join.rc == 0
  retries: "{{ kubeadm_join_retries | int }}"
  delay: 30
  when: inventory_hostname in (groups['k8s_nodes'] | default([]))

- name: Include K8s client tasks
  include_tasks:
    file: k8s_client.yaml
  when: inventory_hostname in (groups['primary'] | default([]))

- name: Include Calico tasks
  include_tasks:
    file: calico.yaml
  when: calico_setup

- name: Include Cilium tasks
  include_tasks:
    file: cilium.yaml
  when: cilium_setup

- name: Include Flannel tasks
  include_tasks:
    file: flannel.yaml
  when: flannel_setup

- name: Include coredns resolver tasks
  include_tasks:
    file: coredns_resolver.yaml
  when: coredns_resolver_setup

- name: Include floating network tasks
  include_tasks:
    file: floating_network.yaml
  when:
    - floating_network_setup
    - inventory_hostname in (groups['k8s_control_plane'] | default([]))

- name: Include Metallb tasks
  include_tasks:
    file: metallb.yaml
  when: metallb_setup

- name: Include client-to-cluster tunnel tasks
  include_tasks:
    file: client_cluster_tunnel.yaml
  when: (groups['primary'] | difference(groups['k8s_control_plane']) | length > 0)

- name: Include client-to-cluster ssh key tasks
  include_tasks:
    file: client_cluster_ssh.yaml
  when: client_cluster_ssh_setup

- name: Include Ingress-nginx tasks
  include_tasks:
    file: ingress_nginx.yaml
  when:
    - ingress_setup
    - ingress_implementation == "nginx"
    - inventory_hostname in (groups['primary'] | default([]))

- name: Include HAProxy ingress tasks
  include_tasks:
    file: ingress_haproxy.yaml
  when:
    - ingress_setup
    - ingress_implementation == "haproxy"
    - inventory_hostname in (groups['primary'] | default([]))

- name: Include Envoy Gateway tasks
  include_tasks:
    file: gatewayapi_envoy.yaml
  when:
    - gatewayapi_setup
    - gatewayapi_implementation == "envoy"
    - inventory_hostname in (groups['primary'] | default([]))

- name: Include cert-manager tasks
  include_tasks:
    file: cert_manager.yaml
  when: cert_manager_setup

- name: Include public endpoints tasks
  include_tasks:
    file: public_endpoints.yaml
  when:
    - ingress_setup or gatewayapi_setup
    - metallb_setup

- name: Include env inventory tasks
  include_tasks:
    file: env_inventory.yaml
  when:
    - inventory_hostname in (groups['primary'] | default([]))
...
