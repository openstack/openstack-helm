---
- name: "creating directory for cluster scoped objects"
  file:
    path: "{{ logs_dir }}/objects/cluster"
    state: directory

- name: "Gathering descriptions for cluster scoped objects"
  shell: |-
          set -e
          export OBJECT_TYPE=node,clusterrole,clusterrolebinding,storageclass,namespace
          export PARALLELISM_FACTOR=2

          function list_objects () {
            printf ${OBJECT_TYPE} | xargs -d ',' -I {} -P1 -n1 bash -c 'echo "$@"' _ {}
          }
          export -f list_objects

          function name_objects () {
            export OBJECT=$1
            kubectl get ${OBJECT} -o name | xargs -L1 -I {} -P1 -n1 bash -c 'echo "${OBJECT} ${1#*/}"' _ {}
          }
          export -f name_objects

          function get_objects () {
            input=($1)
            export OBJECT=${input[0]}
            export NAME=${input[1]#*/}
            echo "${OBJECT}/${NAME}"
            DIR="{{ logs_dir }}/objects/cluster/${OBJECT}"
            mkdir -p ${DIR}
            kubectl get ${OBJECT} ${NAME} -o yaml > "${DIR}/${NAME}.yaml"
            kubectl describe ${OBJECT} ${NAME} > "${DIR}/${NAME}.txt"
          }
          export -f get_objects

          list_objects | \
            xargs -r -n 1 -P ${PARALLELISM_FACTOR} -I {} bash -c 'name_objects "$@"' _ {} | \
            xargs -r -n 1 -P ${PARALLELISM_FACTOR} -I {} bash -c 'get_objects "$@"' _ {}
  args:
    executable: /bin/bash
  ignore_errors: True

- name: "creating directory for namespace scoped objects"
  file:
    path: "{{ logs_dir }}/objects/namespaced"
    state: directory

- name: "Gathering descriptions for namespace scoped objects"
  shell: |-
          set -e
          OBJECT_TYPES=(
            configmaps
            cronjobs
            daemonsets
            deployment
            endpoints
            ingresses
            jobs
            networkpolicies
            pods
            persistentvolumeclaims
            rolebindings
            roles
            secrets
            serviceaccounts
            services
            statefulsets
          )
          # Custom resources rendered by the charts. Use fully-qualified names
          # since some plurals (users, roles, services, endpoints, policies)
          # clash with core types or across API groups.
          CUSTOM_OBJECT_TYPES=(
            databases.mariadb.osh.openstack.org
            users.mariadb.osh.openstack.org
            grants.mariadb.osh.openstack.org
            connections.mariadb.osh.openstack.org
            vhosts.rabbitmq.osh.openstack.org
            users.rabbitmq.osh.openstack.org
            permissions.rabbitmq.osh.openstack.org
            queues.rabbitmq.osh.openstack.org
            exchanges.rabbitmq.osh.openstack.org
            bindings.rabbitmq.osh.openstack.org
            policies.rabbitmq.osh.openstack.org
            domains.keystone.osh.openstack.org
            projects.keystone.osh.openstack.org
            roles.keystone.osh.openstack.org
            groups.keystone.osh.openstack.org
            users.keystone.osh.openstack.org
            roleassignments.keystone.osh.openstack.org
            services.keystone.osh.openstack.org
            endpoints.keystone.osh.openstack.org
            # Third-party operators (mariadb_db.api_group: k8s.mariadb.com,
            # rabbitmq_topology.api_group: rabbitmq.com)
            mariadbs.k8s.mariadb.com
            databases.k8s.mariadb.com
            users.k8s.mariadb.com
            grants.k8s.mariadb.com
            connections.k8s.mariadb.com
            rabbitmqclusters.rabbitmq.com
            vhosts.rabbitmq.com
            users.rabbitmq.com
            permissions.rabbitmq.com
            queues.rabbitmq.com
            exchanges.rabbitmq.com
            bindings.rabbitmq.com
            policies.rabbitmq.com
          )
          # Only gather custom resources whose CRD is installed. Discovery can
          # partially fail (e.g. an unavailable aggregated API), so don't let
          # it abort collection of the other objects.
          API_RESOURCES=$(kubectl api-resources --namespaced=true -o name || true)
          for TYPE in "${CUSTOM_OBJECT_TYPES[@]}"; do
            if grep -qxF "${TYPE}" <<< "${API_RESOURCES}"; then
              OBJECT_TYPES+=("${TYPE}")
            fi
          done
          # Arrays can't be exported to the bash -c subshells below, so pass
          # the list as a comma-separated string.
          export OBJECT_TYPE=$(IFS=,; echo "${OBJECT_TYPES[*]}")
          export PARALLELISM_FACTOR=2
          function get_namespaces () {
            kubectl get namespaces -o name | awk -F '/' '{ print $NF }'
          }

          function list_namespaced_objects () {
            export NAMESPACE=$1
            printf ${OBJECT_TYPE} | xargs -d ',' -I {} -P1 -n1 bash -c 'echo "${NAMESPACE} $@"' _ {}
          }
          export -f list_namespaced_objects

          function name_objects () {
            input=($1)
            export NAMESPACE=${input[0]}
            export OBJECT=${input[1]}
            kubectl get -n ${NAMESPACE} ${OBJECT} -o name | xargs -L1 -I {} -P1 -n1 bash -c 'echo "${NAMESPACE} ${OBJECT} $@"' _ {}
          }
          export -f name_objects

          function get_objects () {
            input=($1)
            export NAMESPACE=${input[0]}
            export OBJECT=${input[1]}
            export NAME=${input[2]#*/}
            echo "${NAMESPACE}/${OBJECT}/${NAME}"
            DIR="{{ logs_dir }}/objects/namespaced/${NAMESPACE}/${OBJECT}"
            mkdir -p ${DIR}
            kubectl get -n ${NAMESPACE} ${OBJECT} ${NAME} -o yaml > "${DIR}/${NAME}.yaml"
            kubectl describe -n ${NAMESPACE} ${OBJECT} ${NAME} > "${DIR}/${NAME}.txt"
          }
          export -f get_objects

          get_namespaces | \
            xargs -r -n 1 -P ${PARALLELISM_FACTOR} -I {} bash -c 'list_namespaced_objects "$@"' _ {} | \
            xargs -r -n 1 -P ${PARALLELISM_FACTOR} -I {} bash -c 'name_objects "$@"' _ {} | \
            xargs -r -n 1 -P ${PARALLELISM_FACTOR} -I {} bash -c 'get_objects "$@"' _ {}
  args:
    executable: /bin/bash
  ignore_errors: True

- name: "Downloads logs to executor"
  synchronize:
    src: "{{ logs_dir }}/objects"
    dest: "{{ zuul.executor.log_root }}/{{ inventory_hostname }}"
    mode: pull
  ignore_errors: yes
...
