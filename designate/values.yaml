# Default values for designate.
# This is a YAML-formatted file.
# Declare name/value pairs to be passed into your templates.
# name: value

---
release_group: null

labels:
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  central:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  producer:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  worker:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  mdns:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  service_cleaner:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  sink:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

images:
  tags:
    bootstrap: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    db_init: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    db_drop: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    rabbit_init: docker.io/rabbitmq:4.3.7-management
    ks_user: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_service: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_endpoints: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    designate_db_sync: quay.io/airshipit/designate:2026.2-ubuntu_resolute
    designate_api: quay.io/airshipit/designate:2026.2-ubuntu_resolute
    designate_central: quay.io/airshipit/designate:2026.2-ubuntu_resolute
    designate_mdns: quay.io/airshipit/designate:2026.2-ubuntu_resolute
    designate_worker: quay.io/airshipit/designate:2026.2-ubuntu_resolute
    designate_producer: quay.io/airshipit/designate:2026.2-ubuntu_resolute
    designate_sink: quay.io/airshipit/designate:2026.2-ubuntu_resolute
    designate_service_cleaner: quay.io/airshipit/designate:2026.2-ubuntu_resolute
  pull_policy: "IfNotPresent"
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

pod:
  security_context:
    designate:
      pod:
        runAsUser: 42424
      container:
        designate_api:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        designate_central:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        designate_mdns:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        designate_producer:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        designate_sink:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        designate_worker:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        designate_worker_init:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
  affinity:
    anti:
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
  mounts:
    designate_api:
      init_container: null
      designate_api:
        volumeMounts:
        volumes:
    designate_central:
      init_container: null
      designate_central:
        volumeMounts:
        volumes:
    designate_mdns:
      init_container: null
      designate_mdns:
        volumeMounts:
        volumes:
    designate_worker:
      init_container: null
      designate_worker:
        volumeMounts:
        volumes:
    designate_producer:
      init_container: null
      designate_producer:
        volumeMounts:
        volumes:
    designate_service_cleaner:
      init_container: null
      designate_service_cleaner:
        volumeMounts:
        volumes:
    designate_sink:
      init_container: null
      designate_sink:
        volumeMounts:
        volumes:
    designate_db_sync:
      designate_db_sync:
        volumeMounts:
        volumes:
    designate_bootstrap:
      init_container: null
      designate_bootstrap:
        volumeMounts:
        volumes:
  # -- This allows users to add Kubernetes Projected Volumes to be mounted at /etc/designate/designate.conf.d/
  ## This is a list of projected volume source objects for each deployment/statefulset/daemonset/cronjob
  ## https://kubernetes.io/docs/concepts/storage/projected-volumes/
  etcSources:
    designate_api: []
    designate_central: []
    designate_mdns: []
    designate_worker: []
    designate_producer: []
    designate_sink: []
    designate_service_cleaner: []
    designate_db_sync: []
  replicas:
    api: 1
    central: 1
    mdns: 1
    producer: 1
    sink: 1
    worker: 1
  lifecycle:
    upgrades:
      statefulsets:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 3
    disruption_budget:
      api:
        min_available: 0
      central:
        min_available: 0
      mdns:
        min_available: 0
      worker:
        min_available: 0
      producer:
        min_available: 0
      sink:
        min_available: 0
    termination_grace_period:
      api:
        timeout: 30
      mdns:
        timeout: 30

  resources:
    enabled: false
    api:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    central:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    mdns:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    producer:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    sink:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    worker:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
    jobs:
      bootstrap:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      db_init:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      db_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      ks_endpoints:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      ks_service:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      ks_user:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      rabbit_init:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      service_cleaner:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      tests:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"

network:
  api:
    external_policy_local: false
    node_port:
      enabled: false
      port: 9001
  mdns:
    name: "designate-mdns"
    proto: "http"
    external_policy_local: false
    node_port:
      enabled: true
      port: 5354

bootstrap:
  enabled: false
  ks_user: admin
  script: |
    openstack token issue

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - designate-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
    job_rabbit_init:
      api:
        jobs:
          - designate-rabbit-init
      sink:
        jobs:
          - designate-rabbit-init
      central:
        jobs:
          - designate-rabbit-init
      worker:
        jobs:
          - designate-rabbit-init
  static:
    bootstrap:
      services:
        - service: identity
          endpoint: internal
        - service: dns
          endpoint: internal
    db_init:
      services:
        - service: oslo_db
          endpoint: internal
    db_sync:
      jobs:
        - designate-db-init
      services:
        - service: oslo_db
          endpoint: internal
    ks_user:
      services:
        - service: identity
          endpoint: internal
    ks_service:
      services:
        - service: identity
          endpoint: internal
    ks_endpoints:
      jobs:
        - designate-ks-service
      services:
        - service: identity
          endpoint: internal
    rabbit_init:
      services:
        - service: oslo_messaging
          endpoint: internal
    service_cleaner:
      jobs:
        - designate-db-sync
      services:
        - service: oslo_db
          endpoint: internal
    api:
      jobs:
        - designate-db-sync
        - designate-ks-user
        - designate-ks-endpoints
      services:
        - service: oslo_db
          endpoint: internal
        - service: identity
          endpoint: internal
        - service: oslo_messaging
          endpoint: internal
    central:
      jobs:
        - designate-db-sync
        - designate-ks-user
        - designate-ks-endpoints
      services:
        - service: oslo_db
          endpoint: internal
        - service: identity
          endpoint: internal
        - service: oslo_messaging
          endpoint: internal
    worker:
      jobs:
        - designate-db-sync
        - designate-ks-user
        - designate-ks-endpoints
      services:
        - service: oslo_db
          endpoint: internal
        - service: identity
          endpoint: internal
        - service: mdns
          endpoint: internal
    mdns:
      jobs:
        - designate-db-sync
        - designate-ks-user
        - designate-ks-endpoints
      services:
        - service: oslo_db
          endpoint: internal
        - service: identity
          endpoint: internal
    producer:
      jobs:
        - designate-db-sync
        - designate-ks-user
        - designate-ks-endpoints
      services:
        - service: oslo_db
          endpoint: internal
        - service: identity
          endpoint: internal
    sink:
      jobs:
        - designate-db-sync
        - designate-ks-user
        - designate-ks-endpoints
      services:
        - service: oslo_db
          endpoint: internal
        - service: identity
          endpoint: internal

conf:
  pools: |
    - name: default
      # The name is immutable. There will be no option to change the name after
      # creation and the only way will to change it will be to delete it
      # (and all zones associated with it) and recreate it.
      description: Default Pool

      attributes: {}

      # List out the NS records for zones hosted within this pool
      # This should be a record that is created outside of designate, that
      # points to the public IP of the controller node.
      ns_records:
        - hostname: {{ printf "ns.%s.svc.%s." .Release.Namespace .Values.endpoints.cluster_domain_suffix }}
          priority: 1

      # List out the nameservers for this pool. These are the actual DNS servers.
      # We use these to verify changes have propagated to all nameservers.
      nameservers:
        - host: ${POWERDNS_SERVICE_HOST}
          port: {{ tuple "powerdns" "internal" "powerdns" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}

      # List out the targets for this pool. For BIND there will be one
      # entry for each BIND server, as we have to run rndc command on each server
      targets:
        - type: pdns4
          description: PowerDNS Server

          # List out the designate-mdns servers from which PowerDNS servers should
          # request zone transfers (AXFRs) from.
          # This should be the IP of the controller node.
          # If you have multiple controllers you can add multiple masters
          # by running designate-mdns on them, and adding them here.
          masters:
            - host: ${MINIDNS_SERVICE_HOST}
              port: {{ tuple "mdns" "internal" "ipc" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}

          # PowerDNS Configuration options
          options:
            host: ${POWERDNS_SERVICE_HOST}
            port: {{ tuple "powerdns" "internal" "powerdns" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            api_endpoint: http://${POWERDNS_SERVICE_HOST}:{{ tuple "powerdns" "internal" "powerdns_api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            api_token: {{ tuple "powerdns" "service" . | include "helm-toolkit.endpoints.endpoint_token_lookup" }}
  paste:
    composite:osapi_dns:
      use: egg:Paste#urlmap
      /: osapi_dns_versions
      /v2: osapi_dns_v2
      /admin: osapi_dns_admin
    composite:osapi_dns_versions:
      use: call:designate.api.middleware:auth_pipeline_factory
      noauth: http_proxy_to_wsgi cors maintenance faultwrapper osapi_dns_app_versions
      keystone: http_proxy_to_wsgi cors maintenance faultwrapper osapi_dns_app_versions
    app:osapi_dns_app_versions:
      paste.app_factory: designate.api.versions:factory
    composite:osapi_dns_v2:
      use: call:designate.api.middleware:auth_pipeline_factory
      noauth: http_proxy_to_wsgi cors request_id faultwrapper validation_API_v2 noauthcontext maintenance normalizeuri osapi_dns_app_v2
      keystone: http_proxy_to_wsgi cors request_id faultwrapper validation_API_v2 authtoken keystonecontext maintenance normalizeuri osapi_dns_app_v2
    app:osapi_dns_app_v2:
      paste.app_factory: designate.api.v2:factory
    composite:osapi_dns_admin:
      use: call:designate.api.middleware:auth_pipeline_factory
      noauth: http_proxy_to_wsgi cors request_id faultwrapper noauthcontext maintenance normalizeuri osapi_dns_app_admin
      keystone: http_proxy_to_wsgi cors request_id faultwrapper authtoken keystonecontext maintenance normalizeuri osapi_dns_app_admin
    app:osapi_dns_app_admin:
      paste.app_factory: designate.api.admin:factory
    filter:cors:
      paste.filter_factory: oslo_middleware.cors:filter_factory
      oslo_config_project: designate
    filter:request_id:
      paste.filter_factory: oslo_middleware:RequestId.factory
    filter:http_proxy_to_wsgi:
      paste.filter_factory: oslo_middleware:HTTPProxyToWSGI.factory
    filter:noauthcontext:
      paste.filter_factory: designate.api.middleware:NoAuthContextMiddleware.factory
    filter:authtoken:
      paste.filter_factory: keystonemiddleware.auth_token:filter_factory
    filter:keystonecontext:
      paste.filter_factory: designate.api.middleware:KeystoneContextMiddleware.factory
    filter:maintenance:
      paste.filter_factory: designate.api.middleware:MaintenanceMiddleware.factory
    filter:normalizeuri:
      paste.filter_factory: designate.api.middleware:NormalizeURIMiddleware.factory
    filter:faultwrapper:
      paste.filter_factory: designate.api.middleware:FaultWrapperMiddleware.factory
    filter:validation_API_v2:
      paste.filter_factory: designate.api.middleware:APIv2ValidationErrorMiddleware.factory
  policy: {}
  designate:
    DEFAULT:
      debug: false
      log_config_append: /etc/designate/logging.conf
    service:api:
      auth_strategy: keystone
      enable_api_v2: true
      enable_api_admin: true
      enabled_extensions_v2: quotas,reports
      workers: 2
    # The threading backend of oslo.service rejects an unset workers count.
    service:central:
      workers: 1
    service:mdns:
      workers: 1
    service:producer:
      workers: 1
    service:sink:
      workers: 1
    service:worker:
      enabled: true
      notify: false
      workers: 1
    oslo_middleware:
      enable_proxy_headers_parsing: true
    oslo_policy:
      policy_file: /etc/designate/policy.yaml
    oslo_concurrency:
      lock_path: /var/lock
    database:
      max_retries: -1
      # -- Database connection URI. When empty the URI is auto-generated
      ## from endpoints.oslo_db. Set to null to disable auto-generation,
      ## e.g. when using an operator such as mariadb-operator that supplies
      ## the connection string via a mounted configuration snippet.
      connection: ""
    storage:sqlalchemy:
      max_retries: -1
      # -- Storage backend connection URI. When empty the URI is auto-generated
      ## from endpoints.oslo_db. Set to null to disable auto-generation,
      ## e.g. when using an operator such as mariadb-operator that supplies
      ## the connection string via a mounted configuration snippet.
      connection: ""
    oslo_messaging_rabbit:
      # -- Durable and quorum queues, which RabbitMQ 4.x requires: it denies
      ## transient non-exclusive queues, and oslo.messaging declares its RPC,
      ## notification, reply and fanout queues that way otherwise. Valid on 3.x.
      amqp_durable_queues: true
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: true
      use_queue_manager: true
      rabbit_qos_prefetch_count: 1
      rabbit_stream_fanout: true
    keystone_authtoken:
      auth_version: v3
      auth_type: password
      memcache_security_strategy: ENCRYPT
      service_type: dns
  logging:
    loggers:
      keys:
        - root
        - designate
    handlers:
      keys:
        - stdout
        - stderr
        - "null"
    formatters:
      keys:
        - context
        - default
    logger_root:
      level: WARNING
      handlers:
        - stdout
    logger_designate:
      level: INFO
      handlers:
        - stdout
      qualname: designate
      propagate: 0
    logger_amqp:
      level: WARNING
      handlers: stderr
      qualname: amqp
    logger_amqplib:
      level: WARNING
      handlers: stderr
      qualname: amqplib
    logger_eventletwsgi:
      level: WARNING
      handlers: stderr
      qualname: eventlet.wsgi.server
    logger_sqlalchemy:
      level: WARNING
      handlers: stderr
      qualname: sqlalchemy
    logger_boto:
      level: WARNING
      handlers: stderr
      qualname: boto
    handler_null:
      class: logging.NullHandler
      formatter: default
      args: ()
    handler_stdout:
      class: StreamHandler
      args: (sys.stdout,)
      formatter: context
    handler_stderr:
      class: StreamHandler
      args: (sys.stderr,)
      formatter: context
    formatter_context:
      class: oslo_log.formatters.ContextFormatter
      datefmt: "%Y-%m-%d %H:%M:%S"
    formatter_default:
      format: "%(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
  designate_api_uwsgi:
    uwsgi:
      add-header: "Connection: close"
      buffer-size: 65535
      die-on-term: true
      enable-threads: true
      exit-on-reload: false
      hook-master-start: unix_signal:15 gracefully_kill_them_all
      lazy-apps: true
      log-x-forwarded-for: true
      master: true
      need-app: true
      procname-prefix-spaced: "designate-api:"
      route-user-agent: '^kube-probe.* donotlog:'
      thunder-lock: true
      worker-reload-mercy: 80
      module: "designate.wsgi.api:application"
      stats: 0.0.0.0:1717
      stats-http: true

# Names of secrets used by bootstrap and environmental checks
secrets:
  identity:
    admin: designate-keystone-admin
    designate: designate-keystone-user
    test: designate-keystone-test
  oslo_db:
    admin: designate-db-admin
  oslo_messaging:
    admin: designate-rabbitmq-admin
    designate: designate-rabbitmq-user
  tls:
    dns:
      api:
        public: designate-tls-public
  oci_image_registry:
    designate: designate-oci-image-registry

identity:
  openrc:
    exclude_vars: []
    extra_vars: []

endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  oci_image_registry:
    name: oci-image-registry
    namespace: oci-image-registry
    auth:
      enabled: false
      designate:
        username: designate
        password: password
    hosts:
      default: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        default: null
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      designate:
        role: admin
        region_name: RegionOne
        username: designate
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
      test:
        role: admin
        region_name: RegionOne
        username: designate-test
        password: password
        project_name: test
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000
  dns:
    name: designate
    hosts:
      default: designate-api
      public: designate
    host_fqdn_override:
      default: null
    path:
      default: /
    scheme:
      default: 'http'
    port:
      api:
        default: 9001
        public: 80
  mdns:
    name: minidns
    hosts:
      default: minidns
      public: designate-mdns
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: 'tcp'
    port:
      ipc:
        default: 5354
  oslo_db:
    auth:
      admin:
        username: root
        password: password
      designate:
        username: designate
        password: password
    hosts:
      default: mariadb
    host_fqdn_override:
      default: null
    path: /designate
    scheme: mysql+pymysql
    port:
      mysql:
        default: 3306
  oslo_cache:
    hosts:
      default: memcached
    host_fqdn_override:
      default: null
    port:
      memcache:
        default: 11211
    auth:
      # NOTE: this is used to define the value for keystone
      # authtoken cache encryption key, if not set it will be populated
      # automatically with a random value, but to take advantage of
      # this feature all services should be set to use the same key,
      # and memcache service.
      memcache_secret_key: null
  oslo_messaging:
    auth:
      admin:
        username: rabbitmq
        password: password
      designate:
        username: designate
        password: password
    statefulset:
      replicas: 2
      name: rabbitmq-rabbitmq
    hosts:
      default: rabbitmq
    host_fqdn_override:
      default: null
    path: /designate
    scheme: rabbit
    port:
      amqp:
        default: 5672
      http:
        default: 15672
  powerdns:
    auth:
      service:
        token: chiave_segreta
    hosts:
      default: powerdns
    host_fqdn_override:
      default: null
    port:
      powerdns_api:
        default: 8081
      powerdns:
        default: 53

jobs:
  service_cleaner:
    cron: "*/10 * * * *"
    history:
      success: 3
      failed: 1

mariadb_db:
  # -- API group of the MariaDB custom resources this chart renders when
  ## manifests.mariadb_db is enabled. Either group works: the resources are
  ## the same, only who reconciles them differs.
  ##   mariadb.osh.openstack.org -- the mariadb chart's own db controller
  ##                                (manifests.deployment_db_controller)
  ##   k8s.mariadb.com           -- the upstream mariadb-operator, which must
  ##                                then be deployed separately
  api_group: mariadb.osh.openstack.org
  # -- Name of the MariaDB resource the Database, User, Grant and Connection
  ## attach to through mariaDbRef. When empty it is the oslo_db default host,
  ## which only works if the MariaDB resource shares its name with the service
  ## clients connect through. Set it when they differ, such as a MariaDB named
  ## mariadb served by a mariadb-primary service.
  mariadb_ref: ""
  # -- Secret holding the password of the designate database account.
  ## The User and Connection resources read it from here.
  password_secret:
    # -- Render the secret from endpoints.oslo_db.auth.designate.password. Set
    ## to false to use a secret that already exists, so the password does not
    ## need to be passed as a Helm value.
    create: true
    name: designate-db-password
    key: password

rabbitmq_topology:
  # -- API group of the RabbitMQ topology custom resources this chart renders
  ## when manifests.rabbitmq_topology is enabled. Either group works: the
  ## resources are the same, only who reconciles them differs.
  ##   rabbitmq.osh.openstack.org -- the rabbitmq chart's own topology
  ##                                 controller
  ##                                 (manifests.deployment_topology_controller)
  ##   rabbitmq.com               -- the upstream messaging-topology-operator,
  ##                                 which must then be deployed separately,
  ##                                 along with a RabbitmqCluster named after
  ##                                 endpoints.oslo_messaging.hosts.default for
  ##                                 rabbitmqClusterReference to resolve to
  api_group: rabbitmq.osh.openstack.org

manifests:
  configmap_bin: true
  configmap_etc: true
  cron_job_service_cleaner: true
  deployment_api: true
  # NOTE: central, worker and producer run as StatefulSets because each is
  # an oslo.messaging RPC server whose per-server `<topic>.<host>` queue is
  # named after `host`, which defaults to the hostname. Under a Deployment
  # that is the pod name, so it changed on every rollout, and quorum queues
  # cannot be declared `auto_delete`, which left the previous queues behind
  # each time. The StatefulSets give each pod a stable hostname
  # (designate-central-0, designate-central-1, ...) that is reused across
  # restarts. Each also renders the headless service those DNS names are
  # published through.
  statefulset_central: true
  statefulset_worker: true
  statefulset_producer: true
  deployment_mdns: true
  deployment_sink: false
  job_bootstrap: true
  job_db_init: true
  # -- Render the MariaDB Database/User/Grant/Connection custom resources
  ## reconciled by the mariadb chart's db controller, instead of running the
  ## db-init job. Mutually exclusive with job_db_init.
  mariadb_db: false
  job_db_sync: true
  job_ks_endpoints: true
  job_ks_service: true
  job_ks_user: true
  job_rabbit_init: true
  # -- Declare this chart's messaging vhost, account and permissions
  ## as RabbitMQ custom resources reconciled by the rabbitmq chart's
  ## topology controller, instead of running the rabbit_init job. The
  ## two are mutually exclusive.
  rabbitmq_topology: false
  pdb_api: true
  pdb_producer: true
  pdb_central: true
  pdb_worker: true
  pdb_mdns: true
  pdb_sink: false
  secret_db: true
  secret_keystone: true
  secret_rabbitmq: true
  secret_registry: true
  service_api: true
  service_mdns: true

# -- Extra K8s manifests to deploy. Either a list or a map of manifests.
## Note: Supports use of custom Helm templates
## Note: Helm replaces (instead of merging) list values when several values
## files are combined, so if you need to define extraObjects in more than one
## overrides file, use the map form and make sure the keys are unique across
## those files. With the list form only the last file takes effect.
extraObjects: {}
