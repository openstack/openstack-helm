---
- hosts: all
  strategy: linear
  # Stop the whole play as soon as any host fails. Several tasks here read
  # facts registered on another host, so letting the remaining hosts carry on
  # after one drops out turns a single real failure into a second, unrelated
  # looking one on every other host, and the second is the one that ends up at
  # the bottom of the log where it reads as the cause.
  any_errors_fatal: true
  become: true
  gather_facts: true
  roles:
    - ensure-python
    - ensure-pip
    - clear-firewall
    - deploy-apparmor
    - deploy-selenium
    - deploy-env
...
