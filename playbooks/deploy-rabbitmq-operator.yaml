# Playbook for deploying the upstream RabbitMQ cluster and messaging topology
# operators, plus a single RabbitmqCluster for them to manage, in place of the
# rabbitmq chart.
#
# Run this before playbooks/deploy-compute-kit.yaml and set
# rabbitmq_operator_enabled so that playbook skips the rabbitmq chart and the
# charts pick up their rabbitmq-operator.yaml overrides instead. cert-manager
# is required by the topology operator's webhooks, so deploy-env has to install
# it:
#   run:
#     - playbooks/deploy-env.yaml
#     - playbooks/deploy-rabbitmq-operator.yaml
#     - playbooks/deploy-compute-kit.yaml
#   vars:
#     cert_manager_setup: true
#     rabbitmq_operator_enabled: true
#     osh_values_overrides:
#       - "2026.1-ubuntu_noble.yaml"
#       - "rabbitmq-crd.yaml"
#       - "rabbitmq-operator.yaml"
---
- hosts: primary
  tasks:
    - name: Prepare Kubernetes
      include_role:
        name: deploy-charts
        tasks_from: prepare-k8s

    - name: Deploy the RabbitMQ operators
      include_role:
        name: deploy-charts
        tasks_from: rabbitmq-operator

    - name: Create the RabbitMQ cluster
      include_role:
        name: deploy-charts
        tasks_from: rabbitmq-operator-instance
