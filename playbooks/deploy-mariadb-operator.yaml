# Playbook for deploying mariadb-operator and a single MariaDB instance (one
# server, no Galera) for it to manage.
#
# Run this before playbooks/deploy-compute-kit.yaml and set
# mariadb_operator_enabled so that playbook skips the mariadb chart and the
# charts pick up their mariadb-operator.yaml overrides instead:
#   run:
#     - playbooks/deploy-env.yaml
#     - playbooks/deploy-mariadb-operator.yaml
#     - playbooks/deploy-compute-kit.yaml
#   vars:
#     mariadb_operator_enabled: true
#     osh_values_overrides:
#       - "2026.1-ubuntu_noble.yaml"
#       - "mariadb-operator.yaml"
---
# The MariaDB PersistentVolume is a host path, and nothing pins the pod to a
# particular node, so every node needs the directory to exist and be writable.
- hosts: all
  tasks:
    - name: Prepare the host directory backing the MariaDB volume
      include_role:
        name: deploy-charts
        tasks_from: mariadb-operator-storage

- hosts: primary
  tasks:
    - name: Prepare Kubernetes
      include_role:
        name: deploy-charts
        tasks_from: prepare-k8s

    - name: Deploy mariadb-operator
      include_role:
        name: deploy-charts
        tasks_from: mariadb-operator

    - name: Create the MariaDB instance
      include_role:
        name: deploy-charts
        tasks_from: mariadb-operator-instance
