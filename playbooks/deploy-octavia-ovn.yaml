# Playbook for Octavia deployment and testing with the OVN provider driver.
#
# Deploys a compute kit with OVN networking and Octavia with the OVN
# provider driver alone, with no amphora components. Then runs a Heat-based
# integration test of an OVN load balancer (octavia_ovn_test).
#
# The job must list ovn.yaml in osh_values_overrides: it selects the OVN
# overrides of the compute kit charts and of octavia.
#
# Usage in zuul.d job definition:
#   run:
#     - playbooks/deploy-env.yaml
#     - playbooks/deploy-octavia-ovn.yaml
---
- hosts: primary
  tasks:
    - name: Prepare Kubernetes
      include_role:
        name: deploy-charts
        tasks_from: prepare-k8s

    - name: Prepare charts
      include_role:
        name: deploy-charts
        tasks_from: prepare-charts

    - name: Setup OpenStack client
      include_role:
        name: deploy-charts
        tasks_from: setup-client

    - name: Deploy RabbitMQ
      include_role:
        name: deploy-charts
        tasks_from: rabbitmq

    - name: Deploy MariaDB
      include_role:
        name: deploy-charts
        tasks_from: mariadb

    - name: Deploy Memcached
      include_role:
        name: deploy-charts
        tasks_from: memcached

    - name: Deploy Keystone
      include_role:
        name: deploy-charts
        tasks_from: keystone

    - name: Deploy Heat
      include_role:
        name: deploy-charts
        tasks_from: heat

    - name: Deploy Glance
      include_role:
        name: deploy-charts
        tasks_from: glance
      vars:
        osh_glance_backend: local

    - name: Deploy Open vSwitch
      include_role:
        name: deploy-charts
        tasks_from: openvswitch

    - name: Deploy Libvirt
      include_role:
        name: deploy-charts
        tasks_from: libvirt

    - name: Deploy OVN
      include_role:
        name: deploy-charts
        tasks_from: ovn

    - name: Deploy Placement
      include_role:
        name: deploy-charts
        tasks_from: placement

    - name: Deploy Nova
      include_role:
        name: deploy-charts
        tasks_from: nova

    - name: Deploy Neutron
      include_role:
        name: deploy-charts
        tasks_from: neutron

    - name: Deploy Octavia
      include_role:
        name: deploy-charts
        tasks_from: octavia_ovn

    - name: Run Octavia OVN integration test
      include_role:
        name: deploy-charts
        tasks_from: octavia_ovn_test
