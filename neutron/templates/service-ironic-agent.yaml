{{/*
The governing service shares manifests.statefulset_ironic_agent rather than
carrying its own key: a StatefulSet whose serviceName names a service that
does not exist has no per-ordinal DNS, so the two are never useful apart.
*/}}
{{- if .Values.manifests.statefulset_ironic_agent }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: neutron-ironic-agent
spec:
  # Named by the ironic agent StatefulSet's serviceName. It publishes the
  # per-ordinal DNS names (neutron-ironic-agent-0.neutron-ironic-agent...)
  # so that the FQDN the init container writes as the agent's `host`
  # resolves. The agent listens on nothing, so the service is headless and
  # declares no ports, which Kubernetes allows only for a headless service.
  clusterIP: None
  # The agent's readiness probe reports whether it can reach neutron-server,
  # so without this an agent that is up but cannot reach the API would drop
  # its own DNS record.
  publishNotReadyAddresses: true
  selector:
{{ tuple $envAll "neutron" "ironic-agent" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
