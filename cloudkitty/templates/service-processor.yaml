{{/*
The governing service shares manifests.statefulset_processor rather than
carrying its own key: a StatefulSet whose serviceName names a service that
does not exist has no per-ordinal DNS, so the two are never useful apart.
*/}}
{{- if .Values.manifests.statefulset_processor }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudkitty-processor
spec:
  # Named by the processor StatefulSet's serviceName. It publishes the
  # per-ordinal DNS names (cloudkitty-processor-0.cloudkitty-processor...).
  # The processor consumes from RabbitMQ and serves nothing directly, so
  # the service is headless and declares no ports, which Kubernetes allows
  # only for a headless service.
  clusterIP: None
  selector:
{{ tuple $envAll "cloudkitty" "processor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
