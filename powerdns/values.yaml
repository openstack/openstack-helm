# Default values for powerdns.
# This is a YAML-formatted file.
# Declare name/value pairs to be passed into your templates.
# name: value

---
images:
  tags:
    powerdns: docker.io/powerdns/pdns-auth-51:5.1.4
    db_init: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    db_sync: quay.io/airshipit/mariadb:latest-ubuntu_noble
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    image_repo_sync: quay.io/airshipit/docker:27.5.0
  pull_policy: IfNotPresent
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

pod:
  affinity:
    anti:
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
      weight:
        default: 10
  security_context:
    powerdns:
      pod:
        # The image runs pdns_server as the unprivileged pdns user, which
        # has to bind port 53.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
  replicas:
    server: 1
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 3
  resources:
    enabled: false
    server:
      limits:
        memory: "128Mi"
      requests:
        memory: "128Mi"
        cpu: "500m"
    jobs:
      image_repo_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
      tests:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"

labels:
  powerdns:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  test:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - powerdns-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
  static:
    image_repo_sync:
      services:
        - endpoint: internal
          service: local_image_registry
    powerdns:
      jobs:
        - powerdns-db-init
        - powerdns-db-sync
      services:
        - endpoint: internal
          service: oslo_db
    db_init:
      services:
        - endpoint: internal
          service: oslo_db
    db_sync:
      jobs:
        - powerdns-db-init
      services:
        - service: oslo_db
          endpoint: internal

network:
  node_port_enabled: true
  external_policy_local: true

endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  oci_image_registry:
    name: oci-image-registry
    namespace: oci-image-registry
    auth:
      enabled: false
      powerdns:
        username: powerdns
        password: password
    hosts:
      default: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        default: null
  powerdns:
    auth:
      service:
        token: chiave_segreta
    hosts:
      default: powerdns
    host_fqdn_override:
      default: null
    port:
      powerdns_api:
        default: 8081
      powerdns_tcp:
        default: 53
      powerdns:
        default: 53
        protocol: UDP
  oslo_db:
    auth:
      admin:
        username: root
        password: password
      powerdns:
        username: powerdns
        password: password
    hosts:
      default: mariadb
    host_fqdn_override:
      default: null
    path: /powerdns
    scheme: mysql+pymysql
    port:
      mysql:
        default: 3306

secrets:
  oci_image_registry:
    powerdns: powerdns-oci-image-registry-key
  oslo_db:
    admin: powerdns-db-admin
    powerdns: powerdns-db-user

conf:
  powerdns:
    launch: gmysql
    secondary: true
    dnsupdate: true
    api: true
    cache_ttl: 0
    query_cache_ttl: 0
    negquery_cache_ttl: 0
    webserver: true
    webserver_address: 0.0.0.0
    webserver_allow_from: 0.0.0.0/0
    gmysql_dbname: powerdns
    gmysql_dnssec: yes
  mysql:
    client:
      database: powerdns

mariadb_db:
  # -- API group of the MariaDB custom resources this chart renders when
  ## manifests.mariadb_db is enabled. Either group works: the resources are
  ## the same, only who reconciles them differs.
  ##   mariadb.osh.openstack.org -- the mariadb chart's own db controller
  ##                                (manifests.deployment_db_controller)
  ##   k8s.mariadb.com           -- the upstream mariadb-operator, which must
  ##                                then be deployed separately
  api_group: mariadb.osh.openstack.org
  # -- Name of the MariaDB resource the Database, User, Grant and Connection
  ## attach to through mariaDbRef. When empty it is the oslo_db default host,
  ## which only works if the MariaDB resource shares its name with the service
  ## clients connect through. Set it when they differ, such as a MariaDB named
  ## mariadb served by a mariadb-primary service.
  mariadb_ref: ""
  # -- Secret holding the password of the powerdns database account.
  ## The User and Connection resources read it from here.
  password_secret:
    # -- Render the secret from endpoints.oslo_db.auth.powerdns.password. Set
    ## to false to use a secret that already exists. The service config is
    ## still rendered from endpoints.oslo_db.auth.powerdns.password, so the
    ## secret must hold the same password.
    create: true
    name: powerdns-db-password
    key: password

manifests:
  configmap_bin: true
  configmap_etc: true
  deployment: true
  job_db_init: true
  # -- Render the MariaDB Database/User/Grant/Connection custom resources
  ## reconciled by the mariadb chart's db controller, instead of running the
  ## db-init job. Mutually exclusive with job_db_init.
  mariadb_db: false
  job_db_sync: true
  secret_db: true
  secret_registry: true
  service_dns: true
  service_api: false

# -- Extra K8s manifests to deploy. Either a list or a map of manifests.
## Note: Supports use of custom Helm templates
## Note: Helm replaces (instead of merging) list values when several values
## files are combined, so if you need to define extraObjects in more than one
## overrides file, use the map form and make sure the keys are unique across
## those files. With the list form only the last file takes effect.
extraObjects: {}
