---
features:
  - |
    Every chart that sets ``oslo_messaging_rabbit`` now also sets
    ``rabbit_qos_prefetch_count: 1`` and ``rabbit_stream_fanout: true``,
    completing the quorum queue settings recommended for RabbitMQ 4.x.
    Fanout queues become RabbitMQ streams, so they need the ``stream_queue``
    feature flag, which 4.x enables by default.
