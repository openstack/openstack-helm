---
blazar:
  - |
    Run blazar-api under uWSGI, loading the ``blazar.wsgi.api:application``
    module Blazar provides for it, as the other charts run their APIs. The
    ``blazar-api`` command starts its HTTP server in a daemon thread since
    Blazar 2026.2 dropped eventlet, and returns, so the process exits at
    once and the API pod never becomes ready. The uWSGI settings are in
    ``conf.blazar_api_uwsgi``; the API listens on the same port as before.
