---
ceph-provisioners:
  - Point the ceph-csi-config monitor address at the msgr v2 port (3300)
    by default. The "general" StorageClass now defaults to the rbd-nbd
    mounter, whose librbd client speaks msgr v2, but conf.csi_rbd.mon_port
    was still pinned to msgr v1 (6789) from when the mounter was krbd.
  - Scope the ms_mode=legacy map option to krbd. ceph-csi assigns
    unprefixed mapOptions to the krbd mounter only, so the option was
    silently dropped under the rbd-nbd default; it is now spelled
    "krbd:ms_mode=legacy" so its scope is explicit.
...
