---
skyline:
  - |
    Added ``conf.nginx.worker_processes`` to make the nginx
    ``worker_processes`` directive configurable. skyline-apiserver generates
    its ``nginx.conf`` with ``worker_processes auto;``, which spawns one worker
    per visible host CPU. Inside a container/Kubernetes the cgroup CPU limit is
    not respected, so ``auto`` can spawn far more workers than intended and
    drive the pod into the OOMKiller. The ``api-init`` script now rewrites the
    directive when this value is set. It defaults to ``null`` (unset), leaving
    the upstream ``auto`` behaviour unchanged.
