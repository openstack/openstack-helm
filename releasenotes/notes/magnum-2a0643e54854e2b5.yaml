---
magnum:
  - |
    A headless service named ``magnum-conductor`` is now rendered alongside
    the conductor StatefulSet, under the same ``manifests.statefulset_conductor``
    value, as its governing service. The StatefulSet's ``serviceName`` already
    named ``magnum-conductor``, but no such service existed, so the
    per-ordinal DNS names (``magnum-conductor-0.magnum-conductor``) were never
    published. The service declares no ports and is not used to reach the
    conductor.
  - |
    The conductor StatefulSet now renders an ``updateStrategy`` from the newly
    defined ``pod.lifecycle.upgrades.statefulsets`` value, defaulting to
    ``RollingUpdate`` (the Kubernetes default, so existing deployments roll the
    same way). Previously the template rendered no upgrade snippet at all and
    the strategy could not be overridden.
...
