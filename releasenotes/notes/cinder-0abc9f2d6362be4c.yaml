---
cinder:
  - |
    A headless service named ``cinder-volume`` is now rendered alongside the
    opt-in ``cinder-volume`` StatefulSet, under the same
    ``manifests.statefulset_volume`` value, as its governing service. The
    StatefulSet already named it as its ``serviceName``, but the service was
    never rendered, so the per-ordinal DNS names were not published.
  - |
    ``pod.lifecycle.upgrades.statefulsets.pod_replacement_strategy`` is now
    defined, defaulting to ``RollingUpdate``, so
    ``kubernetes_upgrades_statefulset`` renders an explicit update strategy
    for the ``cinder-volume`` StatefulSet instead of nothing, and it can be
    overridden.
...
