---
octavia:
  - |
    The ``octavia-worker-get-port`` and ``octavia-health-manager-get-port`` init
    containers now render a container security context from the new
    ``pod.security_context.octavia_worker.container.octavia_worker_get_port`` and
    ``pod.security_context.octavia_health_manager.container.octavia_health_manager_get_port``
    keys. They were the only containers in those pods without one. The new
    defaults set ``readOnlyRootFilesystem: true`` and
    ``allowPrivilegeEscalation: false``, since the get-port script only runs
    ``openstack port show`` and writes to the ``pod-shared`` volume. This is a
    behaviour change: if you run a custom get-port script that writes outside
    mounted volumes, override these keys.
