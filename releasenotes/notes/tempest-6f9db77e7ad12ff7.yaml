---
tempest:
  - |
    The scenario tests now get a local image file. ``conf.tempest.scenario``
    sets ``img_file`` to a path under ``/tmp`` and ``img_disk_format`` to
    ``qcow2``, and ``run-tests.sh`` downloads ``conf.tempest.image.http_qcow2_image``
    to that path when the file does not exist. Before, ``img_file`` was
    tempest's devstack default and the scenario tests that upload an image
    failed with ``FileNotFoundError``.
