---
ceph-provisioners:
  - Upgrade Ceph CSI to v3.17.1. Ceph v20.2.4 generates aes256k
    CephX keys as required by the CVE-2025-30156 fix. Ceph CSI
    v3.16.2 and earlier cannot parse this key type and fails to
    connect to the cluster.
  - Default the "general" RBD StorageClass to the rbd-nbd mounter
    instead of krbd. Ceph v20.2.4's aes256k CephX keys are only
    understood by the kernel RBD client on Linux 7.0+.
...
