cinder:
  - |
    The ``ceph-coordination-volume-perms``, ``ceph-keyring-placement-*``,
    ``ceph-backup-keyring-placement``, ``ceph-backup-volume-perms`` and
    ``init-cinder-conf`` init containers of the api, scheduler, backup and
    volume pods (Deployment and StatefulSet) now render resource requests and
    limits from the same ``pod.resources`` key as their pod's main container.
    They were skipped before, so with ``pod.resources.enabled`` set those pods
    still contained containers with no requests or limits.
