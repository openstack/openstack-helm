---
octavia:
  - |
    Add the volumes behind pod.mounts.octavia_driver_agent to the octavia-api
    pod. Since the driver agent became an octavia-api sidecar, its
    volumeMounts were mounted into that pod but its volumes were never
    declared there, so any driver agent mount (a CA bundle for a provider
    agent, or mounts carried over from the former standalone driver agent
    Deployment) made the Deployment invalid and failed the upgrade with
    ``volumeMounts[N].name: Not found``. A volume listed under both
    octavia_api and octavia_driver_agent is declared once.
