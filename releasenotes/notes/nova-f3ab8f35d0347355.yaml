nova:
  - |
    The ``nova-compute`` daemonset's ``nova-compute-init``, ``ceph-perms``,
    ``ceph-admin-keyring-placement`` and ``ceph-keyring-placement`` init
    containers now take their requests and limits from
    ``pod.resources.compute``, the ``nova-storage-init`` job's
    ``ceph-keyring-placement`` init container from
    ``pod.resources.jobs.storage_init``, and the ``nova-wait-for-computes-init``
    init containers of the bootstrap and cell setup jobs from
    ``pod.resources.jobs.bootstrap`` and ``pod.resources.jobs.cell_setup``.
    They rendered no resources, so they had no requests or limits even when
    ``pod.resources.enabled`` was ``true``.
