---
upgrade:
  - |
    The default value of ``.Values.extraObjects`` changed from an empty list
    (``[]``) to an empty map (``{}``) in all charts. Both forms are still
    accepted by the ``extra-manifests.yaml`` template, so existing deployments
    that pass a list of manifests keep working unchanged.

    Prefer the map form whenever more than one values file contributes objects.
    Helm merges maps but *replaces* lists, so two ``--values`` files that both
    define ``extraObjects`` as a list silently drop each other's objects and
    only the last file takes effect. With the map form each file only needs
    keys that are unique across the set of files. All ``values_overrides`` in
    this repository were converted accordingly, so that for example
    ``gateway.yaml`` and ``mariadb-operator.yaml`` can now be applied to the
    same chart without one dropping the other's objects.
