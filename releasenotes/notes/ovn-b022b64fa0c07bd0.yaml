---
ovn:
  - |
    Added a liveness probe to the ``ovn-controller`` DaemonSet. In addition
    to the existing readiness probe (which only verifies that the
    ovn-controller process is responsive), the liveness probe checks that
    the OpenFlow management connection to the integration bridge
    (``br-int``) is reachable. This detects and recovers the case where
    ovn-controller is running but wedged in a reconnect loop against
    ``br-int.mgmt`` (for example after a node reboot leaves the socket
    unreachable), which the readiness probe alone does not catch. The probe
    is enabled by default and tunable via
    ``pod.probes.ovn_controller.controller.liveness``.
