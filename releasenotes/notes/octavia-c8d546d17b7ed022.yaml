octavia:
  - |
    The ``octavia-worker`` daemonset now honours
    ``pod.lifecycle.upgrades.daemonsets``. It looked up a ``worker`` key that was
    never defined in ``values.yaml``, so neither ``minReadySeconds`` nor
    ``updateStrategy`` was rendered and ``pod_replacement_strategy`` was silently
    ignored for that daemonset.
