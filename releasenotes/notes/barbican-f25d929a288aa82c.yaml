---
barbican:
  - |
    Added an optional CronJob that runs ``barbican-manage db clean`` to purge
    soft-deleted records from the Barbican database. It is disabled by
    default and can be enabled with ``manifests.cron_db_purge``. The schedule
    is configured under ``jobs.db_purge`` and the cleanup options under
    ``conf.db_purge`` (``min_days``, ``clean_unassociated_projects`` and
    ``soft_delete_expired_secrets``).
