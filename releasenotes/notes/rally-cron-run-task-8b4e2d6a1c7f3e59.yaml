---
rally:
  - |
    Add an optional CronJob to run rally tasks periodically. It is disabled
    by default and can be enabled with ``manifests.cron_job_run_task``. The
    schedule, retry count and history limits are configured under
    ``jobs.cron_run_task``, and reports are stored in a separate PVC
    configured under ``jobs.cron_run_task.pvc``. The PVC is created together
    with the CronJob. Note that rally stores the
    results of every run in its database.
