---
cinder:
  - |
    The ``cinder-backup`` container now also gets the ``DAC_READ_SEARCH``
    capability by default. Since os-brick 6.13.0 (2025.2) the os-brick
    privsep daemon always keeps ``CAP_SYS_ADMIN`` and
    ``CAP_DAC_READ_SEARCH``, and with only ``SYS_ADMIN`` added it could not
    start (``FailedToDropPrivileges: Privsep daemon failed to start``).
    Every backup then stayed in ``creating`` and every restore failed.
...
