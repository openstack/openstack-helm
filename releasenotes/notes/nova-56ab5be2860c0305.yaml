---
nova:
  - |
    The ``nova-archive-deleted-rows`` cron job now waits on the ``nova-db-init``
    and ``nova-db-sync`` jobs before running. Its entrypoint init container
    looked up ``dependencies.static.archive-deleted-rows``, which does not
    exist, instead of the ``dependencies.static.archive_deleted_rows`` entry
    that ``values.yaml`` defines, so it waited on nothing.
  - |
    ``dependencies.static.storage_init`` is now defined for the
    ``nova-storage-init`` job. It is empty because the job only talks to
    Ceph, so the job's behaviour is unchanged, but the dependencies can now
    be overridden.
