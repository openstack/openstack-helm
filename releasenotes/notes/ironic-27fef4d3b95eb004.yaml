---
ironic:
  - |
    Fixed the conductor-init container never creating the conductor's
    ``tempdir``. It did not mount ``ironic.conf`` or the
    ``/var/lib/openstack-helm`` volume, so the ipmitool interface failed to
    load and the conductor exited when ``tempdir`` was under that volume, as
    the default ``/var/lib/openstack-helm/tmp`` is.
