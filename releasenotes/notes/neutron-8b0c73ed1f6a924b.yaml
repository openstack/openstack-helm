---
neutron:
  - |
    The ``neutron-rpc-server``, ``neutron-periodic-worker`` and
    ``neutron-ovn-maintenance-worker`` pods now render custom pod annotations,
    so ``annotations.pod.default`` and the per-application keys reach them like
    every other pod in the chart.

    The ``bagpipe-bgp``, ``bgp-dragent``, ``l2gw-agent`` and ``ironic-agent``
    pods now render AppArmor annotations, so ``pod.mandatory_access_control``
    profiles can be applied to them. Previously the annotation snippet was
    absent from those four templates and any profile set for them was ignored.
...
