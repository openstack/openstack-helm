---
ceph-rgw:
  - |
    Check the gateway's CephX key on startup and rotate it with ``ceph auth
    rotate`` when its length does not match the cluster's preferred client
    cipher (``auth_preferred_cipher``). This lets existing gateways created
    with legacy ``aes`` keys converge on the monmap's preferred cipher
    without new chart values. The check is best effort and never blocks
    gateway startup; it is skipped when the admin keyring is unavailable
    or the preferred cipher cannot be determined.
