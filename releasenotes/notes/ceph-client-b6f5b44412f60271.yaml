---
ceph-client:
  - |
    Commands configured in conf.features.cluster_commands are now run on a
    best-effort basis. A command that fails is logged as a warning in the
    ceph-rbd-pool job and no longer causes the job to fail. This allows
    commands that are only valid in some situations, such as muting a Ceph
    health warning that is not currently active, to be used safely. An empty
    cluster_commands list is also handled without a script syntax error.
