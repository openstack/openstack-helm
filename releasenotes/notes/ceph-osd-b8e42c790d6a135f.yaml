---
ceph-osd:
  - |
    Fix Ceph command retries during OSD startup so transient failures receive
    the full retry budget instead of terminating on the first retry under
    ``set -e``. Commands are attempted up to seven times with ten-second
    intervals, and the final failure status is returned when retries are
    exhausted instead of incorrectly reporting success.

    A failed CRUSH ``create-or-move`` command now prevents the OSD daemon
    from starting, allowing Kubernetes to restart the container rather than
    continuing startup after failed CRUSH registration. Best-effort bucket
    repair commands remain unchanged, and existing unattached OSDs are not
    automatically repaired by this change.
