---
skyline:
  - |
    The ``skyline-db-sync`` container now receives a container security
    context. The job already referenced
    ``pod.security_context.skyline.container.db_sync``, but the key was absent
    from ``values.yaml``, so the container ran with no container-level context
    at all. It is now defined with ``readOnlyRootFilesystem: true``: the
    db-sync script only runs ``alembic upgrade head`` and writes nothing
    outside its ``/tmp`` and ``/etc/skyline`` emptyDir mounts. This is a
    behaviour change; override the key if a custom image needs to write to
    its root filesystem during the migration.
