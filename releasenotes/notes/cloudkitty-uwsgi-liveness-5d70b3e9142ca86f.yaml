---
cloudkitty:
  - |
    Point the cloudkitty-api liveness probe at the uwsgi stats port instead of
    the API port. The API port is answered by the uwsgi request workers, and
    cloudkitty-api runs a single worker, so a slow request failed the liveness
    probe and the pod was killed while it was still serving. The stats socket
    is served by the uwsgi master and answers regardless of worker load.
    Readiness keeps the API port, which is the right signal for taking a busy
    replica out of rotation. Same convention as heat, placement, glance,
    barbican and nova.
