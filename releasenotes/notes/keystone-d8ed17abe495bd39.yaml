keystone:
  - |
    The ``keystone-test-ks-user`` container in the Helm test pod now takes its
    resources from ``pod.resources.jobs.tests``. It read
    ``pod.resources.jobs.ks_user``, which keystone does not define because it
    has no ks-user job, so the container rendered ``resources: null`` even
    when ``pod.resources.enabled`` was set.
