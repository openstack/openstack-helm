---
helm-toolkit:
  - |
    Add the ``helm-toolkit.snippets.ceph_key_rotation`` snippet, a shared set
    of bash helpers for CephX key type management. It provides key length
    mapping (40 chars for ``aes``, 60 for ``aes256k``), key extraction from
    keyring files, ``ceph auth rotate`` with caps preservation, monmap
    cipher lookup (``auth_preferred_cipher`` / ``auth_service_cipher``)
    with a ``config get`` fallback, and best-effort consistency checks for
    cluster-side, local-file, and Kubernetes Secret-backed keys. The
    ``rotate_entity_key`` helper takes an optional key type which it passes
    to ``ceph auth rotate --key-type``, and the consistency checks pass their
    desired key type to it. The
    ceph-mon, ceph-osd and ceph-rgw charts now include this snippet
    instead of carrying their own copies of the key rotation logic, so
    the key type reconciliation behavior documented in those charts is
    maintained in a single place. No chart behavior changes.
