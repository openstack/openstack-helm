ceilometer:
  - |
    End ``instance`` resources in Gnocchi on ``compute.instance.delete.end``
    instead of ``compute.instance.delete.start``. The samples the
    ``delete.end`` notification still produces are newer than an
    ``ended_at`` set at ``delete.start``, and Gnocchi 4.7 and later clears
    ``ended_at`` again when a resource receives newer measures, so deleted
    instances showed up as running again.
