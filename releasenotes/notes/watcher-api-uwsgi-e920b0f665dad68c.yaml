watcher:
  - |
    Run the Watcher API under uWSGI with the ``watcher.wsgi.api:application``
    entry point. From Watcher 2026.2 the services run in native threading
    mode by default, and the ``watcher-api`` command then fails at startup:
    oslo.service refuses its eventlet based ``wsgi.Server`` with the threading
    backend. The uWSGI settings are in ``conf.watcher_api_uwsgi``; the API
    listens on the same port as before.
