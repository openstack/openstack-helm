---
other:
  - |
    The ``deploy-env`` Ansible role no longer reports success when a tool
    install silently fails. ``crictl`` is now fetched with ``get_url`` and
    retried instead of a ``wget`` shell block that swallowed HTTP errors,
    the ``cilium`` download is retried, and the multi-command ``shell``
    blocks in the role set ``set -e``/``pipefail`` so a failing command
    other than the last one fails its task.
  - |
    The ``deploy-env`` playbook now sets ``any_errors_fatal``, and the tasks
    that read facts registered on another host assert that the fact is
    present first. A failure on one node previously let the remaining nodes
    continue and fail later on a missing ``hostvars`` attribute, which
    reported the wrong host and buried the original error.
...
