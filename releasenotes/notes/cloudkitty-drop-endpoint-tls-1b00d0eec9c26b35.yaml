---
cloudkitty:
  - |
    The MariaDB client certificate is now issued as a dedicated per-chart
    certificate (``secrets.tls.client.cloudkitty``, minted by
    ``certificates.yaml`` when ``tls.oslo_db`` is enabled) instead of reusing
    the MariaDB server certificate via the removed
    ``endpoints.oslo_db.auth.admin.secret.tls`` value. This aligns cloudkitty
    with the other OpenStack charts.
