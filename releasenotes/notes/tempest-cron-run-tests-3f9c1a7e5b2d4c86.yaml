---
tempest:
  - |
    Add an optional CronJob to run tempest tests periodically. It is disabled
    by default and can be enabled with ``manifests.cron_job_run_tests``. The
    schedule, retry count and history limits are configured under
    ``jobs.cron_run_tests``, and reports are stored in a separate PVC
    configured under ``jobs.cron_run_tests.pvc``. The PVC is created together
    with the CronJob.
