---
barbican:
  - |
    Point the barbican-api liveness probe at the uwsgi stats port instead of
    /healthcheck. /healthcheck is answered by the request workers, so a
    saturated worker pool failed the liveness probe and the pod was killed
    while still serving. Readiness keeps using /healthcheck, which is the
    right signal for taking a busy replica out of rotation. Same convention
    as heat, placement and glance.
