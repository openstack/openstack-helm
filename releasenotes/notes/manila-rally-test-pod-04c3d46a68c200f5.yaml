---
manila:
  - |
    Fix the manila-test Pod that helm test runs, which could not start.
    The chart never defined images.tags.test, so the Pod was rejected
    with ``spec.containers[0].image: Required value``; it now defaults to
    the xrally-openstack image the other charts' rally tests use. The
    keystone secret of the test user (secrets.identity.test) was never
    rendered either, so once the Pod was accepted it stayed Pending with
    ``secret "manila-keystone-test" not found``; it is now rendered with
    the admin and manila secrets.
