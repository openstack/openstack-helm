---
keystone:
  - |
    Added eight custom resource definitions in the
    ``keystone.osh.openstack.org/v1alpha1`` API group -- ``Domain``,
    ``Project``, ``Role``, ``Group``, ``User``, ``RoleAssignment``,
    ``Service`` and ``Endpoint`` -- rendered by ``templates/crds.yaml``
    and gated on
    ``manifests.crds``, together with the ``keystone-identity-controller``
    deployment that reconciles them, gated on
    ``manifests.deployment_identity_controller`` and off by default.
  - |
    ``RoleAssignment`` grants a role to either a user or a group, and ``Group``
    describes a Keystone group. Neither is used by the charts converted here,
    which grant roles to service users directly; they exist because a
    federated deployment has no user to name -- identities arrive from the
    identity provider as shadow users and are mapped into groups, which carry
    the role assignments.
  - |
    The controller is a single-file Python reconciler polling the Kubernetes
    API and applying each resource to Keystone: find it, patch it if a field
    drifted, create it if absent. Readiness is reported as a
    ``metav1.Condition`` of type ``Ready``, so ``kubectl wait
    --for=condition=Ready`` works, and every kind joins the ``keystone``
    category, so ``kubectl get keystone`` lists a namespace's identity
    resources. It runs on the ``openstack-client`` image the chart already
    pulls and needs nothing added to it, reaching Kubernetes with the official
    ``kubernetes`` client and Keystone with ``openstacksdk``. Because
    ``openstacksdk`` loads its auth plugin from the environment, an alternative
    keystoneauth plugin configured through ``identity.openrc`` is honoured.

cinder:
  - |
    Added ``manifests.identity_entities``, off by default, which renders this
    chart's keystone user, roles and catalog entries as custom resources in
    ``templates/identity-entities.yaml`` instead of running the ``ks_user``,
    ``ks_service`` and ``ks_endpoints`` jobs. Enable it with
    ``values_overrides/cinder/identity-entities.yaml``.

