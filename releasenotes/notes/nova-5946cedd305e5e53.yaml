---
nova:
  - |
    Headless services named ``nova-conductor`` and ``nova-scheduler`` are now
    rendered under ``manifests.statefulset_conductor`` and
    ``manifests.statefulset_scheduler``, and one named after the ironic
    compute StatefulSet's existing ``serviceName`` (``ironic-api-compute`` by
    default) under ``manifests.statefulset_compute_ironic``. Each StatefulSet
    named a governing service that the chart never rendered, so their pods
    had no per-ordinal DNS names.
  - |
    ``pod.lifecycle.upgrades.statefulsets.pod_replacement_strategy`` is now
    defined as ``RollingUpdate``. The conductor and scheduler StatefulSets
    looked it up but it was never defined, so they rendered no
    ``updateStrategy``, and the ironic compute StatefulSet now renders it
    too. ``RollingUpdate`` is also the Kubernetes default, so the rollout
    behaviour is unchanged unless you override the value.
...
