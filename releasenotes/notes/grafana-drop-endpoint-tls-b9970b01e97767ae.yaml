grafana:
  - |
    The MariaDB client certificate for both the grafana and session databases
    is now issued as a dedicated per-chart certificate
    (``secrets.tls.client.grafana``, minted by ``certificates.yaml`` when
    ``tls.oslo_db``/``tls.oslo_db_session`` is enabled) instead of reusing the
    MariaDB server certificate via the removed
    ``endpoints.oslo_db.auth.admin.secret.tls`` values.
