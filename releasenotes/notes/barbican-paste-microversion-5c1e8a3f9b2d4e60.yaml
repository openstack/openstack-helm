---
fixes:
  - |
    The default ``conf.paste`` pipelines now include the ``microversion``
    and ``request_id`` middleware, matching the paste file shipped by
    Barbican. Without the microversion middleware the API ignored the
    ``OpenStack-API-Version`` header and served every request as 1.0, so
    secret consumers (1.1), consumer-protected secret deletion (1.2) and,
    where Barbican supports it, the secret store endpoints (1.3) were
    unavailable.
...
