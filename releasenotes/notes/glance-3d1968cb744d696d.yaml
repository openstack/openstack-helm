---
glance:
  - |
    ``glance-api`` now configures the ``[barbican]`` section used by
    castellan: ``auth_endpoint`` and ``barbican_region_name`` are taken from
    the identity endpoint and ``barbican_endpoint_type`` is ``internal``.
    Without them castellan tried to authenticate against
    ``http://localhost/identity/v3`` and every upload of a signed image
    failed with ``Unable to retrieve certificate``.
