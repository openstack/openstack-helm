- job:
    name: openstack-helm-compute-kit-2026-1-ubuntu_noble
    description: |
      The baseline deployment: Ceph via Rook, the compute kit, and cinder on
      top of it with an RBD backend. This used to be two jobs -- compute-kit on
      3 nodes and cinder on the 5-node rook nodeset -- which between them never
      tested the thing an operator actually cares about, because the cinder job
      deployed no compute and so never attached a volume to a VM. Deploying
      both in one job is what lets nova_test.sh get past its "is there a volume
      service" check and run the attach, so the extra two nodes buy coverage
      rather than just consolidating two jobs into one.
    parent: openstack-helm-deploy
    nodeset: openstack-helm-5nodes-ubuntu_noble
    run:
      - playbooks/deploy-env.yaml
      - playbooks/deploy-compute-kit.yaml
    vars:
      osh_openstack_client_image_tag: "2026.1-ubuntu_noble"
      osh_values_overrides:
        - "2026.1-ubuntu_noble.yaml"
        - "gateway.yaml"

- job:
    name: openstack-helm-tls-2026-1-ubuntu_noble
    description: |
      Run the openstack-helm compute-kit job with TLS terminated end to end:
      at the Envoy Gateway for public endpoints and by per-pod nginx sidecars
      for the in-cluster API services (tls-gateway-and-sidecar.yaml per-chart
      override), plus mariadb and rabbitmq mTLS. In addition to the compute kit
      this also deploys Ceph, cinder and horizon so their TLS sidecars are
      exercised too (hence the 5-node rook nodeset).
    parent: openstack-helm-deploy
    nodeset: openstack-helm-5nodes-ubuntu_noble
    run:
      - playbooks/deploy-env.yaml
      - playbooks/deploy-compute-kit.yaml
    vars:
      # Besides installing cert-manager, this also makes the Envoy Gateway
      # terminate TLS: it adds the HTTPS:443 listener to the gateway and
      # creates the gateway-tls server certificate (see the deploy-env role
      # public_endpoints.yaml tasks).
      cert_manager_setup: true
      osh_openstack_client_image_tag: "2026.1-ubuntu_noble"
      osh_openstack_client_tls: true
      # Ceph and cinder come with the playbook's defaults; horizon does not,
      # and is added here so its nginx TLS sidecar is exercised by this job.
      horizon_enabled: true
      osh_values_overrides:
        - "2026.1-ubuntu_noble.yaml"
        - "tls-gateway-and-sidecar.yaml"
        - "mariadb-tls.yaml"
        - "messaging-tls.yaml"

- job:
    name: openstack-helm-dpdk-2026-1-ubuntu_noble
    description: |
      Run the openstack-helm compute-kit job with DPDK enabled.
      We use single node environment to run this job which means
      that the job only tests that QEMU and OVS-DPDK are working
      together. The job does not assume having specific DPDK hardware.
    parent: openstack-helm-deploy
    nodeset: openstack-helm-1node-32GB-ubuntu_noble
    pre-run:
      - playbooks/enable-hugepages.yaml
      - playbooks/prepare-hosts.yaml
    run:
      - playbooks/deploy-env.yaml
      - playbooks/deploy-compute-kit.yaml
    vars:
      hugepages:
        enabled: true
        size: "2M"
        number: 2048
      osh_openstack_client_image_tag: "2026.1-ubuntu_noble"
      cinder_enabled: false
      osh_values_overrides:
        - "2026.1-ubuntu_noble.yaml"
        - "gateway.yaml"
        - "dpdk.yaml"
    files:
      - ^roles/.*
      - ^openvswitch/.*
      - ^nova/.*
      - ^neutron/.*

