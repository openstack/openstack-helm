    parent: openstack-helm-deploy
    nodeset: openstack-helm-4nodes-ubuntu_noble
    run:
      - playbooks/deploy-env.yaml
      - playbooks/deploy-octavia.yaml
    vars:
      osh_openstack_client_image_tag: "2026.1-ubuntu_noble"
      osh_values_overrides:
        - "2026.1-ubuntu_noble.yaml"
        - "gateway.yaml"
    files:
      - ^octavia/.*
      - ^values_overrides/octavia/.*
      - ^playbooks/deploy-octavia\.yaml
      # The amphora certificate chain, the Heat test environment and the
      # octavia_resources/octavia_certs/octavia_test tasks all live in the
      # deploy-charts role and are used by no other job.
      - ^roles/deploy-charts/.*octavia.*
      # Barbican: this is the only job in the check pipeline that deploys it.
      # The tacker job does too, but its own files filter keeps it to tacker
      # changes, and no always-run job touches barbican at all -- so without
      # these two lines a barbican change would get no deployment coverage.
      - ^barbican/.*
      - ^values_overrides/barbican/.*

