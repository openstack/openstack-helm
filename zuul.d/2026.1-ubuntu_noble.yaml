- job:
    name: openstack-helm-crd-2026-1-ubuntu_noble
    description: |
      Deploy the compute kit plus Ceph and cinder with every backing-service
      resource the charts can declare managed as a custom resource, reconciled
      by the controllers that ship in the openstack-helm charts themselves.

      Databases: every chart that owns one -- keystone, cinder, heat, glance,
      placement, nova and neutron -- renders Database/User/Grant/Connection
      custom resources (manifests.mariadb_db) for the mariadb chart's db
      controller, instead of running the per-chart db-init jobs
      (manifests.job_db_init=false). This exercises the single-database case,
      the multi-database case (nova owns nova, nova_cell0 and nova_cell1 behind
      one account) and the non-default config section case (placement writes
      [placement_database]).

      Messaging: every chart that uses it -- keystone, cinder, glance, heat,
      nova and neutron -- renders Vhost/User/Permission/Policy custom resources
      (manifests.rabbitmq_topology) for the rabbitmq chart's topology
      controller, instead of running the per-chart rabbit-init jobs
      (manifests.job_rabbit_init=false). The verify-rabbitmq-topology.sh step
      at the end of the playbook waits for every resource to report Ready,
      reads the vhosts and accounts back out of the broker, and asserts the
      guest account is gone and no rabbit-init job remains -- without it the
      job would pass whether or not any of this worked, because oslo.messaging
      retries forever.

      Keystone resources are expected to join this job once the keystone CRDs
      land: the point of one job rather than one per resource kind is that a
      real deployment turns all of them on at once, and only a job that does
      the same can catch them interfering.

      The 5-node rook nodeset is needed because cinder is deployed with a Ceph
      backend; cinder is deployed because it carries both sets of overrides.
    parent: openstack-helm-deploy
    nodeset: openstack-helm-5nodes-ubuntu_noble
    run:
      - playbooks/deploy-env.yaml
      - playbooks/deploy-compute-kit.yaml
    vars:
      osh_openstack_client_image_tag: "2026.1-ubuntu_noble"
      osh_values_overrides:
        - "2026.1-ubuntu_noble.yaml"
        - "gateway.yaml"
        - "mariadb-crd.yaml"
        - "rabbitmq-crd.yaml"

- job:
    name: openstack-helm-operators-2026-1-ubuntu_noble
    description: |
      The crd job with third-party operators doing the reconciling. The charts
      render exactly the same custom resources from exactly the same overrides;
      the *-operator.yaml files layered on top change only which API group they
      are rendered into -- mariadb_db.api_group to k8s.mariadb.com and
      rabbitmq_topology.api_group to rabbitmq.com -- so the upstream
      mariadb-operator and messaging-topology-operator reconcile them instead
      of the openstack-helm controllers. Everything else is identical to the
      crd job, which is what makes a difference between the two attributable to
      the reconciler. That interchangeability is the compatibility claim these
      resources exist to support, and this is the job that tests it.

      Neither the mariadb chart nor the rabbitmq chart is deployed here. The
      database is a single operator-managed MariaDB instance rather than a
      Galera cluster, and the broker is a RabbitmqCluster managed by the
      upstream cluster operator -- which the topology operator also needs in
      order to resolve rabbitmqClusterReference.name, and whose client service
      is what the charts address once the rabbitmq chart's per-pod statefulset
      addressing is dropped. cert-manager is deployed because the RabbitMQ
      operators' webhooks take their certificates from it; mariadb-operator
      brings its own cert-controller.
    parent: openstack-helm-deploy
    nodeset: openstack-helm-5nodes-ubuntu_noble
    run:
      - playbooks/deploy-env.yaml
      - playbooks/deploy-mariadb-operator.yaml
      - playbooks/deploy-rabbitmq-operator.yaml
      - playbooks/deploy-compute-kit.yaml
    vars:
      osh_openstack_client_image_tag: "2026.1-ubuntu_noble"
      cert_manager_setup: true
      # Make deploy-compute-kit skip the mariadb and rabbitmq charts: the
      # database and the broker are already there, created by the two
      # deploy-*-operator playbooks above.
      mariadb_operator_enabled: true
      rabbitmq_operator_enabled: true
      osh_values_overrides:
        - "2026.1-ubuntu_noble.yaml"
        - "gateway.yaml"
        - "mariadb-crd.yaml"
        - "mariadb-operator.yaml"
        - "rabbitmq-crd.yaml"
        - "rabbitmq-operator.yaml"
...
