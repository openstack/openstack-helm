- job:
    name: openstack-helm-compute-kit-2025-2-ubuntu_noble_loci
    description: |
      The same deployment as openstack-helm-compute-kit-2025-2-ubuntu_noble --
      Ceph via Rook, the compute kit, and cinder with an RBD backend on top of
      it -- built from LOCI images instead of the default ones. Keeping the two
      the same shape is the point: a failure here is attributable to the
      images, not to a different set of services being deployed.
    parent: openstack-helm-deploy
    nodeset: openstack-helm-5nodes-ubuntu_noble
    run:
      - playbooks/deploy-env.yaml
      - playbooks/deploy-compute-kit.yaml
    vars:
      osh_openstack_client_image_tag: "2025.2-ubuntu_noble"
      osh_values_overrides:
        - "loci-2025.2-ubuntu_noble.yaml"
        - "gateway.yaml"
...
