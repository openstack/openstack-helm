{{- if .Values.manifests.job_credential_cleanup }}
{{- $envAll := index . -}}

{{- $serviceName := "keystone" -}}
{{- $nodeSelector := index . "nodeSelector" | default ( dict $envAll.Values.labels.job.node_selector_key $envAll.Values.labels.job.node_selector_value ) -}}
{{- $configMapBin := "keystone-bin" -}}
{{- $configMapEtc := "keystone-etc" -}}

{{- $etcSources := $envAll.Values.pod.etcSources.keystone_credential_cleanup -}}
{{- if $envAll.Values.manifests.mariadb_db }}
{{- $etcSources = append $etcSources (dict "secret" (dict "name" "keystone-db-conn")) }}
{{- end }}

{{ tuple $envAll "credential_cleanup" $serviceName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: "keystone-credential-cleanup"
  labels:
{{ tuple $envAll "keystone" "credential-cleanup" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": hook-succeeded, hook-failed
{{ tuple "keystone_credential_cleanup" $envAll | include "helm-toolkit.snippets.custom_job_annotations" | indent 4 }}
spec:
  template:
    metadata:
      labels:
{{ tuple $envAll $serviceName "credential-cleanup" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
{{ tuple "keystone_credential_cleanup" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "keystone_credential_cleanup" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceName }}
      restartPolicy: Never
{{ if $envAll.Values.pod.tolerations.keystone.enabled }}
{{ tuple $envAll "keystone" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      nodeSelector:
{{ toYaml $nodeSelector | indent 8 }}
      initContainers:
{{ tuple $envAll "credential_cleanup" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: {{ printf "%s-%s" $serviceName "credential-cleanup" | quote }}
          image: {{ $envAll.Values.images.tags.keystone_credential_cleanup }}
          imagePullPolicy: {{ $envAll.Values.images.pull_policy }}
{{ tuple $envAll $envAll.Values.pod.resources.jobs.db_drop | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          env:
{{- if and $envAll.Values.tls.oslo_db $envAll.Values.secrets.tls.client.keystone }}
            - name: MARIADB_X509
              value: "REQUIRE X509"
{{- end }}
          command:
            - python
            - /tmp/cred-clean.py
            - --config-file
            - /etc/keystone/keystone.conf
            - --config-dir
            - /etc/keystone/keystone.conf.d/
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: cred-clean-sh
              mountPath: /tmp/cred-clean.py
              subPath: cred-clean.py
              readOnly: true
            - name: etckeystone
              mountPath: /etc/keystone
            - name: keystone-etc
              mountPath: /etc/keystone/keystone.conf
              subPath: keystone.conf
              readOnly: true
            - name: keystone-etc
              mountPath: /etc/keystone/logging.conf
              subPath: logging.conf
              readOnly: true
            - name: keystone-etc-snippets
              mountPath: /etc/keystone/keystone.conf.d/
              readOnly: true

{{- if and $envAll.Values.tls.oslo_db $envAll.Values.secrets.tls.client.keystone }}
{{- dict "enabled" $envAll.Values.tls.oslo_db "name" "client-certs" "path" "/etc/mysql/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{- end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: cred-clean-sh
          configMap:
            name: "keystone-bin"
            defaultMode: 0555
{{- if and $envAll.Values.tls.oslo_db $envAll.Values.secrets.tls.client.keystone }}
{{- dict "enabled" (or $envAll.Values.tls.oslo_db $envAll.Values.tls.oslo_messaging) "name" "client-certs" "secretName" $envAll.Values.secrets.tls.client.keystone | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{- end }}
        - name: etckeystone
          emptyDir: {}
        - name: keystone-etc
          secret:
            secretName: "keystone-etc"
            defaultMode: 0444
        - name: keystone-etc-snippets
{{- if $etcSources }}
          projected:
            sources:
{{ toYaml $etcSources | indent 14 }}
{{- else }}
          emptyDir: {}
{{- end -}}
{{- end -}}
