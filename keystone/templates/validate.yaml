{{- /*
AppArmor profiles can no longer be set per container under
pod.mandatory_access_control, fail rather than silently dropping them.
*/}}
{{- $mac := .Values.pod.mandatory_access_control | default dict }}
{{- if and $mac.type (eq $mac.type "apparmor") }}
{{- range $podName := list
  "keystone-api"
  "keystone-credential-cleanup"
  "keystone-credential-setup"
  "keystone-domain-manage"
  "keystone-fernet-setup"
  "keystone-test"
}}
{{- if index $mac $podName }}
{{- fail "AppArmor profiles can no longer be set per container under pod.mandatory_access_control, set appArmorProfile under pod.security_context instead." }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
keystone-api runs uWSGI, not Apache. The Apache values are gone, fail rather
than silently dropping an Apache configuration, for example the auth module
setup of a federated deployment. Run Apache as a sidecar instead, see the
comment on conf.keystone_api_uwsgi.
*/}}
{{- range $key := list "security" "software" "mpm_event" "wsgi_script" "wsgi_keystone" }}
{{- if hasKey $.Values.conf $key }}
{{- fail (printf "conf.%s is no longer used: keystone-api runs uWSGI (conf.keystone_api_uwsgi). To keep the Apache auth modules, run Apache as a sidecar with pod.extraContainers.keystone_api, see the comment on conf.keystone_api_uwsgi in the chart values." $key) }}
{{- end }}
{{- end }}
