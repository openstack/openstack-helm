{{/*
The controller reconciling the Domain/Project/Role/Group/User/
RoleAssignment/Service/Endpoint custom resources. It holds the only copy of the Keystone
administrative credentials that provisioning needs, which is the point: the
per-chart ks-service, ks-user and ks-endpoints jobs it replaces each mount
their own copy.
*/}}

{{- if .Values.manifests.deployment_identity_controller }}
{{- $envAll := . }}

{{- $serviceAccountName := "keystone-identity-controller" }}
{{ tuple $envAll "identity_controller" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $envAll.Release.Name }}-{{ $serviceAccountName }}
  namespace: {{ $envAll.Release.Namespace }}
rules:
  - apiGroups:
      - keystone.osh.openstack.org
    resources:
      - domains
      - projects
      - roles
      - groups
      - users
      - roleassignments
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - keystone.osh.openstack.org
    resources:
      - domains/status
      - projects/status
      - roles/status
      - groups/status
      - users/status
      - roleassignments/status
      - services/status
      - endpoints/status
    verbs:
      - get
      - update
      - patch
  {{/*
  Read only: the passwords the User resources reference are rendered by the
  consumer charts, and this controller never writes one back.
  */}}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $envAll.Release.Name }}-{{ $serviceAccountName }}
  namespace: {{ $envAll.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $envAll.Release.Name }}-{{ $serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ $envAll.Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystone-identity-controller
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "keystone" "identity-controller" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.identity_controller }}
  selector:
    matchLabels:
{{ tuple $envAll "keystone" "identity-controller" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  {{/*
  Recreate rather than a rolling update: with a surge two reconcilers would
  briefly run at once. Everything they do is idempotent so an overlap is
  survivable, but two of them probing the same user's password doubles the
  failed-login count that [security_compliance] lockout_failure_attempts sees.
  */}}
  strategy:
    type: Recreate
  revisionHistoryLimit: {{ .Values.pod.lifecycle.upgrades.deployments.revision_history }}
  template:
    metadata:
      labels:
{{ tuple $envAll "keystone" "identity-controller" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "identity_controller" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      affinity:
{{ tuple $envAll "keystone" "identity-controller" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
{{ if $envAll.Values.pod.tolerations.keystone.enabled }}
{{ tuple $envAll "keystone" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      nodeSelector:
        {{ .Values.labels.identity_controller.node_selector_key }}: {{ .Values.labels.identity_controller.node_selector_value }}
      initContainers:
{{ tuple $envAll "identity_controller" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: identity-controller
{{ tuple $envAll "identity_controller" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ dict "envAll" $envAll "application" "identity_controller" "container" "identity_controller" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.identity_controller | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          command:
            - /tmp/identity_controller.py
          env:
{{ include "helm-toolkit.utils.to_k8s_env_vars" .Values.pod.env.identity_controller | indent 12 }}
            - name: IDENTITY_CONTROLLER_NAMESPACE
              value: {{ $envAll.Release.Namespace }}
            {{/*
            The Keystone this controller answers for. A resource pointing at a
            different one is left untouched.
            */}}
            - name: IDENTITY_CONTROLLER_KEYSTONE_REF_NAME
              value: {{ index $envAll.Values.endpoints.identity.hosts "default" | quote }}
{{- $identityOpenrc := dict }}
{{- if hasKey $envAll.Values "identity" }}
{{- if hasKey $envAll.Values.identity "openrc" }}
{{- $identityOpenrc = $envAll.Values.identity.openrc }}
{{- end }}
{{- end }}
{{- $tlsSecret := "" }}
{{- if $envAll.Values.secrets.tls.ca }}
{{- $tlsSecret = $envAll.Values.secrets.tls.ca }}
{{- end }}
{{- $env := dict "ksUserSecret" $envAll.Values.secrets.identity.admin -}}
{{- $_ := set $env "useCA" (ne $tlsSecret "") -}}
{{- $_ := set $env "excludeVars" ($identityOpenrc.exclude_vars | default list) -}}
{{- $_ := set $env "extraVars" ($identityOpenrc.extra_vars | default list) -}}
{{- include "helm-toolkit.snippets.keystone_openrc_env_vars" $env | indent 12 }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: keystone-bin
              mountPath: /tmp/identity_controller.py
              subPath: identity_controller.py
              readOnly: true
{{ dict "enabled" (ne $tlsSecret "") "name" $tlsSecret "ca" true | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: keystone-bin
          configMap:
            name: keystone-bin
            defaultMode: 0555
{{- dict "enabled" (ne $tlsSecret "") "name" $tlsSecret | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{- end }}
