{{- /*
MariaDB custom resources declaring the databases this chart owns. They are
reconciled by the mariadb chart's db controller, which creates the database,
the account and its grants, and writes the connection string into the secret
named below as an oslo.config snippet.

Enable this instead of the db-init job, and null out the connection in
conf.octavia.database and conf.octavia.task_flow so the projected snippets are
the only source. See values_overrides/octavia/mariadb-crd.yaml.
*/}}
{{- if .Values.manifests.mariadb_db }}
{{- $envAll := . }}
{{- if .Values.manifests.job_db_init }}
{{- fail "manifests.mariadb_db and manifests.job_db_init are mutually exclusive, set manifests.job_db_init to false" }}
{{- end }}
{{- /*
The API group is chosen in values, so the same resources can be reconciled
either by the mariadb chart's own db controller or by the upstream
mariadb-operator. Two things differ between the two targets:
Connection.retryInterval does not exist upstream and is omitted, and the
password placeholder is .PasswordEncoded here but .Password upstream, which
renders no percent-encoded variant. A password containing a character that is
reserved in a URI therefore needs the osh group.
*/}}
{{- $apiGroup := .Values.mariadb_db.api_group }}
{{- $osh := eq $apiGroup "mariadb.osh.openstack.org" }}
{{- if not (or $osh (eq $apiGroup "k8s.mariadb.com")) }}
{{- fail (printf "mariadb_db.api_group must be mariadb.osh.openstack.org or k8s.mariadb.com, not %s" $apiGroup) }}
{{- end }}
{{- $apiVersion := printf "%s/v1alpha1" $apiGroup }}
{{- $mariadbHost := index .Values.endpoints.oslo_db.hosts "default" }}
{{- /* The MariaDB resource to attach to. Its name need not match the service
clients connect through, which is what $mariadbHost is. */}}
{{- $mariadbRef := .Values.mariadb_db.mariadb_ref | default $mariadbHost }}
{{- $auth := .Values.endpoints.oslo_db.auth.octavia }}
{{- $passwordSecret := .Values.mariadb_db.password_secret }}
{{- /*
octavia reaches both of its databases with one account, so there is one User
for the two of them. The persistence endpoint's own credentials are no longer
read by anything once its connection comes from the Connection secret, so
they must agree with the main ones rather than silently diverge.
*/}}
{{- $persistenceAuth := .Values.endpoints.oslo_db_persistence.auth.octavia }}
{{- if or (ne $persistenceAuth.username $auth.username) (ne $persistenceAuth.password $auth.password) }}
{{- fail "endpoints.oslo_db_persistence.auth.octavia must match endpoints.oslo_db.auth.octavia: both databases are reached with one account" }}
{{- end }}

{{- /*
One account for both octavia databases. Its password is read from a secret. By
default the chart renders that secret from endpoints.oslo_db.auth.octavia,
which puts the password in the Helm values. Set
mariadb_db.password_secret.create to false to reference a secret that already
exists, such as one synced from an external secret store, so the password
never passes through Helm.
*/}}
{{- if $passwordSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $passwordSecret.name }}
  labels:
{{ tuple $envAll "octavia" "db-password" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
type: Opaque
data:
  {{ $passwordSecret.key }}: {{ $auth.password | b64enc }}
{{- end }}
---
apiVersion: {{ $apiVersion }}
kind: User
metadata:
  name: {{ $auth.username | replace "_" "-" | lower }}
  labels:
{{ tuple $envAll "octavia" "db-user" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
    waitForIt: true
  {{- /* Only set spec.name when the MariaDB name is not a valid object
  name, such as one with an underscore. It defaults to metadata.name. */}}
  {{- if ne ($auth.username | replace "_" "-" | lower) $auth.username }}
  name: {{ $auth.username | quote }}
  {{- end }}
  host: "%"
  passwordSecretKeyRef:
    name: {{ $passwordSecret.name }}
    key: {{ $passwordSecret.key }}
  {{- /* 0 means unlimited. Anything else throttles the service. */}}
  maxUserConnections: 0
  retryInterval: 10s

{{- /* The octavia database. */}}
{{- $octaviaName := .Values.endpoints.oslo_db.path | trimPrefix "/" }}
---
apiVersion: {{ $apiVersion }}
kind: Database
metadata:
  name: {{ $octaviaName | replace "_" "-" | lower }}
  labels:
{{ tuple $envAll "octavia" "db-database" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
    waitForIt: true
  {{- /* Only set spec.name when the MariaDB name is not a valid object
  name, such as one with an underscore. It defaults to metadata.name. */}}
  {{- if ne ($octaviaName | replace "_" "-" | lower) $octaviaName }}
  name: {{ $octaviaName | quote }}
  {{- end }}
  characterSet: utf8
  collate: utf8_general_ci
  retryInterval: 10s
---
apiVersion: {{ $apiVersion }}
kind: Grant
metadata:
  name: octavia
  labels:
{{ tuple $envAll "octavia" "db-grant" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
    waitForIt: true
  privileges:
    - ALL
  database: {{ $octaviaName | quote }}
  table: "*"
  username: {{ $auth.username | quote }}
  host: "%"
  grantOption: false
  retryInterval: 10s
---
apiVersion: {{ $apiVersion }}
kind: Connection
metadata:
  name: octavia-db-conn
  labels:
{{ tuple $envAll "octavia" "db-connection" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
  serviceName: {{ $mariadbHost | quote }}
  host: {{ tuple "oslo_db" "internal" $envAll | include "helm-toolkit.endpoints.endpoint_host_lookup" | quote }}
  port: {{ tuple "oslo_db" "internal" "mysql" $envAll | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
  username: {{ $auth.username | quote }}
  passwordSecretKeyRef:
    name: {{ $passwordSecret.name }}
    key: {{ $passwordSecret.key }}
  database: {{ $octaviaName | quote }}
  secretName: octavia-db-conn
  secretTemplate:
    {{- /* One file per config section, so several connection secrets can be
    projected into the same config directory without colliding. oslo.config
    reads every .conf file in that directory. */}}
    key: database.conf
    {{- /* The placeholders are rendered by the controller, not by Helm, so they
    are escaped here. TLS parameters go in the format string rather than
    spec.params because ssl_verify_cert takes no value and a string map would
    emit a trailing equals sign. */}}
    format: |
      [database]
      connection = {{ .Values.endpoints.oslo_db.scheme }}://{{ `{{ .Username }}` }}:{{ if $osh }}{{ `{{ .PasswordEncoded }}` }}{{ else }}{{ `{{ .Password }}` }}{{ end }}@{{ `{{ .Host }}` }}:{{ `{{ .Port }}` }}/{{ `{{ .Database }}` }}?charset=utf8
  healthCheck:
    interval: 30s
    retryInterval: 3s
{{- if $osh }}
  {{- /* Not a field upstream has; it paces the osh controller's retries. */}}
  retryInterval: 10s
{{- end }}

{{- /* The taskflow persistence database. */}}
{{- $persistenceName := .Values.endpoints.oslo_db_persistence.path | trimPrefix "/" }}
---
apiVersion: {{ $apiVersion }}
kind: Database
metadata:
  name: {{ $persistenceName | replace "_" "-" | lower }}
  labels:
{{ tuple $envAll "octavia" "db-database" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
    waitForIt: true
  {{- /* Only set spec.name when the MariaDB name is not a valid object
  name, such as one with an underscore. It defaults to metadata.name. */}}
  {{- if ne ($persistenceName | replace "_" "-" | lower) $persistenceName }}
  name: {{ $persistenceName | quote }}
  {{- end }}
  characterSet: utf8
  collate: utf8_general_ci
  retryInterval: 10s
---
apiVersion: {{ $apiVersion }}
kind: Grant
metadata:
  name: octavia-persistence
  labels:
{{ tuple $envAll "octavia" "db-grant" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
    waitForIt: true
  privileges:
    - ALL
  database: {{ $persistenceName | quote }}
  table: "*"
  username: {{ $auth.username | quote }}
  host: "%"
  grantOption: false
  retryInterval: 10s
---
apiVersion: {{ $apiVersion }}
kind: Connection
metadata:
  name: octavia-persistence-db-conn
  labels:
{{ tuple $envAll "octavia" "db-connection" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  mariaDbRef:
    name: {{ $mariadbRef | quote }}
  serviceName: {{ $mariadbHost | quote }}
  host: {{ tuple "oslo_db_persistence" "internal" $envAll | include "helm-toolkit.endpoints.endpoint_host_lookup" | quote }}
  port: {{ tuple "oslo_db_persistence" "internal" "mysql" $envAll | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
  username: {{ $auth.username | quote }}
  passwordSecretKeyRef:
    name: {{ $passwordSecret.name }}
    key: {{ $passwordSecret.key }}
  database: {{ $persistenceName | quote }}
  secretName: octavia-persistence-db-conn
  secretTemplate:
    {{- /* One file per config section, so several connection secrets can be
    projected into the same config directory without colliding. oslo.config
    reads every .conf file in that directory. */}}
    key: task_flow.conf
    {{- /* The placeholders are rendered by the controller, not by Helm, so they
    are escaped here. TLS parameters go in the format string rather than
    spec.params because ssl_verify_cert takes no value and a string map would
    emit a trailing equals sign. */}}
    format: |
      [task_flow]
      persistence_connection = {{ .Values.endpoints.oslo_db_persistence.scheme }}://{{ `{{ .Username }}` }}:{{ if $osh }}{{ `{{ .PasswordEncoded }}` }}{{ else }}{{ `{{ .Password }}` }}{{ end }}@{{ `{{ .Host }}` }}:{{ `{{ .Port }}` }}/{{ `{{ .Database }}` }}?charset=utf8
  healthCheck:
    interval: 30s
    retryInterval: 3s
{{- if $osh }}
  {{- /* Not a field upstream has; it paces the osh controller's retries. */}}
  retryInterval: 10s
{{- end }}
{{- end }}
