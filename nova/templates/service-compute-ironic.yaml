{{/*
The governing service shares manifests.statefulset_compute_ironic rather
than carrying its own key: a StatefulSet whose serviceName names a service
that does not exist has no per-ordinal DNS, so the two are never useful
apart. Its name must match the StatefulSet's serviceName, which Kubernetes
does not allow to change on an existing StatefulSet.
*/}}
{{- if .Values.manifests.statefulset_compute_ironic }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ tuple "baremetal" "internal" . | include "helm-toolkit.endpoints.hostname_short_endpoint_lookup" }}-compute
spec:
  # Named by the ironic compute StatefulSet's serviceName. It publishes the
  # per-ordinal DNS names (nova-compute-ironic-0.<service>...). The ironic
  # compute service consumes from RabbitMQ and serves nothing directly, so
  # the service is headless and declares no ports, which Kubernetes allows
  # only for a headless service.
  clusterIP: None
  selector:
{{ tuple $envAll "nova" "compute-ironic" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
