---
# Provision this chart's database with mariadb-operator
# (https://github.com/mariadb-operator/mariadb-operator) instead of the
# chart's db-init job. The custom resources below ask the operator to create
# the database, the user and its grants, and to render the connection string
# into a secret.
#
# extraObjects is passed through tpl, so the Go placeholders in
# secretTemplate.format are escaped -- an unescaped placeholder is evaluated
# by Helm against the chart context and replaced with nothing long before the
# resource reaches the operator.

manifests:
  job_db_init: false

# The connection string is no longer generated into the service config; the
# operator's secret is projected into the service config directory instead,
# and oslo.config reads every *.conf found there. A projected volume source
# is not optional, so kubelet holds a pod in ContainerCreating until the
# secret exists -- which is what makes db-sync wait for the database.
conf:
  nova:
    api_database:
      connection: null
    database:
      connection: null

pod:
  etcSources:
    nova_api_osapi:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_api_metadata:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_conductor:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_scheduler:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_db_sync:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_cell_setup:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_novncproxy:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_serialproxy:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_spiceproxy:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_archive_deleted_rows:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn
    nova_service_cleaner:
      - secret:
          name: nova-db-conn
      - secret:
          name: nova-cell1-db-conn

# extraObjects is a map, not a list: Helm replaces lists when it merges -f
# files, so a list here would silently drop the objects declared by any other
# override file passed alongside this one -- the Gateway API routes in
# gateway.yaml, for instance. Map entries merge. The keys are arbitrary; the
# chart's extra-manifests.yaml ranges over the values.
extraObjects:
  # Nothing in the chart creates this secret, but the operator needs it both
  # to create the user and to render the connection string. It is taken from
  # the same value the chart's own database secrets are built from.
  db-password-nova:
    apiVersion: v1
    kind: Secret
    metadata:
      name: nova-db-password
      namespace: "{{ .Release.Namespace }}"
    type: Opaque
    data:
      password: "{{ .Values.endpoints.oslo_db.auth.nova.password | b64enc }}"
  db-user-nova:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: User
    metadata:
      name: nova
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      name: "{{ .Values.endpoints.oslo_db.auth.nova.username }}"
      passwordSecretKeyRef:
        name: nova-db-password
        key: password
      # This field is immutable and defaults to 10, 0 means unlimited.
      maxUserConnections: 0
      host: "%"
      retryInterval: 5s
  database-nova:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Database
    metadata:
      name: nova
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      name: nova
      characterSet: utf8
      collate: utf8_general_ci
      retryInterval: 5s
  grant-nova:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Grant
    metadata:
      name: nova-grant
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      privileges:
        - "ALL"
      database: "nova"
      table: "*"
      username: "{{ .Values.endpoints.oslo_db.auth.nova.username }}"
      grantOption: false
      host: "%"
      retryInterval: 5s
  connection-nova:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Connection
    metadata:
      name: nova-db-conn
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb
      username: "{{ .Values.endpoints.oslo_db.auth.nova.username }}"
      passwordSecretKeyRef:
        name: nova-db-password
        key: password
      database: nova
      secretName: nova-db-conn
      secretTemplate:
        key: api_db_conn.conf
        format: |
          [api_database]
          connection = mysql+pymysql://{{ `{{ .Username }}` }}:{{ `{{ .Password }}` }}@{{ `{{ .Host }}` }}:{{ `{{ .Port }}` }}/{{ `{{ .Database }}` }}{{ `{{ .Params }}` }}
      healthCheck:
        interval: 30s
        retryInterval: 3s
      serviceName: mariadb
  database-nova-cell1:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Database
    metadata:
      name: nova-cell1
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      # An underscore is not valid in a Kubernetes object
      # name, so spec.name carries the database name.
      name: nova_cell1
      characterSet: utf8
      collate: utf8_general_ci
      retryInterval: 5s
  grant-nova-cell1:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Grant
    metadata:
      name: nova-cell1-grant
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      privileges:
        - "ALL"
      database: "nova_cell1"
      table: "*"
      username: "{{ .Values.endpoints.oslo_db_cell1.auth.nova.username }}"
      grantOption: false
      host: "%"
      retryInterval: 5s
  connection-nova-cell1:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Connection
    metadata:
      name: nova-cell1-db-conn
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb
      username: "{{ .Values.endpoints.oslo_db_cell1.auth.nova.username }}"
      passwordSecretKeyRef:
        name: nova-db-password
        key: password
      database: nova_cell1
      secretName: nova-cell1-db-conn
      secretTemplate:
        key: db_conn.conf
        format: |
          [database]
          connection = mysql+pymysql://{{ `{{ .Username }}` }}:{{ `{{ .Password }}` }}@{{ `{{ .Host }}` }}:{{ `{{ .Port }}` }}/{{ `{{ .Database }}` }}{{ `{{ .Params }}` }}
      healthCheck:
        interval: 30s
        retryInterval: 3s
      serviceName: mariadb
  database-nova-cell0:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Database
    metadata:
      name: nova-cell0
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      # An underscore is not valid in a Kubernetes object
      # name, so spec.name carries the database name.
      name: nova_cell0
      characterSet: utf8
      collate: utf8_general_ci
      retryInterval: 5s
  grant-nova-cell0:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Grant
    metadata:
      name: nova-cell0-grant
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      privileges:
        - "ALL"
      database: "nova_cell0"
      table: "*"
      username: "{{ .Values.endpoints.oslo_db_cell0.auth.nova.username }}"
      grantOption: false
      host: "%"
      retryInterval: 5s
...
