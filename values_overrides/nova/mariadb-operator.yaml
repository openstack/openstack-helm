---
# Target the upstream mariadb-operator instead of the mariadb chart's own db
# controller. This changes exactly one value, so the two deployments differ
# only in who reconciles the custom resources. The chart derives the API group
# of everything that names those resources, such as the waits on a
# Connection, from this value.
mariadb_db:
  api_group: k8s.mariadb.com
...
