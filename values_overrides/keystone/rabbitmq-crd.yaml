---
# Provision this chart's messaging account declaratively: the chart renders
# RabbitMQ Vhost/User/Permission custom resources
# (templates/rabbitmq-topology.yaml) which the rabbitmq chart's topology
# controller reconciles, instead of running the rabbit-init job with the
# RabbitMQ administrative connection URI mounted into this namespace.
#
# Nothing else changes: the transport URL is already rendered from
# endpoints.oslo_messaging into the service configuration.
manifests:
  job_rabbit_init: false
  rabbitmq_topology: true
...
