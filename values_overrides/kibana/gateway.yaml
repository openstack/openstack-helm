# Gateway API overrides for Kibana.
#
# Public endpoints use *.openstack-helm.org FQDNs which are resolved by
# dnsmasq to the MetalLB Gateway VIP. In-cluster pods reach the Gateway
# through this DNS path so no ExternalName services are needed.
---
endpoints:
  kibana:
    host_fqdn_override:
      public:
        host: kibana.openstack-helm.org

extraObjects:
  kibana_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: kibana-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.kibana.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            # As for Prometheus and Nagios: 5601 is the port inside the pod,
            # and the Service publishes only the "http" port (80), which is
            # the apache proxy that fronts Kibana with basic auth.
            - name: kibana-dash
              port: 80
...
