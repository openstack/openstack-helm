# Gateway API overrides for Tempest.
#
# Horizon is published on horizon.openstack-helm.org (see
# values_overrides/horizon/gateway.yaml) and has no "horizon" Service in
# the cluster, so point the dashboard tests at that FQDN.
---
endpoints:
  dashboard:
    host_fqdn_override:
      public:
        host: horizon.openstack-helm.org
...
