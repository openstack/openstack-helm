# Gateway API overrides for Nagios.
#
# Public endpoints use *.openstack-helm.org FQDNs which are resolved by
# dnsmasq to the MetalLB Gateway VIP. In-cluster pods reach the Gateway
# through this DNS path so no ExternalName services are needed.
---
endpoints:
  nagios:
    host_fqdn_override:
      public:
        host: nagios.openstack-helm.org

extraObjects:
  nagios_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: nagios-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.nagios.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            # As for Prometheus: 8000 is the port inside the pod, and the
            # Service publishes only the "http" port (80), which is the apache
            # proxy that fronts Nagios with basic auth.
            - name: nagios-metrics
              port: 80
...
