---
# Enable the OVN provider driver (ovn-octavia-provider) next to the amphora
# driver. The driver runs in the octavia-api container and connects to the
# OVN northbound database; its provider agent runs in the
# octavia-driver-agent container and connects to both OVN databases (see
# endpoints.ovn_ovsdb_nb and endpoints.ovn_ovsdb_sb). Neutron must use the
# OVN ML2 driver, and the image must contain ovn-octavia-provider and
# python3-unbound.
conf:
  octavia:
    api_settings:
      enabled_provider_drivers: "amphora:The Octavia Amphora driver.,ovn:The Octavia OVN driver."
    driver_agent:
      enabled_provider_agents: ovn
...
