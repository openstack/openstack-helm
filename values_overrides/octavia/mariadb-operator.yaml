---
# Provision this chart's database with mariadb-operator
# (https://github.com/mariadb-operator/mariadb-operator) instead of the
# chart's db-init job. The custom resources below ask the operator to create
# the database, the user and its grants, and to render the connection string
# into a secret.
#
# extraObjects is passed through tpl, so the Go placeholders in
# secretTemplate.format are escaped -- an unescaped placeholder is evaluated
# by Helm against the chart context and replaced with nothing long before the
# resource reaches the operator.

manifests:
  job_db_init: false
  secret_db_persistence: false

# The connection string is no longer generated into the service config; the
# operator's secret is projected into the service config directory instead,
# and oslo.config reads every *.conf found there. A projected volume source
# is not optional, so kubelet holds a pod in ContainerCreating until the
# secret exists -- which is what makes db-sync wait for the database.
conf:
  octavia:
    database:
      connection: null
    task_flow:
      persistence_connection: null

pod:
  etcSources:
    octavia_api:
      - secret:
          name: octavia-db-conn
      - secret:
          name: octavia-persistence-db-conn
    octavia_db_sync:
      - secret:
          name: octavia-db-conn
      - secret:
          name: octavia-persistence-db-conn
    octavia_worker:
      - secret:
          name: octavia-db-conn
      - secret:
          name: octavia-persistence-db-conn
    octavia_housekeeping:
      - secret:
          name: octavia-db-conn
      - secret:
          name: octavia-persistence-db-conn
    octavia_health_manager:
      - secret:
          name: octavia-db-conn
      - secret:
          name: octavia-persistence-db-conn
    octavia_driver_agent:
      - secret:
          name: octavia-db-conn
      - secret:
          name: octavia-persistence-db-conn

# extraObjects is a map, not a list: Helm replaces lists when it merges -f
# files, so a list here would silently drop the objects declared by any other
# override file passed alongside this one -- the Gateway API routes in
# gateway.yaml, for instance. Map entries merge. The keys are arbitrary; the
# chart's extra-manifests.yaml ranges over the values.
extraObjects:
  # Nothing in the chart creates this secret, but the operator needs it both
  # to create the user and to render the connection string. It is taken from
  # the same value the chart's own database secrets are built from.
  db-password-octavia:
    apiVersion: v1
    kind: Secret
    metadata:
      name: octavia-db-password
      namespace: "{{ .Release.Namespace }}"
    type: Opaque
    data:
      password: "{{ .Values.endpoints.oslo_db.auth.octavia.password | b64enc }}"
  db-user-octavia:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: User
    metadata:
      name: octavia
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      name: "{{ .Values.endpoints.oslo_db.auth.octavia.username }}"
      passwordSecretKeyRef:
        name: octavia-db-password
        key: password
      # This field is immutable and defaults to 10, 0 means unlimited.
      maxUserConnections: 0
      host: "%"
      retryInterval: 5s
  database-octavia:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Database
    metadata:
      name: octavia
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      name: octavia
      characterSet: utf8
      collate: utf8_general_ci
      retryInterval: 5s
  grant-octavia:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Grant
    metadata:
      name: octavia-grant
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      privileges:
        - "ALL"
      database: "octavia"
      table: "*"
      username: "{{ .Values.endpoints.oslo_db.auth.octavia.username }}"
      grantOption: false
      host: "%"
      retryInterval: 5s
  connection-octavia:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Connection
    metadata:
      name: octavia-db-conn
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb
      username: "{{ .Values.endpoints.oslo_db.auth.octavia.username }}"
      passwordSecretKeyRef:
        name: octavia-db-password
        key: password
      database: octavia
      secretName: octavia-db-conn
      secretTemplate:
        key: db_conn.conf
        format: |
          [database]
          connection = mysql+pymysql://{{ `{{ .Username }}` }}:{{ `{{ .Password }}` }}@{{ `{{ .Host }}` }}:{{ `{{ .Port }}` }}/{{ `{{ .Database }}` }}{{ `{{ .Params }}` }}
      healthCheck:
        interval: 30s
        retryInterval: 3s
      serviceName: mariadb
  database-octavia-persistence:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Database
    metadata:
      name: octavia-persistence
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      # An underscore is not valid in a Kubernetes object
      # name, so spec.name carries the database name.
      name: octavia_persistence
      characterSet: utf8
      collate: utf8_general_ci
      retryInterval: 5s
  grant-octavia-persistence:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Grant
    metadata:
      name: octavia-persistence-grant
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      privileges:
        - "ALL"
      database: "octavia_persistence"
      table: "*"
      username: "{{ .Values.endpoints.oslo_db_persistence.auth.octavia.username }}"
      grantOption: false
      host: "%"
      retryInterval: 5s
  connection-octavia-persistence:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Connection
    metadata:
      name: octavia-persistence-db-conn
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb
      username: "{{ .Values.endpoints.oslo_db_persistence.auth.octavia.username }}"
      passwordSecretKeyRef:
        name: octavia-db-password
        key: password
      database: octavia_persistence
      secretName: octavia-persistence-db-conn
      secretTemplate:
        key: persistence_db_conn.conf
        format: |
          [task_flow]
          persistence_connection = mysql+pymysql://{{ `{{ .Username }}` }}:{{ `{{ .Password }}` }}@{{ `{{ .Host }}` }}:{{ `{{ .Port }}` }}/{{ `{{ .Database }}` }}{{ `{{ .Params }}` }}
      healthCheck:
        interval: 30s
        retryInterval: 3s
      serviceName: mariadb
...
