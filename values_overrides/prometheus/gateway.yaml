# Gateway API overrides for Prometheus.
#
# Public endpoints use *.openstack-helm.org FQDNs which are resolved by
# dnsmasq to the MetalLB Gateway VIP. In-cluster pods reach the Gateway
# through this DNS path so no ExternalName services are needed.
---
endpoints:
  monitoring:
    host_fqdn_override:
      public:
        host: prometheus.openstack-helm.org

extraObjects:
  prometheus_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: prometheus-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.monitoring.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            # The "api" port (9090) is where Prometheus itself listens, inside
            # the pod. The Service publishes only the "http" port (80), which
            # is the apache-proxy container that fronts Prometheus with basic
            # auth -- so a route to 9090 names a port the Service does not
            # have and the Gateway is left with no backend to send to.
            - name: prom-metrics
              port: 80
...
