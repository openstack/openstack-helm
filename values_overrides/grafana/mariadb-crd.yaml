---
# Provision this chart's databases declaratively: the chart renders MariaDB
# Database/User/Grant/Connection custom resources (templates/mariadb-db.yaml)
# which the mariadb chart's db controller reconciles, instead of running the
# db-init jobs.
#
# grafana is the exception to how the other charts consume them: it is not an
# oslo.config service, so nothing is projected into a config directory. The
# grafana server, set-admin-user and run-migrator read grafana-db-conn as the
# GF_DATABASE_URL environment variable, which grafana gives precedence over
# [database] url in grafana.ini, so that is nulled here and the variable is
# the only source. The grafana_session URI lands under DB_CONNECTION, the key
# db-session-sync already reads, so pointing secrets.oslo_db_session.user at
# that secret is all it takes to consume it, so the chart no longer has to
# render a session secret of its own.

manifests:
  job_db_init: false
  job_db_init_session: false
  mariadb_db: true
  secret_db_session: false

secrets:
  oslo_db_session:
    user: grafana-session-db-conn

conf:
  grafana:
    database:
      url: null

# Every other chart's consumers wait for their connection secret through a
# projected volume, which kubelet will not mount until the secret exists.
# grafana's are read from environment variables instead, which get no such
# gate, so each waits on the resource itself. Waiting on the Ready condition
# rather than on the secret also means each starts only once the reconciler
# has verified the credentials work.
dependencies:
  static:
    db_session_sync:
      custom_resources:
        - apiVersion: mariadb.osh.openstack.org/v1alpha1
          kind: Connection
          name: grafana-session-db-conn
          conditions:
            - type: Ready
    set_admin_user:
      custom_resources:
        - apiVersion: mariadb.osh.openstack.org/v1alpha1
          kind: Connection
          name: grafana-db-conn
          conditions:
            - type: Ready
    run_migrator:
      custom_resources:
        - apiVersion: mariadb.osh.openstack.org/v1alpha1
          kind: Connection
          name: grafana-db-conn
          conditions:
            - type: Ready
    grafana:
      custom_resources:
        - apiVersion: mariadb.osh.openstack.org/v1alpha1
          kind: Connection
          name: grafana-db-conn
          conditions:
            - type: Ready
...
