---
# Provision this chart's database with mariadb-operator
# (https://github.com/mariadb-operator/mariadb-operator) instead of the
# chart's db-init job. The custom resources below ask the operator to create
# the database, the user and its grants, and to render the connection string
# into a secret.
#
# extraObjects is passed through tpl, so the Go placeholders in
# secretTemplate.format are escaped -- an unescaped placeholder is evaluated
# by Helm against the chart context and replaced with nothing long before the
# resource reaches the operator.

manifests:
  job_db_init: false
  job_db_init_session: false

# grafana has no pod.etcSources support -- none of its workload templates
# mount a config snippet directory -- so the connection secret below cannot
# be projected into the service config. The chart therefore keeps generating
# the connection string from endpoints.oslo_db, which resolves to the same
# user, password and database the operator provisions here. Once the chart
# gains etcSources support, null conf.grafana.database.url and project
# grafana-db-conn instead.

# extraObjects is a map, not a list: Helm replaces lists when it merges -f
# files, so a list here would silently drop the objects declared by any other
# override file passed alongside this one -- the Gateway API routes in
# gateway.yaml, for instance. Map entries merge. The keys are arbitrary; the
# chart's extra-manifests.yaml ranges over the values.
extraObjects:
  # Nothing in the chart creates this secret, but the operator needs it both
  # to create the user and to render the connection string. It is taken from
  # the same value the chart's own database secrets are built from.
  db-password-grafana:
    apiVersion: v1
    kind: Secret
    metadata:
      name: grafana-db-password
      namespace: "{{ .Release.Namespace }}"
    type: Opaque
    data:
      password: "{{ .Values.endpoints.oslo_db.auth.user.password | b64enc }}"
  db-user-grafana:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: User
    metadata:
      name: grafana
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      name: "{{ .Values.endpoints.oslo_db.auth.user.username }}"
      passwordSecretKeyRef:
        name: grafana-db-password
        key: password
      # This field is immutable and defaults to 10, 0 means unlimited.
      maxUserConnections: 0
      host: "%"
      retryInterval: 5s
  # Nothing in the chart creates this secret, but the operator needs it both
  # to create the user and to render the connection string. It is taken from
  # the same value the chart's own database secrets are built from.
  db-password-grafana-session:
    apiVersion: v1
    kind: Secret
    metadata:
      name: grafana-session-db-password
      namespace: "{{ .Release.Namespace }}"
    type: Opaque
    data:
      password: "{{ .Values.endpoints.oslo_db_session.auth.user.password | b64enc }}"
  db-user-grafana-session:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: User
    metadata:
      name: grafana-session
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      name: "{{ .Values.endpoints.oslo_db_session.auth.user.username }}"
      passwordSecretKeyRef:
        name: grafana-session-db-password
        key: password
      # This field is immutable and defaults to 10, 0 means unlimited.
      maxUserConnections: 0
      host: "%"
      retryInterval: 5s
  database-grafana:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Database
    metadata:
      name: grafana
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      name: grafana
      characterSet: utf8
      collate: utf8_general_ci
      retryInterval: 5s
  grant-grafana:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Grant
    metadata:
      name: grafana-grant
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      privileges:
        - "ALL"
      database: "grafana"
      table: "*"
      username: "{{ .Values.endpoints.oslo_db.auth.user.username }}"
      grantOption: false
      host: "%"
      retryInterval: 5s
  connection-grafana:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Connection
    metadata:
      name: grafana-db-conn
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb
      username: "{{ .Values.endpoints.oslo_db.auth.user.username }}"
      passwordSecretKeyRef:
        name: grafana-db-password
        key: password
      database: grafana
      secretName: grafana-db-conn
      secretTemplate:
        key: db_conn.conf
        format: |
          [database]
          url = mysql+pymysql://{{ `{{ .Username }}` }}:{{ `{{ .Password }}` }}@{{ `{{ .Host }}` }}:{{ `{{ .Port }}` }}/{{ `{{ .Database }}` }}{{ `{{ .Params }}` }}
      healthCheck:
        interval: 30s
        retryInterval: 3s
      serviceName: mariadb
  database-grafana-session:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Database
    metadata:
      name: grafana-session
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      # An underscore is not valid in a Kubernetes object
      # name, so spec.name carries the database name.
      name: grafana_session
      characterSet: utf8
      collate: utf8_general_ci
      retryInterval: 5s
  grant-grafana-session:
    apiVersion: k8s.mariadb.com/v1alpha1
    kind: Grant
    metadata:
      name: grafana-session-grant
      namespace: "{{ .Release.Namespace }}"
    spec:
      mariaDbRef:
        name: mariadb  # name of the MariaDB kind
        waitForIt: true
      privileges:
        - "ALL"
      database: "grafana_session"
      table: "*"
      username: "{{ .Values.endpoints.oslo_db_session.auth.user.username }}"
      grantOption: false
      host: "%"
      retryInterval: 5s
...
