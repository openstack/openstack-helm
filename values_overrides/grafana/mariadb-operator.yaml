---
# Target the upstream mariadb-operator instead of the mariadb chart's own db
# controller. This file is layered on top of mariadb-crd.yaml and changes
# exactly one value, so the two deployments differ only in who reconciles the
# custom resources -- everything else, including which secrets are projected
# into which workloads, is whatever mariadb-crd.yaml says.
#
# On its own this file provisions nothing: manifests.mariadb_db stays false
# without mariadb-crd.yaml.
mariadb_db:
  api_group: k8s.mariadb.com

# Restated rather than merged: Helm replaces lists across -f files, so the
# entries from mariadb-crd.yaml would be dropped whatever this file said. They
# have to be repeated anyway, because each dependency names the API group and
# this override is what changes it.
dependencies:
  static:
    db_session_sync:
      custom_resources:
        - apiVersion: k8s.mariadb.com/v1alpha1
          kind: Connection
          name: grafana-session-db-conn
          conditions:
            - type: Ready
    set_admin_user:
      custom_resources:
        - apiVersion: k8s.mariadb.com/v1alpha1
          kind: Connection
          name: grafana-db-conn
          conditions:
            - type: Ready
    run_migrator:
      custom_resources:
        - apiVersion: k8s.mariadb.com/v1alpha1
          kind: Connection
          name: grafana-db-conn
          conditions:
            - type: Ready
    grafana:
      custom_resources:
        - apiVersion: k8s.mariadb.com/v1alpha1
          kind: Connection
          name: grafana-db-conn
          conditions:
            - type: Ready
...
