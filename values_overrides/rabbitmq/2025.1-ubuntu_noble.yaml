images:
  tags:
    prometheus_rabbitmq_exporter_helm_tests: quay.io/airshipit/openstack-client:2025.1-ubuntu_noble
    rabbitmq_init: quay.io/airshipit/openstack-client:2025.1-ubuntu_noble
    # Keep this deployment on RabbitMQ 3.x, so that the 2025.1 jobs cover the
    # rabbitmqadmin v1 path of the rabbit-init script and the 2026.1 jobs cover
    # v2. 3.13 rather than the 3.10.18 airshipit image: it is the release an
    # operator must reach before moving to 4.x, so it is the version worth
    # proving the charts still work on, and it accepts the
    # queue_leader_locator setting the chart now renders, which the older
    # queue_master_locator name replaced.
    rabbitmq: docker.io/rabbitmq:3.13
    rabbitmq_test: quay.io/airshipit/openstack-client:2025.1-ubuntu_noble
    scripted_test: docker.io/rabbitmq:3.13-management
