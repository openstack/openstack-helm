{{- if .Values.manifests.deployment_server }}
{{- $envAll := . }}
{{- $mounts_tacker_server := .Values.pod.mounts.tacker_server.tacker_server }}
{{- $mounts_tacker_server_init := .Values.pod.mounts.tacker_server.init_container }}
{{- $serviceAccountName := "tacker-server" }}
{{ tuple $envAll "server" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tacker-server
  labels:
{{ tuple $envAll "tacker" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll "tacker" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  replicas: {{ .Values.pod.replicas.server }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "tacker" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
{{ tuple "tacker_server" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
      nodeSelector:
        {{ .Values.labels.server.node_selector_key }}: {{ .Values.labels.server.node_selector_value }}
      serviceAccountName: tacker-server
{{ dict "envAll" $envAll "application" "server" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.server.timeout | default "30" }}
      containers:
        - name: tacker-server
          image: {{ .Values.images.tags.tacker_server }}
          imagePullPolicy: {{ .Values.images.pull_policy }}
{{ tuple $envAll $envAll.Values.pod.resources.server | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          command:
            - /bin/bash
            - -c
            - /tmp/tacker-server.sh
          volumeMounts:
{{ if $mounts_tacker_server.volumeMounts }}{{ toYaml $mounts_tacker_server.volumeMounts | indent 10 }}{{ end }}
          - name: localtime
            mountPath: "/etc/localtime"
            readOnly: yes
          - name: tacker-etc
            mountPath: "/etc/tacker/config.json"
            readOnly: yes
            subPath: config-server.json
          - name: tacker-etc
            mountPath: "/etc/tacker/api-paste.ini"
            readOnly: yes
            subPath: api-paste.ini
          - name: tacker-etc
            mountPath: "/etc/tacker/tacker.conf"
            readOnly: yes
            subPath: tacker.conf
          - name: tacker-etc
            mountPath: "/etc/tacker/logging.conf"
            readOnly: yes
            subPath: logging.conf
{{- range $key, $volume := $envAll.Values.storage.volumes }}
          - name: {{ $key | replace "_" "-" }}
            mountPath: {{ $volume.mount_path | quote }}
            readOnly: false
{{- end }}
          - name: tacker-server-sh
            mountPath: /tmp/tacker-server.sh
            subPath: tacker-server.sh
            readOnly: true
          - name: oslo-lock-path
            mountPath: {{ .Values.conf.tacker.oslo_concurrency.lock_path }}
          ports:
          - name: t-api
            containerPort: 9890
      initContainers:
{{ tuple $envAll "server" $mounts_tacker_server_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      volumes:
{{ if $mounts_tacker_server.volumes }}{{ toYaml $mounts_tacker_server.volumes | indent 8 }}{{ end }}
        - name: localtime
          hostPath:
            path: "/etc/localtime"
        - name: tacker-etc
          secret:
            defaultMode: 292
            secretName: tacker-etc
{{- range $key, $volume := $envAll.Values.storage.volumes }}
        - name: {{ $key | replace "_" "-" }}
          persistentVolumeClaim:
            claimName: {{ $volume.name }}
{{- end }}
        - name: tacker-server-sh
          configMap:
            name: tacker-bin
            defaultMode: 0555
        - name: oslo-lock-path
          emptyDir: {}
{{- end }}
