{{/*
manifests.deployment_conductor defaulted to true, so an override that set it
to false to disable the conductor would otherwise be silently ignored after
the rename and the conductor would start.
*/}}
{{- if hasKey .Values.manifests "deployment_conductor" }}
{{- fail "manifests.deployment_conductor has been renamed to manifests.statefulset_conductor" }}
{{- end }}

{{- if .Values.manifests.statefulset_conductor }}
{{- $envAll := . }}
{{- $mounts_tacker_conductor := .Values.pod.mounts.tacker_conductor.tacker_conductor }}
{{- $mounts_tacker_conductor_init := .Values.pod.mounts.tacker_conductor.init_container }}
{{- $serviceAccountName := "tacker-conductor" }}
{{ tuple $envAll "conductor" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tacker-conductor
  labels:
{{ tuple $envAll "tacker" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  # Not tacker-conductor, as neutron's naming would have it: the chart used to
  # render a ClusterIP service of that name, and a service's clusterIP cannot
  # be changed to None in place, so reusing the name would fail the upgrade.
  serviceName: tacker-conductor-headless
  selector:
    matchLabels:
{{ tuple $envAll "tacker" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  replicas: {{ .Values.pod.replicas.conductor }}
  podManagementPolicy: Parallel
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_statefulset" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "tacker" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
{{ tuple "tacker_conductor" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
      nodeSelector:
        {{ .Values.labels.conductor.node_selector_key }}: {{ .Values.labels.conductor.node_selector_value }}
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "conductor" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: application
                operator: In
                values:
                - tacker
              - key: component
                operator: In
                values:
                - server
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.conductor.timeout | default "30" }}
      containers:
        - name: tacker-conductor
          image: {{ .Values.images.tags.tacker_conductor }}
          imagePullPolicy: {{ .Values.images.pull_policy }}
          command:
            - /bin/bash
            - -c
            - /tmp/tacker-conductor.sh
          volumeMounts:
{{ if $mounts_tacker_conductor.volumeMounts }}{{ toYaml $mounts_tacker_conductor.volumeMounts | indent 10 }}{{ end }}
          - name: localtime
            mountPath: "/etc/localtime"
            readOnly: yes
          - name: tacker-etc
            mountPath: "/etc/tacker/config.json"
            readOnly: yes
            subPath: config-conductor.json
          - name: tacker-etc
            mountPath: "/etc/tacker/api-paste.ini"
            readOnly: yes
            subPath: api-paste.ini
          - name: tacker-etc
            mountPath: "/etc/tacker/tacker.conf"
            readOnly: yes
            subPath: tacker.conf
          - name: tacker-etc
            mountPath: "/etc/tacker/logging.conf"
            readOnly: yes
            subPath: logging.conf
{{- range $key, $volume := $envAll.Values.storage.volumes }}
          - name: {{ $key | replace "_" "-" }}
            mountPath: {{ $volume.mount_path | quote }}
            readOnly: false
{{- end }}
          - name: tacker-conductor-sh
            mountPath: /tmp/tacker-conductor.sh
            subPath: tacker-conductor.sh
            readOnly: true
          - name: oslo-lock-path
            mountPath: {{ .Values.conf.tacker.oslo_concurrency.lock_path }}
      initContainers:
{{ tuple $envAll "conductor" $mounts_tacker_conductor_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      volumes:
{{ if $mounts_tacker_conductor.volumes }}{{ toYaml $mounts_tacker_conductor.volumes | indent 8 }}{{ end }}
        - name: localtime
          hostPath:
            path: "/etc/localtime"
        - name: tacker-etc
          secret:
            defaultMode: 292
            secretName: tacker-etc
{{- range $key, $volume := $envAll.Values.storage.volumes }}
        - name: {{ $key | replace "_" "-" }}
          persistentVolumeClaim:
            claimName: {{ $volume.name }}
{{- end }}
        - name: tacker-conductor-sh
          configMap:
            name: tacker-bin
            defaultMode: 0555
        - name: oslo-lock-path
          emptyDir: {}
{{- end }}
